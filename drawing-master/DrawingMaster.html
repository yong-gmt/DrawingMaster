     back) gets a primitive made for it now, so the model can always draw itself
     in full rather than being limited by whatever the file happened to contain. */
  const host=(pg.objects||[]).find(o=>o._dim===m.id);
  const put=(s)=>{ let e=byRole[s.role];
    if(!e){ if(s.hidden || !host || (!s.a && !s.pts)) return;
      const p={_src:'DIMENSION', _dim:m.id, _role:s.role, pts:[], dash:null,
               _section:false, _lw:DIM_LW, _dimPart:true};
      /* into the DRAWING as well: a stroke that lives only in the object list is
         gone the next time the objects are rebuilt, and a dimension that had to
         make a piece for itself would lose it on reopening */
      if(pg.dxf && pg.dxf.polys) pg.dxf.polys.push(p);
      host.prims.polys.push(p); e=byRole[s.role]={o:host, p}; }
    const dx=e.o.dx||0, dy=e.o.dy||0;
    const src=s.pts || (s.a? [s.a, s.b] : null);
    e.p.pts=(s.hidden||!src)? [] : src.map(q=>[q[0]-dx, q[1]-dy]);
    if(!s.hidden && s.arrow && (s.arrow.s||s.arrow.e)) e.p._arrow={s:!!s.arrow.s,e:!!s.arrow.e,h:s.arrow.h,w:s.arrow.w};
    else delete e.p._arrow; };

     the roles present were being written, so a stub the arc once ran out to stayed
     on the paper after the value was brought back in - a stroke belonging to a
     shape that no longer exists. */
  const live=new Set([].concat(g.ext||[], g.segs||[]).map(s=>s.role));

    e.p.pts=[]; delete e.p._arrow;

         V.t.rot=g.text.rot; V.t.text=g.text.str; V.t.h=m.text.h; V.t.align=1; }

}
/* Import-time moves (centring, cluster guard) must carry the model with them, or

function dimTranslate(m, dx, dy){

    m.ends=(m.ends||[]).map(p=>[p[0]+dx, p[1]+dy]);
    return;
  }
  if(m.kind==='radial'||m.kind==='diameter'){
    m.centre=[m.centre[0]+dx, m.centre[1]+dy];
    m.point =[m.point[0]+dx,  m.point[1]+dy];

  m.measure.p2=[m.measure.p2[0]+dx, m.measure.p2[1]+dy];

function dimRelayout(pg){

function dimModelsOf(pg){ return (pg && pg.dxf && pg.dxf.dims) || []; }
function dimModelById(pg, id){ const l=dimModelsOf(pg); for(const m of l) if(m.id===id && m.ok) return m; return null; }

/* ============================================================================
   §9  SECTION MARKER MODEL
   ----------------------------------------------------------------------------
   A cutting-plane marker means something: the arrows say WHICH WAY you are
   looking. Get the direction wrong and the drawing now describes a different
   part, so the direction is read once from the file and never recomputed.

   How it is read: the file draws the arrowhead as a filled triangle. Its apex
   minus the middle of its base IS the viewing direction - a fact, not a guess.
   The previous pass compared the arrow's CENTROID with the end of the cut line
   and inferred the direction from which side it fell on. For these drawings the
   arrow sits behind the cut line pointing at it, so that test read the direction
   backwards and STYLIZE flipped every arrow.

   What it draws: ONE polyline. It runs out along the viewing direction at one
   end, turns a right angle at the cut, runs the length of the cut, turns again
   and runs out at the other end, with an arrowhead capping each outer end. One
   line with two elbows - not a heap of separate strokes that have to be found
   again next time.
   ========================================================================== */
const SEC_LEG_MM=7.0;                    /* how far the elbow leg runs out */
const SEC_LETTER_SCALE=1.4;              /* the letter reads larger than a dimension */
/* long dash, gap, dot, gap, dot, gap - millimetres. ISO 128 draws a cutting
   plane as a phantom line; solid would read as an edge of the part. */
const SEC_PHANTOM_DASH=[12.5,1.5,1.5,1.5,1.5,1.5];
const SEC_LABEL_GAP_PX=4;                /* same clear space as a dimension value */
function secDot(p,v){ return p[0]*v[0]+p[1]*v[1]; }
/* Apex minus base-middle: the direction the arrowhead points. */
function secArrowDir(sd){
  const p=[]; (sd||[]).forEach(q=>{ if(!p.some(r=>Math.hypot(r[0]-q[0],r[1]-q[1])<1e-6)) p.push(q); });
  if(p.length<3) return null;
  let best=null;
  for(let i=0;i<3;i++){
    const a=p[(i+1)%3], b=p[(i+2)%3];
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const len=Math.hypot(p[i][0]-mid[0], p[i][1]-mid[1]);
    if(!best||len>best.len) best={len, mid, apex:p[i], wid:Math.hypot(a[0]-b[0],a[1]-b[1])};
  }
  if(!best || best.len<1e-6) return null;
  return { dir:[(best.apex[0]-best.mid[0])/best.len, (best.apex[1]-best.mid[1])/best.len],
           len:best.len, wid:best.wid, apex:best.apex };
}
/* Everything a section marker is made of, computed from the model. */
function secGeomOf(s){
  const leg=s.leg||SEC_LEG_MM;
  const E0=s.ends[0], E1=s.ends[1];
  const pts=[
    [E0.p[0]+E0.view[0]*leg, E0.p[1]+E0.view[1]*leg],
    E0.p.slice(), E1.p.slice(),
    [E1.p[0]+E1.view[0]*leg, E1.p[1]+E1.view[1]*leg]
  ];
  /* The letter belongs BEYOND THE ARROWHEAD, further along the direction of
     sight - it names the view you get when you look that way, so it has to sit on
     that side. Putting it on the cut line's own axis (where the file happened to
     draw it) reads as if it labelled the cut rather than the view.

     The clear space between the arrow tip and the letter is the same 4 px used
     everywhere else, and it is measured to the nearest INK of the glyph - which
     for a sideways view is the edge of the letter and for an up-or-down view is
     its top or its baseline. */
  const th=s.label.h||3.5, str=s.letter||'A';
  const ink=dimInk(th, str), w=dimTextWidth(str, th);
  const gap=(s.label.gapPx==null? SEC_LABEL_GAP_PX : s.label.gapPx)/dimPxPerMM();
  /* Push the anchor out until the CLOSEST corner of the ink box is `gap` from the
     tip. Which corner that is depends on the direction, so ask all four rather
     than assume: looking left or right it is the side of the letter, looking down
     it is the letter's top, looking up it is its baseline. */
  const corners=[[-w/2,-ink.desc],[w/2,-ink.desc],[-w/2,ink.asc],[w/2,ink.asc]];
  const reach=(v)=>Math.max(0, -Math.min(...corners.map(c=>c[0]*v[0]+c[1]*v[1])));
  /* ...and sit the letter squarely ON the leg, not hanging off it. Across the
     viewing direction the glyph's own middle - halfway between its baseline and
     its top - is what has to line up, never the baseline. */
  const mid=(ink.asc-ink.desc)/2;
  const place=(tip,v)=>{
    const n=[-v[1], v[0]], d=gap+reach(v);
    return [ tip[0]+v[0]*d - n[0]*(mid*n[1]),
             tip[1]+v[1]*d - n[1]*(mid*n[1]) ];
  };

  return { pts, labels, arrow:{h:s.arrow.len, w:s.arrow.wid} };
}
/* ---- reading the markers out of an imported drawing -----------------------
   Found by SHAPE, not by layer name. A cutting-plane marker has a signature no
   other annotation has: two arrowheads pointing the SAME way, sitting on a line
   at right angles to that direction, with a matching pair of letters beside them.
   Dimension arrows point at each other and carry a number, so they cannot match.

   Keying off a layer called "Section Lines" only worked for files that happened
   to use that name; a drawing that puts its cut on a centre line was invisible to
   it, and STYLIZE then fell back to the old guesswork.
   ========================================================================== */
/* Apex and direction of an arrowhead drawn as an outline: the corner furthest
   from the midpoint of the other two is the tip, and the tip minus that midpoint
   is the way it points - the same reading used for filled arrowheads. */
function secArrowFromPts(pts){
  const u=[];
  (pts||[]).forEach(q=>{ if(!u.some(r=>Math.hypot(r[0]-q[0], r[1]-q[1])<1e-6)) u.push(q); });
  if(u.length<3 || u.length>4) return null;
  let best=null;
  for(let i=0;i<u.length;i++){
    const rest=u.filter((_,k)=>k!==i);
    const mid=[rest.reduce((a,c)=>a+c[0],0)/rest.length,
               rest.reduce((a,c)=>a+c[1],0)/rest.length];
    const L=Math.hypot(u[i][0]-mid[0], u[i][1]-mid[1]);
    if(!best || L>best.L) best={L, apex:u[i], mid};
  }
  if(!best || best.L<1e-6) return null;
  return { apex:best.apex, len:best.L,
           dir:[(best.apex[0]-best.mid[0])/best.L, (best.apex[1]-best.mid[1])/best.L] };
}
function secIsCutCandidate(p){
  if(p._section) return true;
  const L=String(p._layer||'');
  if(/section|cut|cent(er|re)|smart/i.test(L)) return true;
  return !!p.dash;                       /* a chain line is a plausible cut line */
}
function v2SectionModels(out, mm){
  const solids=[];
  /* An arrowhead that the file says belongs to a DIMENSION is not a section
     marker's arrowhead, however convincingly it lines up. Two dimension arrows can
     stand at opposite ends of a view, point the same way, and have a matching pair
     of letters somewhere near - and then the marker is built on them: its line sits
     where they are rather than where the cut is, and it faces whichever way they
     face. Measured on a real drawing, every arrowhead both markers had been built
     from belonged to a dimension. */
  (out.solids||[]).forEach((sd,i)=>{
    if(sd._dim) return;
    const A=secArrowDir(sd); if(A) solids.push({i, sd, A}); });

  (out.texts||[]).forEach((t,i)=>{ const s=String(t.text||'').trim();
    if(/^[A-Z]'?$/.test(s)) labels.push({i, t, s}); });

    if(!p.pts || p.pts.length<2) return;
    const a=p.pts[0], b=p.pts[1], L=Math.hypot(b[0]-a[0], b[1]-a[1]);
    if(p.pts.length!==2 || L<1e-6){

         a little triangle rather than a filled solid. It still belongs to the
         marker and still has to be taken over, or it is left showing through the
         new one. Only straight two-point strokes were ever looked at before, so
         these survived every restyle. */
      blobs.push({i, p, pts:p.pts, tagged:!!p._section});
      return;
    }
    segs.push({i, p, a, b, L, u:[(b[0]-a[0])/L,(b[1]-a[1])/L], cut:secIsCutCandidate(p)});
  });

  const models=[]; let seq=1;
  for(let i=0;i<solids.length;i++){
    const S1=solids[i]; if(S1.taken) continue;
    for(let j=i+1;j<solids.length;j++){
      const S2=solids[j]; if(S2.taken) continue;
      const v=S1.A.dir;
      if(v[0]*S2.A.dir[0]+v[1]*S2.A.dir[1] < 0.99) continue;      /* must look the same way */
      const jx=S2.A.apex[0]-S1.A.apex[0], jy=S2.A.apex[1]-S1.A.apex[1];
      const jl=Math.hypot(jx,jy);

      const ju=[jx/jl, jy/jl];
      if(Math.abs(ju[0]*v[0]+ju[1]*v[1])>0.08) continue;           /* cut runs across the view */
      /* a matching pair of letters, one near each arrow */
      const byLetter={};
      labels.forEach(l=>{ if(l.taken) return; (byLetter[l.s]||(byLetter[l.s]=[])).push(l); });
      let letter=null, pair=null, bestScore=1e9;
      Object.keys(byLetter).forEach(k=>{
        const g=byLetter[k]; if(g.length<2) return;
        const near=(A)=>{ let best=null, bd=1e9;
          g.forEach(l=>{ const d=Math.hypot(l.t.x-A[0], l.t.y-A[1]); if(d<bd){bd=d;best=l;} });
          return {l:best, d:bd}; };
        const n1=near(S1.A.apex), n2=near(S2.A.apex);

        const sc=n1.d+n2.d;
        if(sc<bestScore && n1.d<30 && n2.d<30){ bestScore=sc; letter=k; pair=[n1.l, n2.l]; }
      });
      if(!letter) continue;
      /* the cut line: whatever plausible strokes lie along the join, else the join
         between the two arrowheads itself */
      /* A cutting plane is PERPENDICULAR to the direction you look through it -
         that is what a section is. Taking the cut's direction from the line joining
         the two arrowheads let a tilt in, because the pair that identifies a marker
         is not always the pair it is drawn with: a dimension arrow standing near
         the same end and pointing the same way can be picked, and it sits a few
         millimetres off the true line. Measured on a real drawing, that put a 4.9 mm
         lean into an 86 mm cut - visibly crooked, and pointing slightly wrong.

         So the axis is taken from the viewing direction, which both arrowheads
         agree on, and only its POSITION is fitted to them. The cut then cannot be
         anything but straight and square to the view. */
      const vAvg=[(S1.A.dir[0]+S2.A.dir[0])/2, (S1.A.dir[1]+S2.A.dir[1])/2];
      const vL=Math.hypot(vAvg[0], vAvg[1]);
      if(vL>1e-6){
        const vu=[vAvg[0]/vL, vAvg[1]/vL];
        const cut=[-vu[1], vu[0]];                 /* across the view */
        if(cut[0]*ju[0] + cut[1]*ju[1] < 0){ cut[0]=-cut[0]; cut[1]=-cut[1]; }
        ju[0]=cut[0]; ju[1]=cut[1];                /* keep the ends in the order found */
      }
      const n=[-ju[1], ju[0]];
      /* sit the line midway between the two arrowheads, so neither is favoured */
      const q=((S1.A.apex[0]*n[0]+S1.A.apex[1]*n[1]) +
               (S2.A.apex[0]*n[0]+S2.A.apex[1]*n[1]))/2;
      let t0=secDot(S1.A.apex,ju), t1=secDot(S2.A.apex,ju);
      if(t0>t1){ const x=t0; t0=t1; t1=x; }

         contained within it, give or take a little. A stroke that carries on past

         is not part of it, and deleting it would take real geometry with it. */
      const PAD=6;

      };

        && Math.abs(s.u[0]*ju[0]+s.u[1]*ju[1])>0.99
        && Math.abs(across(s.a))<0.8 && Math.abs(across(s.b))<0.8
        && Math.min(along(s.a),along(s.b))>t0-PAD
        && Math.max(along(s.a),along(s.b))<t1+PAD);
      /* The little arms the file drew at right angles to the cut are part of the
         marker too - the file said so by putting them on its section layer. They
         are replaced by the elbow, so they must be taken over as well, or the old
         drawing is left showing underneath the new one. */
      const arms=segs.filter(s=>!s.taken && s.p._section && !mine.includes(s) && inBox(s));
      const shapes=blobs.filter(x=>!x.taken && x.tagged && x.pts.every(pt=>
        along(pt)>t0-PAD && along(pt)<t1+PAD && Math.abs(across(pt))<SEC_LEG_MM+PAD));
      /* An arrowhead is drawn differently by every program: a filled solid, a
         closed triangle, an open three-point polyline, or two loose strokes. Rather
         than name each shape, take whatever lies inside the arrowhead's own

         Nothing else belongs there, and anything bigger than the arrow is left

      const headBox=(A)=>{

        for(let a=0;a<pts.length;a++) for(let bq=a+1;bq<pts.length;bq++)

      const headLimit=Math.max(S1.A.len||3.5, S2.A.len||3.5)*1.8;
      const inHead=(pts)=>spanOf(pts)<=headLimit &&
        heads.some(h=>pts.every(pt=>h(pt)));

         arrowhead that qualified took a second one standing just inside the end -
         a dimension's, pointing the same way along the same line - and that

          const off=Math.abs((S.A.apex[0]-ends[k][0])*n[0] + (S.A.apex[1]-ends[k][1])*n[1]);
          if(off>1.2) return;

        ends:[ {p:ends[0], view:E[0].A.dir}, {p:ends[1], view:E[1].A.dir} ],
        leg:SEC_LEG_MM,
        arrow:{ len:(E[0].A.len||3.5), wid:(E[0].A.wid||1.2) },
        label:{ h:(LP[0].t.h||3.5), gapPx:SEC_LABEL_GAP_PX },
        labelIds:LP.map(l=>l.i), ok:true });

}

    const pb=[texts[b].t.x+(texts[b].o.dx||0), texts[b].t.y+(texts[b].o.dy||0)];
    const d=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);

    T.t.rot=0; T.t.align=1; T.t.h=s.label.h;

        });

     outline or a filled shape. Small arcs of the part itself pass close to a
     marker all the time and are nobody's annotation, which is correct. */
  const suspect=rows.filter(r=>r.owner==='nobody' &&
    (r.kind==='filled shape' || (r.points>=3 && r.points<=5 && r.spanMM<8)));

   triangles and numbers. Measured on the three sample drawings with their
   dimensions exploded, that left ZERO dimensions to work with - so STYLIZE had
   nothing to correct.

   a number on a drawing is not decoration, it is the label of a measurement, and
   the measurement is right next to it. Around each value we look for the shapes a
   dimension is made of and, when they are all present and consistent, we hand the
   result to exactly the same model everything else already uses.

   is how many features share this dimension, not part of the measurement. */
function dimValueNumber(str){
  const s=String(str||'').replace(/^\s*\d+\s*[xX]\s*/,'');
  const m=s.match(/-?\d+(?:[.,]\d+)?/);
  return m? parseFloat(m[0].replace(',','.')) : null;
}
/* Which kind of measurement the value announces itself as. */
function dimValueKind(str){
  const s=String(str||'').trim();
  if(/(^|\s)(\u2300|\u2205|\u00D8|\u00F8|%%[cC])/.test(s)) return 'diameter';
  if(/(^|\s)R\s*\d/.test(s)) return 'radial';
  return 'linear';
}

/* ---- what a piece of geometry IS ------------------------------------------ */
/* An arrowhead: a filled triangle, or the outline of one. Returns its tip and the
   way it points - the two facts a dimension is built from. */
function recArrowFrom(pts){
  const p=[]; (pts||[]).forEach(q=>{
    if(!p.some(r=>Math.hypot(r[0]-q[0],r[1]-q[1])<1e-6)) p.push(q); });
  if(p.length!==3) return null;
  let span=0;
  for(let i=0;i<3;i++) for(let j=i+1;j<3;j++)
    span=Math.max(span, Math.hypot(p[i][0]-p[j][0], p[i][1]-p[j][1]));
  if(span<0.3 || span>12) return null;                 /* not an arrowhead-sized thing */
  let best=null;
  for(let i=0;i<3;i++){
    const a=p[(i+1)%3], b=p[(i+2)%3];
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const len=Math.hypot(p[i][0]-mid[0], p[i][1]-mid[1]);
    if(!best||len>best.len) best={len, mid, tip:p[i], wid:Math.hypot(a[0]-b[0],a[1]-b[1])};
  }
  if(!best || best.len<1e-6 || best.wid<1e-6) return null;
  if(best.len/best.wid < 1.2 || best.len/best.wid > 8) return null;   /* wrong proportions */
  return {tip:best.tip, dir:[(best.tip[0]-best.mid[0])/best.len,
                             (best.tip[1]-best.mid[1])/best.len],
          len:best.len, wid:best.wid};
}
function recCollectArrows(out){
  const A=[];
  (out.solids||[]).forEach((sd,i)=>{ const a=recArrowFrom(sd); if(a){ a.src='solid'; a.i=i; A.push(a); } });
  (out.polys||[]).forEach((p,i)=>{
    const pts=p.pts||[];
    if(pts.length<3 || pts.length>5) return;
    if(Math.hypot(pts[0][0]-pts[pts.length-1][0], pts[0][1]-pts[pts.length-1][1])>0.05) return;
    const a=recArrowFrom(pts.slice(0,-1).length>=3? pts.slice(0,-1) : pts);
    if(a){ a.src='poly'; a.i=i; a.p=p; A.push(a); }
  });
  return A;
}

/* ---- rebuilding the dimensions -------------------------------------------- */
/* A piece is available to be rebuilt unless something is actually USING it. A tag
   left over from an old save says which block a stroke came from, not that anything
   understands it - so a tag whose model no longer exists must not lock the stroke
   away, or a project saved before models existed can never be rebuilt. */
function v2RecFree(out){
  const live=new Set((out.dims||[]).filter(m=>m&&m.ok).map(m=>m.id));
  return (o)=>{ if(!o) return false; if(o._sec) return false;
    return !o._dim || !live.has(o._dim); };
}
function v2RecoverDims(out, mm, seq){
  const dims=[];
  /* Say WHY a value was not turned into a dimension. A recovery pass that fails
     silently is impossible to improve, because nobody can see what it missed. */
  const why=[]; out.recoverReport=why;
  const free=v2RecFree(out);
  /* A number on the sheet's own frame is not a dimension value. The zone numbers
     down the border read as "1", "2", "3" and pair with any arrowhead that happens
     to stand the right distance away - which is how a drawing came back with
     dimensions nobody had drawn. The frame and the title block are named by their
     layers; that is the same rule the text sizing already trusts. */
  const furniture=(t)=>/border|frame|title\s*block|^title/i.test(String(t._layer||''));
  const texts=(out.texts||[]).map((t,i)=>({t,i,role:dimTextRole(t.text)}))
                              .filter(x=>free(x.t) && x.role==='value' && !furniture(x.t));
  if(!texts.length) return dims;
  const arrows=recCollectArrows(out).filter(a=>
    free(a.src==='poly'? a.p : (out.solids[a.i]||{})));
  if(!arrows.length) return dims;
  /* every circle and arc the drawing actually contains - the ground truth a
     radius or diameter has to agree with */
  const rounds=[];
  (out.polys||[]).forEach(p=>{ if(p._round) rounds.push(p._round); });
  /* plain two-point strokes, the raw material of extension and dimension lines */
  const segs=[];
  (out.polys||[]).forEach((p,i)=>{
    if(!free(p) || !p.pts || p.pts.length!==2) return;
    const a=p.pts[0], b=p.pts[1], L=Math.hypot(b[0]-a[0], b[1]-a[1]);
    if(L<1e-6) return;
    segs.push({i,p,a,b,L,u:[(b[0]-a[0])/L,(b[1]-a[1])/L]});
  });
  const dot=(p,v)=>p[0]*v[0]+p[1]*v[1];
  const near=(p,q)=>Math.hypot(p[0]-q[0], p[1]-q[1]);

  /* Two passes. First every value proposes the matches it COULD have; then the
     best-fitting proposals are accepted in order. Committing as we go let whichever
     value happened to be read first take arrowheads that fitted another value far
     better - which is how two dimensions stacked among their neighbours were lost
     even though their arrowheads were sitting right there. */
  const cands=[];
  texts.forEach(T=>{
    const str=String(T.t.text||'');
    const kind=dimValueKind(str);
    const th=T.t.h||2.5, reach=Math.max(60, th*30);
    const tp=[T.t.x, T.t.y];
    const id='rec'+(seq.n++);

    if(kind==='radial' || kind==='diameter'){
      /* a radius names a real arc: find the arrowhead whose tip sits on one */
      const stated=dimValueNumber(str);
      arrows.forEach(a=>{
        if(near(a.tip,tp)>reach) return;
        rounds.forEach(R=>{
          if(Math.abs(near(a.tip,[R.cx,R.cy])-R.r)>0.4) return;    /* tip on this arc */
          /* ...and the arc has to BE what the value says it is. Without this the
             nearest arrowhead wins even when it sits on a completely different
             circle, which is how an R2.75 appeared that the drawing never had. */
          if(stated!=null){
            const own=(kind==='diameter')? R.r*2 : R.r;
            if(Math.abs(own-stated) > Math.max(0.05, stated*0.01)) return;
          }
          cands.push({score:near(a.tip,tp), text:T, arrows:[a], kind, R, str, th, tp, id:null});
        });
      });
      return;
    }

    /* linear: two arrowheads facing along one line, with the value beside it */
    const stated=dimValueNumber(str);
    for(let i=0;i<arrows.length;i++){
      const A=arrows[i];
      if(near(A.tip,tp)>reach) continue;
      for(let j=i+1;j<arrows.length;j++){
        const B=arrows[j];
        if(near(B.tip,tp)>reach) continue;
        if(A.dir[0]*B.dir[0]+A.dir[1]*B.dir[1] > -0.9) continue;
        const vx=B.tip[0]-A.tip[0], vy=B.tip[1]-A.tip[1];
        const L=Math.hypot(vx,vy); if(L<0.5) continue;
        const u=[vx/L, vy/L];
        if(Math.abs(u[0]*A.dir[0]+u[1]*A.dir[1])<0.98) continue;
        const n=[-u[1],u[0]];
        const across=Math.abs(dot([tp[0]-A.tip[0], tp[1]-A.tip[1]], n));
        const along=dot([tp[0]-A.tip[0], tp[1]-A.tip[1]], u);
        /* A narrow dimension parks its number well outside the extension lines -
           measured on a real drawing, 7.3 mm away from a 3.5 mm span. The window
           has to allow that. It can afford to be generous because the real filter
           is the next line: the span must BE the number the drawing states. */
        /* How far the number may sit from its own dimension line. A narrow
           dimension parks its number well outside the extension lines, and on a
           crowded drawing it is pushed further still - measured on a real sheet,
           six dimensions had a pair whose span was EXACTLY their number and were
           reported as having no arrowheads at all, purely because the number had
           been moved clear of the crowd.
           The window can afford to be generous because it is not what decides:
           the line below is, and it demands that the span BE the number the
           drawing states. A wide search cannot invent a dimension; it can only
           find one that was already there. */
        const room=Math.max(th*20, L*2, 40);
        if(across>Math.max(th*12, L*0.5, 25)) continue;
        if(along<-room || along>L+room) continue;
        if(stated!=null && Math.abs(L-stated) > Math.max(0.05, stated*0.01)) continue;
        cands.push({score:across+Math.abs(along-L/2)*0.25, text:T, arrows:[A,B],
                    kind:'linear', pair:{A,B,u,n,L}, str, th, tp, id:null});
      }
    }
  });

  /* Serve the most CONSTRAINED value first, not the best-fitting one.
     Taking the best fit first is greedy: a value with five possible pairs helps
     itself to arrowheads that were the only ones another value could ever use, and
     that other value is then reported as having no arrowheads at all - on a dense
     drawing seven of forty-three were lost that way, with arrowheads still going
     spare. A value that has exactly one possible pair must be served before a
     value that has a choice; among equals, the best fit still wins. */
  const perText=new Map();
  cands.forEach(C=>perText.set(C.text.i, (perText.get(C.text.i)||0)+1));
  cands.sort((a,b)=> (perText.get(a.text.i)-perText.get(b.text.i)) || (a.score-b.score));
  const takenText=new Set();
  cands.forEach(C=>{
    if(takenText.has(C.text.i)) return;
    /* Neighbouring dimensions in a chain SHARE an arrowhead: one dimension's
       right-hand tip is the next one's left-hand tip, drawn once. Claiming an
       arrowhead for one dimension and refusing it to every other left the next
       dimension in the chain with nothing to match - which is why a crowded sheet
       lost values that were plainly there. An arrowhead may serve the two
       dimensions that meet at it, and no more. */
    if(C.arrows.some(a=>(a.used||0)>=2)) return;
    /* ...but never twice for the SAME dimension line, which would be one
       dimension claiming both ends of somebody else's */
    if(C.arrows.every(a=>(a.used||0)>=1) && C.arrows.some(a=>a.usedBy===C.text.i)) return;
    C.arrows.forEach(a=>{ a.used=(a.used||0)+1; a.usedBy=C.text.i; });
    takenText.add(C.text.i);
    const T=C.text, str=C.str, th=C.th, tp=C.tp, kind=C.kind;
    const id='rec'+(seq.n++);
    if(kind==='radial' || kind==='diameter'){
      const best={a:C.arrows[0], R:C.R};
      const R=best.R;
      const m={ id, kind:(kind==='diameter'?'diameter':'radial'),
        centre:[R.cx,R.cy], point:best.a.tip.slice(), radius:R.r,
        line:{arrow:best.a.len, arrowW:best.a.wid, weight:DIM_LW},
        land:{y:tp[1], len:null, off:null, side:((tp[0]-best.a.tip[0])>=0?1:-1)},
        run:{len:null},
        text:{gapPx:DIM_TXT_GAP_PX, rot:0, value:'', override:null,
              h:th, align:1, scaleRot:T.t.scaleRot},
        recovered:true, ok:true };
      m.text.value=((kind==='diameter'?'\u2300':'R')+
        (kind==='diameter'? R.r*2 : R.r).toFixed(2));
      dimSplitValue(m, str);          /* keep "2x" and the symbol, free the number */
      m.refs={texts:[T.i], arrows:[best.a]};
      dims.push(m);
      return;
    }
    const pair=C.pair;
    const u=pair.u, n=pair.n;
    const q=dot(pair.A.tip, n);
    /* the extension lines: perpendicular strokes standing at each tip. Their far
       end from the dimension line is the point that was actually measured. */
    const measured=[pair.A.tip.slice(), pair.B.tip.slice()];
    const over=[2.5,2.5], usedSegs=[];
    [0,1].forEach(k=>{
      const tip=(k===0?pair.A.tip:pair.B.tip);
      const t0=dot(tip,u);
      let bestSeg=null, bd=1e9;
      segs.forEach(s=>{ if(s.used) return;
        if(Math.abs(s.u[0]*n[0]+s.u[1]*n[1])<0.98) return;          /* perpendicular */
        const d=Math.abs(dot(s.a,u)-t0);
        if(d<0.8 && d<bd){ bd=d; bestSeg=s; }
      });
      if(!bestSeg) return;
      bestSeg.used=true; usedSegs.push(bestSeg.i);
      /* The gap between the part and the extension line is empty space - nothing
         in the drawing records how wide it was. So the measured point is taken as
         the extension line's own near end and the gap as zero: the line is then
         redrawn exactly where the drawing had it, instead of somewhere a guessed
         gap would have put it. */
      const qa=dot(bestSeg.a,n), qb=dot(bestSeg.b,n);
      const beyond=(Math.abs(qa-q)<=Math.abs(qb-q))? qa : qb;      /* just past the dim line */
      const nearPart=(beyond===qa)? qb : qa;
      over[k]=Math.min(6, Math.abs(beyond-q));
      measured[k]=[u[0]*t0+n[0]*nearPart, u[1]*t0+n[1]*nearPart];
    });
    const m={ id, kind:'linear', measure:{p1:measured[0], p2:measured[1]}, dir:u,
      ext:{gap:[0,0], overshoot:over, visible:[true,true]},
      line:{q, inside:true, stub:[0,0], arrowsOut:false,
            capStart:'arrow', capEnd:'arrow',
            arrow:Math.max(pair.A.len,pair.B.len),
            arrowW:Math.max(pair.A.wid,pair.B.wid), weight:DIM_LW},
      text:{t:null, side:((dot([tp[0],tp[1]],n)-q)>=0?1:-1), gapPx:DIM_TXT_GAP_PX,
            rot:T.t.rot||0, value:'', override:null, h:th, align:1,
            scaleRot:T.t.scaleRot, outSide:1},
      recovered:true, ok:true };
    m.text.value=dimValueOf(m).toFixed(2);
    dimSplitValue(m, str);            /* keep any wrapper, free the number */
    m.refs={texts:[T.i], segs:usedSegs, arrows:[pair.A, pair.B]};
    dims.push(m);
  });
  /* whatever never found a match, and why */
  texts.forEach(T=>{ if(takenText.has(T.i))
      return;
    const str=String(T.t.text||'');
    why.push({text:str, reason:'no matching arrowheads for '+
      (dimValueNumber(str)==null?'?':dimValueNumber(str))});
  });
  return dims;
}

/* The pieces that belong to a rebuilt dimension - and ONLY those.
   An earlier version swept up everything inside the dimension's footprint, which
   quietly ate about three hundred lines of the part itself and both section
   markers. So nothing is claimed unless it can be named: the arrowheads we
   matched, the extension lines we followed, the value we read, and the strokes
   that lie on the dimension's own line between them. */
function v2RecoverRaw(out, m){
  const raw={polys:[], solids:[], texts:[], idx:{polys:[], solids:[], texts:[]}};
  const takePoly=(i)=>{ if(i==null||raw.idx.polys.includes(i)) return;
    const p=out.polys[i]; if(!p||p._round||p._sec) return;
    raw.polys.push(p); raw.idx.polys.push(i); };
  const takeSolid=(i)=>{ if(i==null||raw.idx.solids.includes(i)) return;
    raw.solids.push(out.solids[i]); raw.idx.solids.push(i); };
  (m.refs&&m.refs.texts||[]).forEach(i=>{ raw.texts.push(out.texts[i]); raw.idx.texts.push(i); });
  const arrows=(m.refs&&m.refs.arrows)||[];
  arrows.forEach(a=>{ if(a.src==='solid') takeSolid(a.i); else takePoly(a.i); });
  (m.refs&&m.refs.segs||[]).forEach(takePoly);

  if(m.kind==='radial'||m.kind==='diameter'){
    /* follow the leader away from the arrowhead, end to end, a few strokes at most */
    const tip=m.point;
    let ends=[tip], hops=0;
    const used=new Set(raw.idx.polys);
    while(hops++<4){
      let grew=false;
      (out.polys||[]).forEach((p,i)=>{
        if(used.has(i) || p._dim || p._sec || p._round || !p.pts || p.pts.length!==2) return;
        const A=p.pts[0], B=p.pts[1];
        if(Math.hypot(B[0]-A[0],B[1]-A[1])>150) return;
        const hit=ends.some(e=>Math.hypot(e[0]-A[0],e[1]-A[1])<0.4
                             || Math.hypot(e[0]-B[0],e[1]-B[1])<0.4);

        used.add(i); takePoly(i); ends.push(A,B); grew=true;

    }
    return raw;
  }
  /* linear: the strokes lying ON the dimension line, within its own span */
  const u=m.dir, n=[-u[1],u[0]], S=dimSpanOf(m);
  (out.polys||[]).forEach((p,i)=>{
    if(p._dim || p._sec || p._round || !p.pts || p.pts.length!==2) return;
    const A=p.pts[0], B=p.pts[1];
    const qa=A[0]*n[0]+A[1]*n[1], qb=B[0]*n[0]+B[1]*n[1];
    if(Math.abs(qa-m.line.q)>0.8 || Math.abs(qb-m.line.q)>0.8) return;
    const ta=A[0]*u[0]+A[1]*u[1], tb=B[0]*u[0]+B[1]*u[1];
    const pad=Math.max(8, m.line.arrow*4);
    if(Math.min(ta,tb)<S.tA-pad || Math.max(ta,tb)>S.tB+pad) return;
    takePoly(i);
  });
  return raw;
}
/* Swap the loose pieces for the model's own drawing, tagged so everything
   downstream - grouping, grips, STYLIZE, export - treats it as one dimension. */
/* Mark the old pieces, do not splice them out yet. Every rebuilt dimension refers
   to its pieces BY INDEX, and splicing shifts every index after it - so removing
   the first dimension's strokes silently pointed the next one's indices at the
   wrong things, and its original number was left on the drawing underneath the new
   one. Marking is index-safe; the sweep happens once, at the end. */

  raw.texts.forEach(t=>{ if(t) t._recDead=true; });

  built.texts.forEach(t=>out.texts.push(t));

function v2RecoverSweep(out){
  out.polys=(out.polys||[]).filter(p=>!p._recDead);
  out.solids=(out.solids||[]).filter(s=>!s._recDead);
  out.texts=(out.texts||[]).filter(t=>!t._recDead);
}
function convertDXF_v2(parsed, text){

  const skipped={}; let hatchIssues=0;

  const all=parsed.entities||[];

  all.forEach(e=>{ if(!DRAW[e.type])return; if(e.inPaperSpace) nPaper++; else nModel++; });
  const usePaper=(nPaper>nModel);
  const roots=all.filter(e=>usePaper? !!e.inPaperSpace : !e.inPaperSpace);
  const spaceInfo={used:usePaper?'paper':'model', modelCount:nModel, paperCount:nPaper,
    hidden:usePaper?nModel:nPaper};

  let curDim=null, dimSeq=1, curDimTextRot=0;         // set while walking a DIMENSION block
  const emitPoly=(pts, M, e, dash, round)=>{
    if(!pts||pts.length<2) return;
    const O=v2Ocs(e); const T=O? m2Mul(M,O) : M;
    const p={ _src:e.type, _layer:e.layer, _dim:curDim, pts:pts.map(p=>{ const q=m2Apply(T,p); return [q[0]*mm, q[1]*mm]; }),
      dash:(dash!==undefined?dash:dashFor({name:e.layer, lineTypeName:e.lineType})),
      _section:_secLayer({name:e.layer}) };
    if(round){
      // The true circle behind the polygon, in world millimetres. The centre and
      // radius come through the transform, but the START and END ANGLES are read
      // back off the drawn points instead: a block that mirrors its contents
      // reverses the sweep, and adding the transform's rotation to the original
      // angles got that backwards - by as much as 180 degrees on 96 arcs across
      // the sample drawings. The drawn points cannot be wrong about themselves.
      const c=m2Apply(T,[round.cx, round.cy]);
      const r0=m2Apply(T,[round.cx+round.r, round.cy]);
      const rr=Math.hypot(r0[0]-c[0], r0[1]-c[1])*mm;
      const C=[c[0]*mm, c[1]*mm];
      if(rr>1e-6){
        let a0=null, a1=null;
        if(round.a0!=null && p.pts.length>2){
          const ang=(q)=>{ const a=Math.atan2(q[1]-C[1], q[0]-C[0])*180/Math.PI; return (a%360+360)%360; };
          const first=ang(p.pts[0]), last=ang(p.pts[p.pts.length-1]);
          const midA=ang(p.pts[Math.floor(p.pts.length/2)]);
          const ccw=(from,to)=>((to-from)%360+360)%360;
          // DXF arcs always sweep counter-clockwise from 50 to 51, so put the ends

      if(v2NoPlotLayer(e.layer)) return;                 // non-plotting layer
      const O=v2Ocs(e); const T=O? m2Mul(M,O) : M;
      const P=(p)=>{ const q=m2Apply(T,p); return [q[0]*mm, q[1]*mm]; };
      switch(e.type){
        case 'LINE': {
          const v=e.vertices||[];

          else if(e.start&&e.end) emitPoly([[e.start.x,e.start.y],[e.end.x,e.end.y]], M, e);
          break; }
        case 'LWPOLYLINE': case 'POLYLINE': {
          const vs=(e.vertices||[]).map(p=>[p.x||0, p.y||0, p.bulge||0]);
          if(vs.length<2) break;
          const pts=[];
          for(let i=0;i<vs.length;i++){ const a=vs[i]; pts.push([a[0],a[1]]);
            const last=(i===vs.length-1);
            if(!last || e.shape || e.closed){ const b=vs[(i+1)%vs.length];
              v2Bulge([a[0],a[1]],[b[0],b[1]],a[2]).forEach(p=>pts.push(p)); } }
          if(e.shape||e.closed) pts.push([vs[0][0],vs[0][1]]);
          emitPoly(pts, M, e);
          break; }
        case 'ARC': {
          const c=e.center||{x:0,y:0};
          const a0=(e.startAngle||0)*180/Math.PI, a1=(e.endAngle==null?Math.PI*2:e.endAngle)*180/Math.PI;
          emitPoly(v2Arc(c.x||0,c.y||0, e.radius||0, a0, a1), M, e, undefined,
                   {cx:c.x||0, cy:c.y||0, r:e.radius||0, a0, a1});
          break; }
        case 'CIRCLE': {
          const c=e.center||{x:0,y:0};
          emitPoly(v2Arc(c.x||0,c.y||0, e.radius||0, 0, 360), M, e, undefined,
                   {cx:c.x||0, cy:c.y||0, r:e.radius||0, a0:null, a1:null});
          break; }
        case 'ELLIPSE': { const nz=(e.extrusionDirection&&e.extrusionDirection.z!=null)?e.extrusionDirection.z:1;
          emitPoly(v2Ellipse(e, nz), M, e); break; }
        case 'SPLINE': emitPoly(v2Spline(e), M, e); break;
        case 'TEXT': case 'MTEXT': case 'ATTRIB': case 'ATTDEF': {
          const raw=(e.text!=null?e.text:(e.string!=null?e.string:''));
          const str=(e.type==='MTEXT')? v2MtextPlain(raw) : v2CtrlCodes(raw);
          if(!str) break;
          const sp=e.startPoint||e.position||{x:e.x||0,y:e.y||0};
          const q=P([sp.x||0, sp.y||0]);
          const scaleRot=Math.atan2(M[1],M[0])*180/Math.PI;
          const hgt=(e.textHeight||e.height||2.5)*mm*Math.hypot(M[0],M[1]);
          out.texts.push({ _dim:curDim, _layer:e.layer, x:q[0], y:q[1], h:hgt, text:str,
            rot:(curDim? curDimTextRot : v2TextRot(e)),
            align:(e.halign!=null?e.halign:(e.horizontalAlignment||0)), scaleRot });
          break; }
        case 'SOLID': case 'TRACE': case '3DFACE': {
          const cs=(e.points||e.corners||e.vertices||[]).filter(Boolean);
          if(cs.length>=3){ const order=(cs.length===4)?[0,1,3,2]:cs.map((_,i)=>i);
            const sd=order.map(k=>P([cs[k].x||0, cs[k].y||0]));
            if(curDim) sd._dim=curDim;
            out.solids.push(sd); }
          break; }
        case 'POINT': { const p=e.position||{x:e.x||0,y:e.y||0}; out.marks.push(P([p.x||0,p.y||0])); break; }
        case 'HATCH': {
          const loops=v2HatchLoops(e);
          if(!loops.length){ hatchIssues++; break; }
          out.hatches.push({
            loops:loops.map(L=>L.map(p=>P(p))),
            solid:!!e.isSolid || /SOLID/i.test(e.patternName||''),
            angle:(e.patternAngle||0), scale:(e.patternScale==null?1:e.patternScale),
            style:(e.hatchStyle||0), pattern:e.patternName||'',
            lines:(e.definitionLines||[]).map(L=>({ angle:L.angle||0,
              bx:(L.base&&L.base.x)||0, by:(L.base&&L.base.y)||0,
              ox:(L.offset&&L.offset.x)||0, oy:(L.offset&&L.offset.y)||0 })),
            // The pattern lives in the same space as the geometry, so its base
            // point, its offset and its dash lengths all have to come through the
            // block transform and the unit factor too. Leaving them in raw file
            // units made the spacing wrong on any drawing that was not 1:1 in mm.
            fams:(e.definitionLines||[]).map(L=>{
              const O0=m2Apply(T,[0,0]);
              const VEC=(v)=>{ const q=m2Apply(T,v); return [(q[0]-O0[0])*mm, (q[1]-O0[1])*mm]; };
              const a=L.angle||0;
              const dir=VEC([Math.cos(a), Math.sin(a)]);
              const k=Math.hypot(...VEC([1,0]))||1;         // uniform scale of the transform
              return { dir, base:P([(L.base&&L.base.x)||0, (L.base&&L.base.y)||0]),
                       off:VEC([(L.offset&&L.offset.x)||0, (L.offset&&L.offset.y)||0]),
                       dashes:(L.dashes&&L.dashes.length)? L.dashes.map(v=>v*mm*k) : null };
            }) });
          break; }
        case 'INSERT': {
          const b=blocks[e.name];
          if(!b || !b.entities){ skipped['INSERT('+(e.name||'?')+')']=(skipped['INSERT('+(e.name||'?')+')']||0)+1; break; }
          const bo=b.position||{x:0,y:0};
          const local=m2Mul(m2FromInsert(e), [1,0,0,1,-(bo.x||0),-(bo.y||0)]);
          walk(b.entities, m2Mul(M, local), depth+1);
          break; }
        case 'DIMENSION': {
          const bn=e.block||e.blockName;
          const b=bn&&blocks[bn];
          if(b && b.entities){
            // Everything the dimension block draws (extension lines, dimension line,
            // arrowheads and the value text) belongs to ONE dimension, so tag it and
            // let the editor treat it as a single selectable unit.
            const prev=curDim; curDim='dim'+(dimSeq++);
            const prevRot=curDimTextRot; curDimTextRot=v2DimTextRot(e);
            const i0=out.polys.length, s0=out.solids.length, x0=out.texts.length;
            walk(b.entities, M, depth+1);
            // Build the dimension MODEL from the entity's own definition points
            // (groups 10/13/14) rather than guessing which drawn line is which.
            // If the model redraws the block faithfully we replace the loose lines
            // with model-driven ones; if not, the original geometry is left alone.
            const raw={polys:out.polys.slice(i0), solids:out.solids.slice(s0), texts:out.texts.slice(x0)};
            let md=null;
            try{ md=v2DimModel(e, T, mm, curDim, raw); }catch(err){ md=null; console.warn('dim model failed', curDim, err); }
            if(md){
              // Read the model; do NOT draw it. Importing shows the file the way
              // its author drew it. Nothing changes until STYLIZE is pressed.
              md.pending=md.ok;
              out.dims.push(md);
            }
            curDim=prev; curDimTextRot=prevRot;
          } else {
            const prev=curDim; curDim='dim'+(dimSeq++);
            let md=null;
            try{ md=v2DimModel(e, T, mm, curDim, {polys:[],solids:[],texts:[]}); }
            catch(err){ md=null; }
            if(md && md.ok){
              md.pending=true;             // waiting for STYLIZE
              out.dims.push(md);
            } else skipped['DIMENSION']=(skipped['DIMENSION']||0)+1;
            curDim=prev;
          }
          break; }
        case 'LEADER': case 'MLEADER': case 'MULTILEADER': {
          const vs=(e.vertices||e.points||[]).filter(Boolean).map(p=>[p.x||0,p.y||0]);
          if(vs.length>=2) emitPoly(vs, M, e, null); else skipped[e.type]=(skipped[e.type]||0)+1;
          break; }
        case 'VERTEX': case 'SEQEND': case 'VIEWPORT': case 'ATTDEF_END': break;
        default: skipped[e.type]=(skipped[e.type]||0)+1;
      }
    });
  };
  walk(roots, m2Id(), 0);
  // Tie each cutting-plane marker together - its strokes, its arrowheads and its
  // letters - so it can be selected and restyled as the one thing it is.
  // Section markers are identified FIRST. Their signature is unmistakable - two
  // arrowheads looking the same way with a pair of letters - so claiming them
  // early stops the dimension rebuild from mistaking one of their arrowheads for
  // part of a measurement.
  try{ out.secs=v2SectionModels(out, mm); }catch(err){ out.secs=[]; console.warn('section scan failed', err); }
  // A drawing that never declared its dimensions still HAS them - as lines,
  // arrowheads and numbers. Rebuild those so the rest of the program cannot tell
  // the difference between a drawing that labelled itself and one that did not.
  try{
    const seq={n:1};
    const rec=v2RecoverDims(out, mm, seq);
    rec.forEach(m=>{
      // A rebuilt dimension is NOT re-fitted against the raw strokes: the fit test
      // exists to catch a DIMENSION entity we read wrongly, and here there is no
      // entity to read - the strokes ARE the source. Re-fitting would only measure
      // our own reconstruction against itself.
      if(!m.ok) return;
      m.pending=true;                      // read now, drawn when STYLIZE is pressed
      out.dims.push(m);
    });
  }catch(err){ console.warn('dimension recovery failed', err); }
  return {out, skipped, hatchIssues, spaceInfo, mm};
}

/* ============================================================================
   CLUSTER GUARD — file-agnostic protection against scattered imports.
   Some DXF files legitimately place stray geometry far from the drawing (leftover
   construction lines, a second layout, symbols parked off-sheet). Rather than
   guessing why, we detect spatially separated clusters after import, keep the
   dominant one and report the rest so the user can bring them back with one click.
   ========================================================================== */
function primBBox(kind, item){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  const add=(x,y)=>{ if(x<a)a=x; if(y<b)b=y; if(x>c)c=x; if(y>d)d=y; };
  if(kind==='poly') item.pts.forEach(p=>add(p[0],p[1]));
  else if(kind==='text') add(item.x,item.y);
  else if(kind==='solid') item.forEach(p=>add(p[0],p[1]));
  else if(kind==='mark') add(item[0],item[1]);
  else if(kind==='hatch') item.loops.forEach(L=>L.forEach(p=>add(p[0],p[1])));
  else if(kind==='cline') add(item.x,item.y);
  if(a>c) return null;
  return {minx:a,miny:b,maxx:c,maxy:d,cx:(a+c)/2,cy:(b+d)/2};
}
function collectPrims(d){
  const out=[];
  (d.polys||[]).forEach((p,i)=>out.push({k:'poly',i,bb:primBBox('poly',p)}));
  (d.texts||[]).forEach((p,i)=>out.push({k:'text',i,bb:primBBox('text',p)}));
  (d.solids||[]).forEach((p,i)=>out.push({k:'solid',i,bb:primBBox('solid',p)}));
  (d.marks||[]).forEach((p,i)=>out.push({k:'mark',i,bb:primBBox('mark',p)}));
  (d.hatches||[]).forEach((p,i)=>out.push({k:'hatch',i,bb:primBBox('hatch',p)}));
  (d.clines||[]).forEach((p,i)=>out.push({k:'cline',i,bb:primBBox('cline',p)}));
  return out.filter(x=>x.bb);
}
/* Grid-based union of primitives: anything closer than `gap` joins the same cluster. */
function detectClusters(d){
  const items=collectPrims(d);
  if(items.length<2) return [];
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  items.forEach(it=>{ mnx=Math.min(mnx,it.bb.minx); mny=Math.min(mny,it.bb.miny);
    mxx=Math.max(mxx,it.bb.maxx); mxy=Math.max(mxy,it.bb.maxy); });
  const span=Math.max(mxx-mnx, mxy-mny);
  if(span<=0) return [];
  // A multi-view drawing legitimately spaces its views apart, so the separation that
  // counts as "somewhere else entirely" has to be large - a quarter of the drawing.
  const gap=Math.max(span*0.25, 10);
  const parent=items.map((_,i)=>i);
  const find=(x)=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  const uni=(x,y)=>{ x=find(x); y=find(y); if(x!==y) parent[y]=x; };
  // bucket by grid cell so this stays near-linear even for thousands of primitives
  const cell=gap; const grid=new Map();
  const key=(gx,gy)=>gx+'|'+gy;
  items.forEach((it,idx)=>{
    const gx0=Math.floor((it.bb.minx-gap)/cell), gx1=Math.floor((it.bb.maxx+gap)/cell);
    const gy0=Math.floor((it.bb.miny-gap)/cell), gy1=Math.floor((it.bb.maxy+gap)/cell);
    for(let gx=gx0;gx<=gx1;gx++) for(let gy=gy0;gy<=gy1;gy++){
      const k=key(gx,gy); const arr=grid.get(k); if(arr) arr.push(idx); else grid.set(k,[idx]);
    }
  });
  const near=(A,B)=> !(A.maxx+gap<B.minx || A.minx-gap>B.maxx || A.maxy+gap<B.miny || A.miny-gap>B.maxy);
  grid.forEach(arr=>{ for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
    if(near(items[arr[i]].bb, items[arr[j]].bb)) uni(arr[i],arr[j]); } });
  const groups=new Map();
  items.forEach((it,idx)=>{ const r=find(idx); const g=groups.get(r);
    if(g){ g.items.push(it); g.bb.minx=Math.min(g.bb.minx,it.bb.minx); g.bb.miny=Math.min(g.bb.miny,it.bb.miny);
           g.bb.maxx=Math.max(g.bb.maxx,it.bb.maxx); g.bb.maxy=Math.max(g.bb.maxy,it.bb.maxy); }
    else groups.set(r,{items:[it], bb:{minx:it.bb.minx,miny:it.bb.miny,maxx:it.bb.maxx,maxy:it.bb.maxy}});
  });
  const list=[...groups.values()].map(g=>({ items:g.items, bb:g.bb, n:g.items.length,
    area:Math.max(1,(g.bb.maxx-g.bb.minx))*Math.max(1,(g.bb.maxy-g.bb.miny)) }));
  list.sort((a,b)=>(b.n-a.n)||(b.area-a.area));
  return list;
}
function pickCluster(d, cluster){
  const keep={polys:new Set(),texts:new Set(),solids:new Set(),marks:new Set(),hatches:new Set(),clines:new Set()};
  const map={poly:'polys',text:'texts',solid:'solids',mark:'marks',hatch:'hatches',cline:'clines'};
  cluster.items.forEach(it=>keep[map[it.k]].add(it.i));
  const sub={};
  Object.keys(map).forEach(k=>{});
  ['polys','texts','solids','marks','hatches','clines'].forEach(list=>{
    sub[list]=(d[list]||[]).filter((_,i)=>keep[list].has(i));
  });
  // Dimension models are not primitives, so they are not clustered - carry the
  // ones whose lines survived, otherwise their geometry loses its source of truth.
  const live=new Set(sub.polys.map(p=>p._dim).filter(Boolean));
  sub.dims=(d.dims||[]).filter(m=>live.has(m.id));
  const liveSec=new Set(sub.polys.map(p=>p._sec).filter(Boolean));
  sub.secs=(d.secs||[]).filter(m=>liveSec.has(m.id));
  return sub;
}
/* Applied right after import: keeps the dominant cluster when the rest is clearly
   detached and minor, and always reports what happened. Never deletes anything —
   the full import is stashed so it can be restored from the report panel. */
function applyClusterGuard(pg){
  const d=pg.dxf; if(!d) return null;
  const list=detectClusters(d);
  if(list.length<2) return null;
  const total=list.reduce((n,c)=>n+c.n,0);
  const main=list[0];
  // Only step in when the stray content is clearly a minority; otherwise the file
  // genuinely contains several drawings and we must not hide any of them.
  if(main.n/total < 0.85) return null;
  pg._allDxf=d;                                     // stash the complete import
  pg._clusters=list.map(c=>({n:c.n, bb:c.bb}));
  pg.dxf=pickCluster(d, main);
  return { kept:main.n, total, others:list.length-1 };
}
function restoreAllClusters(){
  const pg=activePage(); if(!pg||!pg._allDxf) return;
  snapshot(); pg.dxf=pg._allDxf; pg._allDxf=null; pg._clusterGuard=null;
  buildObjects(pg); dimRelayout(pg); secRelayout(pg);
  buildObjects(pg); afterMutate(); fitToDXF(pg);
  toast('showing everything the file contains');
  updateImportBadge();
}

function loadDXFText(text, fname){
  // v2 pipeline: dxf-viewer parser + our own geometry conversion (single source of
  // truth for every transform). Falls back to the old path only if it throws.
  if(window.DXFV && window.DXFV.DxfParser){
    try{ return loadDXFText_v2(text, fname); }
    catch(err){ console.error('v2 import failed, falling back', err); toast('the main reader failed; using the fallback'); }
  }
  return loadDXFText_v1(text, fname);
}
function loadDXFText_v2(text, fname){
  const parsed=new window.DXFV.DxfParser().parseSync(text);
  const R=convertDXF_v2(parsed, text);
  const d=R.out;
  if(!d.polys.length && !d.texts.length && !d.hatches.length && !d.solids.length && !d.clines.length){
    toast('nothing drawable was found in this DXF'); return; }
  snapshot();
  const pg=activePage();
  const had=pg.dxf && ((pg.dxf.polys||[]).length || (pg.dxf.texts||[]).length ||
                       (pg.dxf.hatches||[]).length || (pg.dxf.solids||[]).length);
  // Anything already moved stays where it was put: fold those moves into the
  // drawing before the objects are rebuilt, or they spring back to where they
  // first landed and the new file arrives on top of them.
  if(had){ bakeOffsets(pg); mergeDXF(pg, d); } else pg.dxf=d;
  pg.entities=[];
  pg._dxf={file:fname, count:d.polys.length+d.texts.length+d.hatches.length};
  pg._report={ file:fname, when:Date.now(),
    counts:{polys:d.polys.length, texts:d.texts.length, solids:d.solids.length,
            hatches:d.hatches.length, marks:d.marks.length, clines:d.clines.length},
    skipped:R.skipped, hatchIssues:R.hatchIssues, space:R.spaceInfo };
  const guard = had ? null : applyClusterGuard(pg);   // only ever on a fresh sheet
  if(guard) pg._clusterGuard=guard;
  if(!had) centerDXF(pg);          // the first drawing is centred; later ones are placed
  buildObjects(pg); dimRelayout(pg); secRelayout(pg); afterMutate(); fitToDXF(pg);
  if(guard) pg._report.cluster=guard;
  updateImportBadge();
  if(guard) toast(`found ${guard.others+1} separate clusters — showing the main one (${guard.kept}/${guard.total} item(s)) — see the report to show them all`);
  const sk=Object.entries(R.skipped).map(([k,n])=>k+'×'+n).join(', ');
  toast(`imported ${fname}: ${d.polys.length} strokes, ${d.texts.length} texts, ${d.solids.length} filled, ${d.hatches.length} hatches`
    + (sk?` — not supported yet: ${sk}`:'') + (R.hatchIssues?` — unreadable hatch boundaries: ${R.hatchIssues}`:''));
  if(sk||R.hatchIssues) console.warn('DXF import issues', R.skipped, R.hatchIssues);
}
function loadDXFText_v1(text, fname){
  const lib=window.DXFLIB2; if(!lib) throw new Error('DXF library not loaded');
  const parsed=lib.parseString(text);
  const mm=dxfUnitMM(text);
  // ---- MODEL vs PAPER SPACE -------------------------------------------------
  // DXF keeps both layouts in the same ENTITIES section, telling them apart only
  // with group code 67 (1 = paper space). The bundled library ignores that flag,
  // so both layouts were drawn at once and the sheet appeared to "split" into two
  // clusters far apart. Read the flag ourselves and keep exactly one space.
  const spaceOf={};                                  // handle -> 1 when paper space
  try{
    DXFRAW.readAll(text).forEach(en=>{
      if(en.space!=='model') return;
      let h=null, ps=0;
      for(const [c,v] of en.codes){ if(c===5 && h==null) h=(v||'').trim().toUpperCase();
        else if(c===67) ps=parseInt(v,10)||0; }
      if(h) spaceOf[h]=ps;
    });
  }catch(_){}
  const DRAWABLE={LINE:1,ARC:1,CIRCLE:1,ELLIPSE:1,LWPOLYLINE:1,POLYLINE:1,SPLINE:1,TEXT:1,MTEXT:1,
    SOLID:1,TRACE:1,'3DFACE':1,POINT:1,HATCH:1,DIMENSION:1,INSERT:1,LEADER:1,MLEADER:1,MLINE:1};
  let nModel=0, nPaper=0;
  (parsed.entities||[]).forEach(e=>{ if(!DRAWABLE[e.type]) return;
    const h=(e.handle||'').toString().toUpperCase();
    if(spaceOf[h]===1) nPaper++; else nModel++; });
  const usePaper = (nPaper>0 && nPaper>nModel);       // the layout that actually holds the drawing
  const otherSpaceCount = usePaper?nModel:nPaper;
  if(otherSpaceCount>0){
    parsed.entities=(parsed.entities||[]).filter(e=>{
      const h=(e.handle||'').toString().toUpperCase();
      const isPaper=(spaceOf[h]===1);
      return usePaper? isPaper : !isPaper;
    });
  }
  const spaceInfo={ used:usePaper?'paper':'model', modelCount:nModel, paperCount:nPaper, hidden:otherSpaceCount };
  // capture dimension metadata (type + text position) BEFORE injecting INSERTs,
  // so STYLIZE can identify radius/diameter/section dimensions later.
  const dimInfo=(parsed.entities||[]).filter(e=>e.type==='DIMENSION').map(d=>({
    type:(d.dimensionType||0)&7,
    mid:d.textMidpoint?{x:d.textMidpoint.x,y:d.textMidpoint.y}:null }));

  // on its own — inject an INSERT for each so the dim lines & arrowheads come through.
  try{
    const barr=Array.isArray(parsed.blocks)?parsed.blocks:Object.values(parsed.blocks||{});
    const bnames={}; barr.forEach(b=>{ if(b&&b.name) bnames[b.name]=1; });
    (parsed.entities||[]).filter(e=>e.type==='DIMENSION').forEach(d=>{
      const bn=d.block||d.blockName;
      if(bn && bnames[bn]) parsed.entities.push({type:'INSERT',block:bn,x:0,y:0,xscale:1,yscale:1,rotation:0,layer:d.layer||'0'});
    });

  // fit-point splines: the dxf library returns them EMPTY (it ignores fit points).
  // Read fit/control points ourselves from raw text, keyed by handle, and interpolate
  // a curve that passes exactly through the fit points (so endpoints meet neighbours).
  const rawSplineByHandle={};
  try{ DXFRAW.readAll(text).forEach(e=>{ if(e.type!=="SPLINE") return;
    const hs=DXFRAW.strs(e.codes,5); const hd=hs.length?hs[0].trim().toUpperCase():null; if(!hd) return;
    rawSplineByHandle[hd]={ fit:DXFRAW.pts(e.codes,11,21), ctrl:DXFRAW.pts(e.codes,10,20),

  }); }catch(_){}

    const pl=P.polylines[i], ent=dnAll[i];
    if(ent && ent.type==="SPLINE"){
      const hd=(ent.handle||"").toString().toUpperCase();
      const rs=rawSplineByHandle[hd];
      if(rs && rs.fit && rs.fit.length>=2){                        // fit spline -> interpolate through points
        const curve=catmullRom(rs.fit, 20);
        polys.push({ pts:curve.map(p=>{ const [x,y]=xfApply([p[0],p[1]], ent.transforms); return [x*mm,y*mm]; }), dash:dashFor(pl.layer), _section:_secLayer(pl.layer) });
        continue;
      }
      if(pl.vertices.length>=2){                                   // control-point spline handled by library
        polys.push({ pts:pl.vertices.map(v=>[v[0]*mm,v[1]*mm]), dash:dashFor(pl.layer), _section:_secLayer(pl.layer) }); continue;
      }
      if(rs && rs.ctrl && rs.ctrl.length>=2){                      // fallback: interpolate control polygon
        const curve=catmullRom(rs.ctrl, 16);
        polys.push({ pts:curve.map(p=>{ const [x,y]=xfApply([p[0],p[1]], ent.transforms); return [x*mm,y*mm]; }), dash:dashFor(pl.layer), _section:_secLayer(pl.layer) });
      }
      continue;
    }
    if(pl.vertices.length>=2) polys.push({ pts:pl.vertices.map(v=>[v[0]*mm,v[1]*mm]), dash:dashFor(pl.layer), _section:_secLayer(pl.layer) });
  }

function xfRot(transforms){ let r=0; (transforms||[]).forEach(t=>{ if(t.rotation) r+=t.rotation; }); return r; }
function textRot(e){                                  // MTEXT stores direction as an xAxis vector, not always a rotation angle

    return Math.atan2(e.xAxisY, e.xAxisX)*180/Math.PI;

/* ---- bounds / placement (translation only; sizes untouched) ---- */
function dxfBBox(pg){

    pg.objects.forEach(ob=>{ const bb=objBBox(ob); if(bb){ any=true; if(bb.minx<a)a=bb.minx; if(bb.miny<b)b=bb.miny; if(bb.maxx>c)c=bb.maxx; if(bb.maxy>d2)d2=bb.maxy; } });

  const add=(x,y)=>{ if(!Number.isFinite(x)||!Number.isFinite(y))return;
    if(x<mnx)mnx=x; if(y<mny)mny=y; if(x>mxx)mxx=x; if(y>mxy)mxy=y; };

/* Flip / rotate the whole imported drawing. Some CAD exports arrive mirrored or

    if(sd._dim) n._dim=sd._dim; if(sd._sec) n._sec=sd._sec; d.solids[i]=n; });

/* Put a second drawing on the sheet without disturbing the first.

   below if there is not - so nothing lands on top of anything. Ids are renumbered

       the bottom of the sheet, where they are harder to find than off the side.

       dragged wherever it is wanted. */

    ctx.setLineDash([]); }
  // marks
  (P.marks||[]).forEach(m=>{ const q=TP(m[0],m[1]); const r=Math.max(1.5,lw*1.5);
    ctx.beginPath(); ctx.moveTo(q.x-r,q.y); ctx.lineTo(q.x+r,q.y); ctx.moveTo(q.x,q.y-r); ctx.lineTo(q.x,q.y+r); ctx.stroke(); });
  // text
  (P.texts||[]).forEach(t=>drawImportedText({x:t.x+dx,y:t.y+dy,h:t.h,text:t.text,rot:t.rot,align:t.align,scaleRot:t.scaleRot,_ruled:t._ruled,bold:t.bold}));
}
/* ============================================================================
   HATCH PATTERN — pure geometry, no canvas, no globals
   ----------------------------------------------------------------------------
   The first piece of this program to become a real component: it takes numbers
   in and gives numbers back, so it can be tested in milliseconds without a
   browser, and reused anywhere.

   A hatch pattern is not "some lines across the shape". DXF gives each pattern
   definition line four things and all four matter:

     angle    the direction the lines run
     base     a point the family passes through, in WORLD coordinates
     offset   the vector from one line to the NEXT, also in world coordinates.
              Its perpendicular part is the spacing; its part ALONG the line
              shifts each successive line, which is what makes brick and dashed
              patterns line up the way they do.
     dashes   the dash/gap sequence (positive = dash, negative = gap, 0 = dot)

   Using only the angle and |offset| - and measuring from each shape's own
   bounding box - is what made two neighbouring regions with the same pattern
   fail to line up.
   ========================================================================== */

/** The families of parallel lines a hatch is drawn from.
 *  Falls back to ANSI31 (45°, 3.175 mm) when the file gives no definition lines;
 *  only then do the hatch's own angle and scale need applying, because there is
 *  no pre-resolved pattern data to have baked them in already. */
function hatchFamilies(h){
  if(h.fams && h.fams.length) return h.fams;
  const a=(h.angle||0)+Math.PI/4, s=(h.scale>0?h.scale:1), d=3.175*s;
  return [{ dir:[Math.cos(a), Math.sin(a)], base:[0,0],
            off:[-Math.sin(a)*d, Math.cos(a)*d], dashes:null }];
}

/** Split a family's offset into the two things it actually encodes. */
function hatchStep(f){
  const L=Math.hypot(f.dir[0], f.dir[1])||1;
  const ux=f.dir[0]/L, uy=f.dir[1]/L, nx=-uy, ny=ux;
  return { ux, uy, nx, ny,
    spacing:Math.abs(f.off[0]*nx + f.off[1]*ny),   /* perpendicular: line to line */
    shift:  f.off[0]*ux + f.off[1]*uy };           /* along the line: the stagger */
}

/** DXF dash list -> a canvas dash array, in the same units.
 *  Canvas always starts with a drawn segment, so a pattern that opens with a gap
 *  gets a zero-length dash in front of it rather than being turned inside out. */
function hatchDashArray(dashes, k){
  if(!dashes || !dashes.length) return null;
  const out=[];
  if(dashes[0]<0) out.push(0);
  let any=false;
  /* a dot is written as 0 in DXF and IS something to draw, so it counts as ink;
     counting only v>0 threw away any pattern made of dots and gaps */
  dashes.forEach(v=>{ const a=Math.abs(v)*k; out.push(a<0.1?0.1:a); if(v>=0) any=true; });
  if(!any) return null;                       /* all gaps: nothing to draw */
  if(out.length%2) out.push(0.1);             /* canvas wants pairs */
  return out;
}

/* ============================================================================
   §8  HATCH PATTERN ENGINE
   ----------------------------------------------------------------------------
   A hatch pattern is not "some lines across the shape". DXF gives each pattern
   definition line four things (groups 53/43-44/45-46/49) and all four matter:

     angle      the direction the lines run
     base       a point the family passes through - in WORLD coordinates
     offset     the vector from one line to the NEXT one, also in world
                coordinates. Its perpendicular part is the spacing; its part
                ALONG the line shifts each successive line, which is what makes
                brick and dashed patterns line up the way they do.
     dashes     the dash/gap sequence (positive = dash, negative = gap, 0 = dot)

   The old renderer used only the angle and |offset|, laid the lines out from the
   centre of each shape's bounding box, and ignored the dashes entirely.

   The pattern maths now lives in src/lib/hatch-pattern.js as a real module with
   its own unit tests; the build inlines it above this point. What is left here is
   the part that needs a canvas.
   ========================================================================== */
function drawHatchOff(h,lw,dx,dy){
  if(!h.loops.length) return;
  ctx.save(); ctx.setLineDash([]); ctx.strokeStyle=INK; ctx.fillStyle=INK; ctx.lineWidth=lw;
  const TP=(x,y)=>W2S(x+dx,y+dy);
  const path=()=>{ ctx.beginPath();
    h.loops.forEach(L=>{ L.forEach((pt,i)=>{ const q=TP(pt[0],pt[1]); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }); ctx.closePath(); }); };
  if(h.solid){ path(); ctx.fill('evenodd'); ctx.restore(); return; }
  // hatch style 2 ("ignore") fills through islands; 0/1 cut them out (even-odd)
  path(); ctx.clip(h.style===2?'nonzero':'evenodd');
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  h.loops.forEach(L=>L.forEach(pt=>{ const q=TP(pt[0],pt[1]);
    if(q.x<mnx)mnx=q.x; if(q.y<mny)mny=q.y; if(q.x>mxx)mxx=q.x; if(q.y>mxy)mxy=q.y; }));
  // Work in WORLD millimetres and let the pattern's own base point decide where
  // the lines fall, so neighbouring regions with the same pattern line up and the
  // fill does not crawl when the shape is moved.
  let wx0=1e9, wy0=1e9, wx1=-1e9, wy1=-1e9;
  h.loops.forEach(L=>L.forEach(pt=>{ const x=pt[0]+dx, y=pt[1]+dy;
    if(x<wx0)wx0=x; if(y<wy0)wy0=y; if(x>wx1)wx1=x; if(y>wy1)wy1=y; }));
  const corners=[[wx0,wy0],[wx1,wy0],[wx0,wy1],[wx1,wy1]];
  const oldCap=ctx.lineCap; ctx.lineCap='butt';
  hatchFamilies(h).forEach(f=>{
    const S=hatchStep(f);
    if(!(S.spacing>1e-9)) return;
    // how many lines of this family cross the shape, and how far along each one
    let k0=1e9, k1=-1e9, s0=1e9, s1=-1e9;
    corners.forEach(c=>{
      const vx=c[0]-f.base[0], vy=c[1]-f.base[1];
      const kk=(vx*S.nx+vy*S.ny)/S.spacing, ss=vx*S.ux+vy*S.uy;
      if(kk<k0)k0=kk; if(kk>k1)k1=kk; if(ss<s0)s0=ss; if(ss>s1)s1=ss; });
    k0=Math.floor(k0)-1; k1=Math.ceil(k1)+1;
    // Thin the family out rather than stretch it when it would be denser than the
    // screen can show: the lines that DO get drawn stay on the true family, so the
    // pattern never drifts off its own grid.
    const px=mm2px(S.spacing);
    let step=1; if(px<1.2) step=Math.ceil(1.2/Math.max(px,1e-6));
    if((k1-k0)/step > 4000) step=Math.ceil((k1-k0)/4000);
    const pad=Math.max(2, mm2px(1));
    const dash=hatchDashArray(f.dashes, 1);
    for(let k=Math.ceil(k0/step)*step; k<=k1; k+=step){
      const px0=f.base[0]+f.off[0]*k, py0=f.base[1]+f.off[1]*k;
      const A=W2S(px0+S.ux*s0, py0+S.uy*s0), B=W2S(px0+S.ux*s1, py0+S.uy*s1);
      const len=Math.hypot(B.x-A.x, B.y-A.y);
      if(len<0.5) continue;
      if(dash){
        // the dash pattern is measured from the family's own reference point, so
        // successive lines stagger exactly as the pattern intends
        ctx.setLineDash(dash.map(v=>Math.max(0.1, mm2px(v))));
        ctx.lineDashOffset=mm2px(s0);
      } else { ctx.setLineDash([]); ctx.lineDashOffset=0; }
      const ex=(B.x-A.x)/len, ey=(B.y-A.y)/len;
      ctx.beginPath();
      ctx.moveTo(A.x-ex*pad, A.y-ey*pad);
      ctx.lineTo(B.x+ex*pad, B.y+ey*pad);
      ctx.stroke();
    }
  });
  ctx.setLineDash([]); ctx.lineDashOffset=0; ctx.lineCap=oldCap;
  ctx.restore();
}
function drawImportedText(t){
  if(t.text==null||t.text==='') return;
  const p=W2S(t.x,t.y); const hpx=mm2px(t.h);
  ctx.save(); ctx.setLineDash([]); ctx.fillStyle=INK;
  ctx.translate(p.x,p.y); ctx.rotate(-((t.rot||0)+(t.scaleRot||0))*Math.PI/180);
  ctx.font=`${t.bold?'700 ':''}${hpx}px ${store.format.font},Arial`;
  ctx.textBaseline='alphabetic'; ctx.textAlign=(t.align===1?'center':t.align===2?'right':'left');
  String(t.text).split('\n').forEach((ln,i)=>ctx.fillText(ln,0,i*hpx*1.25));
  if(t._ruled){                                            // "view label" style: a rule above and below
    const lines=String(t.text).split('\n');
    let tw=0; lines.forEach(ln=>{ tw=Math.max(tw, ctx.measureText(ln).width); });
    const nL=lines.length, botY=(nL-1)*hpx*1.25 + hpx*0.34, topY=-hpx*1.02;
    let x0,x1; if(t.align===1){x0=-tw/2;x1=tw/2;} else if(t.align===2){x0=-tw;x1=0;} else {x0=0;x1=tw;}
    const pad=hpx*0.28;
    ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1,mm2px(store.format.stroke||0.2));
    ctx.beginPath(); ctx.moveTo(x0-pad,topY); ctx.lineTo(x1+pad,topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0-pad,botY); ctx.lineTo(x1+pad,botY); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- TITLE BLOCK grid fractions ---------- */
const FX={apN:0.1444, ap:0.2404, scl:0.3599, tol:0.4801, size:0.5734, mat:0.6198,
          ver:0.6667, part:0.7596, col:0.8318, logo:0.9036};
const FY={b1:0.3333, b2:0.664, a2:0.5, a3:0.664, a4:0.828, t2:0.5, t3:0.828};

function sheetInfo(page){ const sheets=store.pages.filter(p=>p.type==='sheet'); const i=sheets.indexOf(page);
  if(i<0) return {idx:'X',total:'X'};                       // template preview
  return {idx:i+1,total:sheets.length}; }
function tbRect(){ const {W,H}=paperDims(); const m=store.format.margin; return { x:W-m-TB_W, y:m, w:TB_W, h:TB_H }; }

function drawTitleBlock(page){
  const r=tbRect(), t=page.title||{}, f=store.format, ap=f.approvals||{}, si=sheetInfo(page);
  const X=fx=>r.x+fx*TB_W, Y=fy=>r.y+(1-fy)*TB_H;      // fx/fy are fractions, fy measured from top
  const thin=Math.max(0.7,mm2px(0.18)), thick=Math.max(1.1,mm2px(0.3));
  ctx.strokeStyle=INK; ctx.lineWidth=thick;
  const o1=W2S(r.x,r.y+TB_H), o2=W2S(r.x+TB_W,r.y);
  ctx.strokeRect(o1.x,o1.y,o2.x-o1.x,o2.y-o1.y);
  ctx.lineWidth=thin;
  const V=(fx,fy0,fy1)=>{ const a=W2S(X(fx),Y(fy0)),b=W2S(X(fx),Y(fy1)); seg(a,b); };
  const Hl=(fy,fx0,fx1)=>{ const a=W2S(X(fx0),Y(fy)),b=W2S(X(fx1),Y(fy)); seg(a,b); };
  /* text: fits inside a cell, shrinking if necessary */
  const T=(x,yBase,txt,em,bold,al,maxW)=>{
    txt=(txt==null?'':String(txt)); if(!txt) return;
    let e=em; if(maxW){ const w=measureMM(txt,em,bold); if(w>maxW) e=em*maxW/w; }
    drawTextMM(x,yBase,txt,e,bold,al);
  };
  const LB=(fx,fyTop,txt)=>T(X(fx)+0.8, Y(fyTop)-2.50, txt, 1.65, false,'l');      // cell label (baseline 2.50mm below the rule)
  const VAL=(fx0,fx1,fyTop,fyBot,txt,em,bold)=>{                                    // value: baseline at 24.5% of cell height
    const yT=Y(fyTop), yB=Y(fyBot);
    T((X(fx0)+X(fx1))/2, yB+(yT-yB)*0.245, txt, em, bold, 'c', (X(fx1)-X(fx0))-2.4);
  };
  const CEN=(fx0,fx1,fyTop,fyBot,txt,em,bold)=>{                                    // vertically centred
    const yT=Y(fyTop), yB=Y(fyBot);
    T((X(fx0)+X(fx1))/2, (yT+yB)/2-em*0.716/2, txt, em, bold, 'c', (X(fx1)-X(fx0))-2.0);
  };

  /* ---------------- grid ---------------- */
  V(FX.ap,0,1); V(FX.tol,0,1); V(FX.part,0,1);
  V(FX.apN,FY.b1,1);
  V(FX.scl,FY.t2,FY.t3);
  V(FX.size,FY.b1,FY.b2); V(FX.ver,FY.b1,FY.b2);
  V(FX.mat,FY.b2,1); V(FX.col,FY.b2,1);
  V(FX.logo,FY.b1,1);
  Hl(FY.b1,0,FX.ap); Hl(FY.b1,FX.tol,1); Hl(FY.b2,FX.tol,FX.logo);   // middle column has no line at .3333
  Hl(FY.a2,0,FX.tol); Hl(FY.a3,0,FX.ap); Hl(FY.a4,0,FX.tol);

  /* ---------------- left: notes + approvals ---------------- */
  const cxL=(0+FX.ap)/2;
  T(X(cxL), Y(0.145), 'BREAK ALL SHARP EDGES AND REMOVE', 1.65,false,'c', TB_W*FX.ap-2);
  T(X(cxL), Y(0.242), 'BURRS', 1.65,false,'c');
  CEN(0,FX.apN,FY.b1,FY.a2,'APPROVALS',1.65,false);
  CEN(FX.apN,FX.ap,FY.b1,FY.a2,'DATE',1.65,false);
  [['DESIGN',ap.design,FY.a2,FY.a3],['DRAWN',ap.drawn,FY.a3,FY.a4],['APPROVED',ap.approved,FY.a4,1]]
   .forEach(([role,obj,f0,f1])=>{
    const yc=(Y(f0)+Y(f1))/2;
    T(X(0)+0.9, yc-1.69*0.716/2, role, 1.69,false,'l');
    CEN(0.075,FX.apN,f0,f1,(obj&&obj.name)||'NAME',1.65,true);
    CEN(FX.apN,FX.ap,f0,f1,(obj&&obj.date)||'YYYY/MM/DD',1.65,false);
  });

  /* ---------------- middle: tolerances / scale ---------------- */
  T(X(FX.ap)+0.9, Y(0.102), 'UNLESS OTHERWISE SPECIFIED DIMENSIONS',1.48,false,'l',TB_W*(FX.tol-FX.ap)-1.8);
  T(X(FX.ap)+0.9, Y(0.199), 'ARE IN MILLIMETERS TOLERANCES ARE:',1.48,false,'l',TB_W*(FX.tol-FX.ap)-1.8);
  T(X(0.327), Y(0.306), '+-',1.20,false,'l');
  [['x.x',0.306],['x.xx',0.382],['x.xxx',0.452]].forEach(([txt,fy])=>
    T(X(0.341), Y(fy), txt,1.20,false,'l'));
  [['0.1',0.306],['0.05',0.382],['0.02',0.452]].forEach(([v,fy])=>
    T(X(0.372), Y(fy), v,1.20,false,'l'));
  T(X(FX.ap)+0.8, Y(0.602), 'SCALE',1.65,false,'l');
  T((X(FX.ap)+X(FX.scl))/2, Y(0.747), t.scale||f.scale||'1:1',2.21,true,'c',TB_W*(FX.scl-FX.ap)-2.4);
  projSym((X(FX.scl)+X(FX.tol))/2, (Y(FY.t2)+Y(FY.t3))/2,
          TB_W*(FX.tol-FX.scl), TB_H*(FY.t3-FY.t2));
  CEN(FX.ap,FX.tol,FY.t3,1,'DO NOT SCALE DRAWING',1.85,false);

  /* ---------------- right: title / project / specs ---------------- */
  LB(FX.tol,0,'TITLE');    VAL(FX.tol,FX.part,0,FY.b1,t.title||'TITLE',3.34,true);
  LB(FX.part,0,'PROJECT'); VAL(FX.part,1,0,FY.b1,(store.name||'PROJECT').toUpperCase(),3.34,true);
  LB(FX.tol,FY.b1,'SIZE');        VAL(FX.tol,FX.size,FY.b1,FY.b2,f.paper,2.24,true);
  LB(FX.size,FY.b1,'VERSION');    VAL(FX.size,FX.ver,FY.b1,FY.b2,t.version||f.version||'VER.',2.24,true);
  LB(FX.ver,FY.b1,'PART NO.');    VAL(FX.ver,FX.part,FY.b1,FY.b2,t.partNo||'NO.',2.24,true);
  LB(FX.part,FY.b1,'DRAWING NO.');VAL(FX.part,FX.logo,FY.b1,FY.b2,t.drawingNo||'PRJ-VER-PRT-XX',2.24,true);
  LB(FX.tol,FY.b2,'MATERIAL');    VAL(FX.tol,FX.mat,FY.b2,1,t.material||'MATERIAL',2.24,true);
  LB(FX.mat,FY.b2,'FINISH');      VAL(FX.mat,FX.part,FY.b2,1,t.finish||'FINISH',2.24,true);
  LB(FX.part,FY.b2,'COLOR');      VAL(FX.part,FX.col,FY.b2,1,t.color||'COLOR',2.24,true);
  LB(FX.col,FY.b2,'SHEET');       VAL(FX.col,FX.logo,FY.b2,1,`${si.idx} OF ${si.total}`,2.24,true);
  tbLogo((X(FX.logo)+X(1))/2, (Y(FY.b1)+Y(1))/2,
         TB_W*(1-FX.logo), TB_H*(1-FY.b1));
}

/* first-angle projection symbol: truncated cone + crosshair target */
/* The projection symbol, taken from Title_Block_projection.svg rather than drawn
   by hand: the artwork is the source, so what appears on the sheet is what was
   supplied. Its own drawing is 132 x 50 and it is fitted into the cell with a
   margin, so it never touches the ruled lines around it. */
const PROJ_SVG_W=132, PROJ_SVG_H=50, PROJ_PAD_MM=1.0;
const PROJ_ART={
  circles:[[101.265,24.664,16.78],[101.265,24.664,8.39]],
  lines:[[72.442,24.664,89.35,24.664],[114.017,24.664,130.568,24.664],
         [96.79,24.664,105.739,24.664],
         [101.265,1.042,101.265,12.241],[101.265,36.908,101.265,48.286],
         [101.265,19.682,101.265,28.631],
         [1.042,24.664,17.95,24.664],[42.616,24.664,59.167,24.664],
         [25.39,24.664,34.339,24.664]],
  cone:[[47.557,7.884],[47.557,41.443],[12.651,33.053],[12.651,16.273]]
};
function projSym(cx,cy,wmm,hmm){
  const boxW=Math.abs(mm2px(wmm));
  const boxH=Math.abs(mm2px(hmm!=null? hmm : wmm*PROJ_SVG_H/PROJ_SVG_W));
  const pad=mm2px(PROJ_PAD_MM);
  const s=Math.min((boxW-2*pad)/PROJ_SVG_W, (boxH-2*pad)/PROJ_SVG_H);
  /* a cell too small to hold it, or a back-to-front view, draws nothing rather
     than throwing and taking the whole render down */
  if(!isFinite(s) || s<=0.005) return;
  const c=W2S(cx,cy);
  const P=(x,y)=>[c.x+(x-PROJ_SVG_W/2)*s, c.y+(y-PROJ_SVG_H/2)*s];
  ctx.save();
  ctx.strokeStyle=INK;
  ctx.lineWidth=Math.max(0.7, s*2.08);
  ctx.lineCap='round'; ctx.lineJoin='round';
  PROJ_ART.circles.forEach(function(a){ const q=P(a[0],a[1]);
    ctx.beginPath(); ctx.arc(q[0],q[1],a[2]*s,0,7); ctx.stroke(); });
  PROJ_ART.lines.forEach(function(l){ const a=P(l[0],l[1]), b=P(l[2],l[3]);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); });
  ctx.beginPath();
  PROJ_ART.cone.forEach(function(q,i){ const z=P(q[0],q[1]);
    i? ctx.lineTo(z[0],z[1]) : ctx.moveTo(z[0],z[1]); });
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function projSymDrawn(cx,cy,wmm){
  const u=Math.abs(mm2px(wmm))/15;
  /* a zero-width or back-to-front view gives a negative radius, which throws and
     takes the whole render down with it; nothing can be drawn that small anyway */
  if(!isFinite(u) || u<=0.01) return;
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.7,mm2px(0.18));
  const c=W2S(cx,cy), fx=c.x-u*4.0, tx=c.x+u*3.4;
  ctx.beginPath();
  ctx.moveTo(fx-u*2.6,c.y-u*1.5); ctx.lineTo(fx+u*1.0,c.y-u*2.7);
  ctx.lineTo(fx+u*1.0,c.y+u*2.7); ctx.lineTo(fx-u*2.6,c.y+u*1.5); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fx-u*3.6,c.y); ctx.lineTo(fx+u*1.6,c.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(tx,c.y,u*2.2,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(tx,c.y,u*1.0,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx-u*3.4,c.y); ctx.lineTo(tx+u*3.4,c.y);
  ctx.moveTo(tx,c.y-u*3.4); ctx.lineTo(tx,c.y+u*3.4); ctx.stroke();
}
/* The logo is the supplied image, filling its cell edge to edge with no margin.

let _tbLogoImg=null, _tbLogoReady=false;
function tbLogoImage(){
  if(_tbLogoImg) return _tbLogoImg;
  _tbLogoImg=new Image();
  _tbLogoImg.onload=function(){ _tbLogoReady=true; try{ render(); }catch(e){} };
  _tbLogoImg.src=TB_LOGO_SRC;
  return _tbLogoImg;
}
function tbLogo(cx,cy,wmm,hmm){
  const img=tbLogoImage();
  if(!_tbLogoReady || !img.naturalWidth) return;
  const w=Math.abs(mm2px(wmm));
  const h=Math.abs(mm2px(hmm!=null? hmm : wmm*0.62));
  if(!(w>1 && h>1)) return;
  const c=W2S(cx,cy);
  const s=Math.min(w/img.naturalWidth, h/img.naturalHeight);
  const dw=img.naturalWidth*s, dh=img.naturalHeight*s;
  ctx.save();
  ctx.drawImage(img, c.x-dw/2, c.y-dh/2, dw, dh);
  ctx.restore();
}
function tbLogoDrawn(cx,cy,wmm){
  const c=W2S(cx,cy), R=mm2px(wmm*0.30);
  ctx.strokeStyle='#1b3b6f'; ctx.fillStyle='#1b3b6f'; ctx.lineWidth=Math.max(0.9,mm2px(0.28));
  ctx.beginPath();
  for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3, x=c.x+R*Math.cos(a), y=c.y-mm2px(1.7)+R*Math.sin(a);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${R*0.85}px ${store.format.font},Arial`; ctx.fillText('GM',c.x,c.y-mm2px(1.7));
  ctx.font=`700 ${mm2px(1.25)}px ${store.format.font},Arial`; ctx.fillText('GENERAL MAGIC',c.x,c.y+mm2px(2.9));
  ctx.font=`400 ${mm2px(0.95)}px ${store.format.font},Arial`; ctx.fillText('(THAILAND) CO.,Ltd.',c.x,c.y+mm2px(4.3));
  ctx.fillStyle=INK; ctx.strokeStyle=INK; ctx.textAlign='left'; ctx.textBaseline='top';
}
/* ============================================================
   TITLE BLOCK PANEL (PRD §6) — double-click the title block to edit.
   Per-sheet fields: Title, Part No., Version, Drawing No., Scale,
   Material, Finish, Color.  (SIZE comes from Format Config.)
   ============================================================ */
function esc(v){ return String(v==null?'':v).replace(/"/g,'&quot;'); }
function titlePanelValues(){
  const v=id=>{ const e=$('#'+id); return e?e.value:''; };
  return { title:v('tbTitle'), partNo:v('tbPart'), version:v('tbVer'), drawingNo:v('tbDraw'),
    scale:(v('tbScale1')||'1')+':'+(v('tbScale2')||'1'),
    material:v('tbMat'), finish:v('tbFin'), color:v('tbCol') };
}
function openTitlePanel(){
  const pg=activePage(); if(pg.type!=='sheet') return;
  const t=pg.title||(pg.title={});
  const sc=String(t.scale||store.format.scale||'1:1').split(':');
  $('#rpTitle').textContent='Title Block';
  $('#rpBody').innerHTML=`
    <div class="grp"><label>Title</label>
      <input class="rp-inp" id="tbTitle" placeholder="Title" value="${esc(t.title)}"></div>
    <div class="grp row2">
      <div><label>Part No.</label><input class="rp-inp" id="tbPart" placeholder="No." value="${esc(t.partNo)}"></div>
      <div><label>Version</label><input class="rp-inp" id="tbVer" placeholder="Version" value="${esc(t.version)}"></div>
    </div>
    <div class="grp"><label>Drawing No.<i class="bi bi-info-circle lab-info" title="Project-Version-Part(Title)-Number"></i></label>
      <input class="rp-inp" id="tbDraw" placeholder="PRJ-VER-PRT-XX" value="${esc(t.drawingNo)}"></div>
    <div class="grp row2">
      <div><label>Scale</label><div class="scalerow">
        <input class="rp-inp" id="tbScale1" value="${esc(sc[0]||'1')}">
        <span style="color:#6b7178">:</span>
        <input class="rp-inp" id="tbScale2" value="${esc(sc[1]||'1')}"></div></div>
      <div><label>Material</label><input class="rp-inp" id="tbMat" placeholder="Material" value="${esc(t.material)}"></div>
    </div>
    <div class="grp row2">
      <div><label>Finish</label><input class="rp-inp" id="tbFin" placeholder="Finish" value="${esc(t.finish)}"></div>
      <div><label>Color</label><input class="rp-inp" id="tbCol" placeholder="Color" value="${esc(t.color)}"></div>
    </div>`;
  const live=()=>{ Object.assign(pg.title,titlePanelValues()); render(); };
  $('#rpBody').querySelectorAll('input').forEach(i=>i.addEventListener('input',live));
  $('#rpSave').onclick=()=>{ snapshot(); Object.assign(pg.title,titlePanelValues()); afterMutate();
    $('#rpanel').classList.remove('open'); };
  $('#rpClose').onclick=()=>{ $('#rpanel').classList.remove('open'); render(); };
  $('#rpanel').classList.add('open');
}
