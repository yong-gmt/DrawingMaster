/* ============================================================
   SIDEBAR (pages list)
   ============================================================ */
const PAGE_ICON={cover:'bi-book',description:'bi-text-left',sheet:'bi-layers'};
function renderSidebar(){
  const list=$('#pageList'); list.innerHTML='';
  store.pages.forEach(p=>{
    const it=el('div','page-item'+(p.id===store.activeId?' active':''));
    it.dataset.id=p.id;
    it.draggable = (p.type==='sheet');                     // only sheets reorder (Cover/Description fixed)
    it.innerHTML=`<span class="pico"><i class="bi ${PAGE_ICON[p.type]||'bi-file'}"></i></span><span class="pname">${escapeHtml(p.name)}</span>`;
    it.onclick=()=>{ if(!it._dragging && !it._editing) setActive(p.id); };
    // manual double-click detection (native dblclick is unreliable on draggable rows).
    // keyed by page id so it survives the re-render that the first click triggers.
    it.querySelector('.pname').addEventListener('click',e=>{
      const now=Date.now();
      if(_pnClick.id===p.id && now-_pnClick.t<450){ e.stopPropagation(); _pnClick={id:null,t:0};
        const cur=[...$('#pageList').children].find(c=>c.dataset.id===p.id) || it;
        startRenamePage(cur, p);
      } else { _pnClick={id:p.id, t:now}; }   // first click still bubbles -> activates the page
    });
    if(p.type==='sheet'){ bindDrag(it,p);
      const del=el('span','pdel'); del.title='delete this page'; del.innerHTML='<i class="bi bi-trash"></i>';
      del.setAttribute('draggable','false');
      del.addEventListener('mousedown',e=>e.stopPropagation());
      del.addEventListener('click',e=>{ e.stopPropagation(); deleteSheet(p.id); });
      it.appendChild(del);
    }
    list.appendChild(it);
  });
}
let dragId=null;
let _pnClick={id:null,t:0};
function bindDrag(it,page){
  it.addEventListener('dragstart',e=>{ dragId=page.id; it._dragging=true; it.classList.add('dragging');
    e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',page.id);}catch(_){} });
  it.addEventListener('dragend',()=>{ it._dragging=false; it.classList.remove('dragging'); dragId=null;
    [...$('#pageList').children].forEach(c=>c.classList.remove('drop-above','drop-below')); });
  it.addEventListener('dragover',e=>{
    if(!dragId||dragId===page.id||page.type!=='sheet') return; e.preventDefault();
    const rect=it.getBoundingClientRect(); const below=(e.clientY-rect.top)>rect.height/2;
    it.classList.toggle('drop-below',below); it.classList.toggle('drop-above',!below);
  });
  it.addEventListener('dragleave',()=>{ it.classList.remove('drop-above','drop-below'); });
  it.addEventListener('drop',e=>{
    e.preventDefault(); if(!dragId||dragId===page.id) return;
    const rect=it.getBoundingClientRect(); const below=(e.clientY-rect.top)>rect.height/2;
    reorderSheet(dragId, page.id, below);
  });
}
function reorderSheet(fromId,toId,after){
  const pages=store.pages;
  const fi=pages.findIndex(p=>p.id===fromId); if(fi<0) return;
  snapshot();
  const [moved]=pages.splice(fi,1);
  let ti=pages.findIndex(p=>p.id===toId);
  if(after) ti+=1;
  pages.splice(ti,0,moved);
  afterMutate();                                           // re-renders sidebar + sheet (numbering follows)
}
function deleteSheet(id){
  const p=store.pages.find(x=>x.id===id); if(!p||p.type!=='sheet') return;   // only sheets deletable
  const idx=store.pages.findIndex(x=>x.id===id); if(idx<0) return;
  snapshot();
  store.pages.splice(idx,1);
  if(store.activeId===id){                                                   // choose a sensible next page
    const next=store.pages[idx] || store.pages[idx-1] || store.pages[0];
    if(next) store.activeId=next.id;
  }
  afterMutate();                                                             // re-render sidebar+sheet, renumber, persist, undo
  toast('page deleted');
}
function startRenamePage(it,page){
  if(it._editing) return;
  it._editing=true; it.draggable=false;
  const span=it.querySelector('.pname');
  const inp=document.createElement('input');
  inp.className='pedit'; inp.value=page.name; inp.spellcheck=false;
  span.replaceWith(inp); inp.focus(); inp.select();
  const finish=(save)=>{
    if(it._done) return; it._done=true;
    const val=inp.value.trim();
    if(save && val && val!==page.name){ snapshot(); page.name=val; afterMutate(); }
    else renderSidebar();
  };
  inp.addEventListener('keydown',e=>{ e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); finish(true); }
    else if(e.key==='Escape'){ e.preventDefault(); finish(false); } });
  inp.addEventListener('blur',()=>finish(true));
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.addEventListener('dblclick',e=>e.stopPropagation());
}
function setActive(id){
  try{ setTimeout(updateImportBadge,0); }catch(_){} store.activeId=id; if(typeof clearSelection==='function'){ selIds=new Set(); marquee=null; updateSelToolbar(); if(typeof hideCtxMenu==='function')hideCtxMenu(); } renderSidebar(); render(); persist(); }
function addPage(){ snapshot(); const n=store.pages.filter(p=>p.type==='sheet').length+1;
  const s=mkSheet('Sheet '+String(n).padStart(2,'0')); store.pages.push(s); store.activeId=s.id; afterMutate(); }

/* ============================================================
   INTERACTION (pan / zoom / coord) — selection in module 2
   ============================================================ */
let panning=false, panStart=null;
function bindStage(){
  stage.addEventListener('mousedown',e=>{
    if(e.button===1){ panning=true; panStart={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty}; e.preventDefault(); return; } // middle = pan
    if(e.button!==0 || editor) return;
    const pg=activePage(); if(!pg||pg.type!=='sheet') return;
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    // A dimension grip, or a dimension lying over the title block area, is an exact
    // target the user is aiming at, so it outranks the title-block zone. Without
    // this a dimension that overlaps the block could never be selected at all.
    const dpre=dimStretchAt(w.x,w.y);
    const tb=tbRect();
    if(!dpre && !bomHitAt(pg,w.x,w.y) && w.x>=tb.x&&w.x<=tb.x+TB_W&&w.y>=tb.y&&w.y<=tb.y+TB_H){
      const over=objAtPoint(w.x,w.y);
      if(!over || !over._dim) return;                // the block itself: dblclick edits it
    }
    { const dhit=dpre;                               // stretch a dimension
      if(dhit){ if(dhit.kind==='bal') beginBalDrag(dhit.g);
                else if(dhit.kind==='sec') beginSecDrag(dhit.g);
                else if(dhit.kind==='model') beginDimModelDrag(dhit.g, w.x, w.y);
                else if(dhit.kind==='end') beginDimDrag(dhit.h);
                else beginDimLineDrag(dhit.l, w.x, w.y);
                e.preventDefault(); return; } }
    const rh=bomResizeHit(pg, w.x, w.y);              // BOM width / column resize
    if(rh){ const b=pg.bom; snapshot();
      selIds=new Set(['bom']); updateSelToolbar();   // grabbing a divider selects it too
      bomDrag={ ...rh, startX:w.x, colW0:JSON.parse(JSON.stringify(b.colW)), moved:false }; e.preventDefault(); render(); return; }
    if(pg.bom){ const bb=bomBounds(pg);               // drag inside the table = move it
      if(bb && w.x>=bb.x && w.x<=bb.x+bb.w && w.y<=bb.y && w.y>=bb.y-bb.h){ snapshot();
        // selecting it as well is what makes Delete work on it, and what draws the
        // usual selection outline so it reads as a thing on the page
        selIds=new Set(['bom']); updateSelToolbar();
        bomDrag={ type:'move', startX:w.x, startY:w.y, x0:pg.bom.x, y0:pg.bom.y, moved:false }; e.preventDefault(); render(); return; } }
    const hit=objAtPoint(w.x,w.y);
    // clicking anything outside the group we stepped into puts us back outside it
    if(_inGroup && (!hit || hit.group!==_inGroup)) _inGroup=null;
    // Shift on something already selected = "drag me straight", not "deselect me"
    const holdingSelected=(e.shiftKey && hit && selIds.has(hit.id));
    const additive=((e.shiftKey && !holdingSelected)||e.ctrlKey||e.metaKey);
    if(hit){
      const ids=expandGroup(new Set([hit.id]));
      if(additive){                                         // toggle this object in/out of the selection
        const inSel=[...ids].every(id=>selIds.has(id));
        if(inSel) ids.forEach(id=>selIds.delete(id)); else ids.forEach(id=>selIds.add(id));
        selIds=expandGroup(selIds); updateSelToolbar();
      } else if(!selIds.has(hit.id)){ selIds=ids; updateSelToolbar(); }
      if(selIds.size && selIds.has(hit.id)){                // begin dragging the current selection
        snapshot();
        const orig=new Map(); selIds.forEach(id=>{ const o=objById(id); if(o) orig.set(id,{dx:o.dx,dy:o.dy}); });
        objDrag={ startW:w, orig, moved:false, bb0:selectionBBox() };
      }
      e.preventDefault();
    } else {
      if(e.shiftKey){ panning=true; panStart={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty}; e.preventDefault(); return; } // shift+empty = pan
      if(!(e.ctrlKey||e.metaKey)) { selIds=new Set(); updateSelToolbar(); }   // Ctrl keeps existing (additive marquee)
      marquee={ x0:w.x, y0:w.y, x1:w.x, y1:w.y }; e.preventDefault();
    }
    render();
  });
  window.addEventListener('mousemove',e=>{
    if(panning){ view.tx=panStart.tx+(e.clientX-panStart.x); view.ty=panStart.ty+(e.clientY-panStart.y); render(); }
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    const h=$('#coordHud'); if(h) h.textContent=`${w.x.toFixed(1)}, ${w.y.toFixed(1)} mm`;
    if(balDrag){ updateBalDrag(w.x,w.y); return; }
    if(secDrag){ updateSecDrag(w.x,w.y); return; }
    if(dimMDrag){ updateDimModelDrag(w.x,w.y); return; }
    if(dimDrag){ if(dimDrag.mode==='line') updateDimLineDrag(w.x,w.y); else updateDimDrag(w.x,w.y); return; }
    if(bomDrag){ const pg=activePage(); const b=pg&&pg.bom; if(b){
      if(bomDrag.type==='move'){ const dx=w.x-bomDrag.startX, dy=w.y-bomDrag.startY;
        if(Math.abs(dx)+Math.abs(dy)>0.001) bomDrag.moved=true; b.x=bomDrag.x0+dx; b.y=bomDrag.y0+dy; render(); return; }
      const dx=w.x-bomDrag.startX;
      if(Math.abs(dx)>0.001) bomDrag.moved=true;
      if(bomDrag.type==='col'){ b.colW[bomDrag.key]=Math.max(BOM_MINCOL, bomDrag.colW0[bomDrag.key]+dx); }
      else { const vis=bomVisible(b); const tot0=vis.reduce((s,d)=>s+(bomDrag.colW0[d.key]||d.w),0);
        const sc=Math.max(0.3,(tot0+dx)/tot0); vis.forEach(d=>{ b.colW[d.key]=Math.max(BOM_MINCOL,(bomDrag.colW0[d.key]||d.w)*sc); }); }
      render(); } return; }
    if(objDrag){ let ddx=w.x-objDrag.startW.x, ddy=w.y-objDrag.startW.y;
      if(Math.abs(ddx)+Math.abs(ddy)>0.001) objDrag.moved=true;
      /* Shift locks the move to whichever axis it has travelled further along.
         The axis is held EXACTLY - the value the drag started with, not a snapped
         one - so the centre of the selection stays on its line however far it is
         pushed, and however many objects are in it. */
      const lock=e.shiftKey && (Math.abs(ddx)>0.001 || Math.abs(ddy)>0.001)
        ? (Math.abs(ddx)>=Math.abs(ddy) ? 'x' : 'y') : null;
      if(lock==='x') ddy=0; else if(lock==='y') ddx=0;
      const sn=computeSnap(objDrag.bb0, ddx, ddy, lock);   // Illustrator-style smart snapping
      ddx=sn.ddx; ddy=sn.ddy; snapGuides=sn.guides;
      if(lock==='x') ddy=0; else if(lock==='y') ddx=0;     // snapping must not undo the lock
      if(lock){
        // show the line the centre is travelling along
        const b0=objDrag.bb0;
        const cx=(b0.minx+b0.maxx)/2+ddx, cy=(b0.miny+b0.maxy)/2+ddy;
        const {W,H}=paperDims();
        snapGuides=(snapGuides||[]).concat(lock==='x'
          ? [{x0:0, y0:cy, x1:W, y1:cy, lock:true}]
          : [{x0:cx, y0:0, x1:cx, y1:H, lock:true}]);
      }
      objDrag.orig.forEach((o0,id)=>{ const o=objById(id); if(o){ o.dx=o0.dx+ddx; o.dy=o0.dy+ddy; } });
      render(); }
    else if(marquee){ marquee.x1=w.x; marquee.y1=w.y; render(); }
  });
  window.addEventListener('mouseup',e=>{
    panning=false; snapGuides=[];
    if(balDrag){ endBalDrag(); }
    if(secDrag){ endSecDrag(); }
    if(dimMDrag){ endDimModelDrag(); }
    if(dimDrag){ endDimDrag(); }
    if(bomDrag){ if(bomDrag.moved) afterMutate(); else { history.undo.pop(); updateUndoButtons(); } bomDrag=null; }
    if(objDrag){ if(objDrag.moved){ afterMutate(); }   // keep pre-move snapshot, persist new state
      else { history.undo.pop(); updateUndoButtons(); } // no movement -> discard spurious snapshot
      objDrag=null; }
    if(marquee){ const found=objsInRect(marquee.x0,marquee.y0,marquee.x1,marquee.y1);
      if(found.length){ const ids=new Set(selIds); found.forEach(o=>ids.add(o.id)); selIds=expandGroup(ids); }
      marquee=null; updateSelToolbar(); render(); }
  });
  stage.addEventListener('wheel',e=>{ e.preventDefault(); const r=stage.getBoundingClientRect();
    zoomBy(e.deltaY<0?1.1:0.9, e.clientX-r.left, e.clientY-r.top); }, {passive:false});
  stage.addEventListener('dblclick',e=>{
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    const pg=activePage();
    if(pg&&pg.type==='sheet'){ const tb=tbRect();
      if(w.x>=tb.x&&w.x<=tb.x+TB_W&&w.y>=tb.y&&w.y<=tb.y+TB_H){ openTitlePanel(); return; }
      const bb=bomBounds(pg); if(bb && w.x>=bb.x && w.x<=bb.x+bb.w && w.y<=bb.y && w.y>=bb.y-bb.h){ openBomPanel(); return; }
      /* Step into a group before anything else - but only from outside it, so a
         second double-click on a value still opens the text for editing. */
      { const hit=objAtPoint(w.x,w.y);
        if(hit && hit.ug && hit.group && hit.group!==_inGroup){
          _inGroup=hit.group;
          selIds=expandGroup(new Set([hit.id])); updateSelToolbar(); render();
          toast('inside the group — Esc to leave');
          return; } }
      const ht=textAtPoint(w.x,w.y); if(ht){ startTextEdit(ht.ob,ht.t); return; } }
    const z=zoneAt(w.x,w.y); if(z) startEdit(z);
  });
  stage.addEventListener('mousemove',e=>{
    if(editor) return;
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    const pg=activePage(); let overTB=false;
    if(pg&&pg.type==='sheet'){ const tb=tbRect(); overTB=(w.x>=tb.x&&w.x<=tb.x+TB_W&&w.y>=tb.y&&w.y<=tb.y+TB_H); }
    const dhit = pg&&pg.type==='sheet' ? dimStretchAt(w.x,w.y) : null;
    const dhz = dhit;
    const rhz = pg&&pg.type==='sheet' ? bomResizeHit(pg,w.x,w.y) : null;
    let overBom=false; if(pg&&pg.type==='sheet'&&pg.bom&&!rhz){ const bb=bomBounds(pg); overBom=!!(bb && w.x>=bb.x && w.x<=bb.x+bb.w && w.y<=bb.y && w.y>=bb.y-bb.h); }
    stage.style.cursor = dhz ? ((dhit.kind==='end'||(dhit.g&&dhit.g.kind==='ext'))?'crosshair':'move') : rhz ? 'ew-resize' : (overBom ? 'move' : (overTB ? 'pointer' : ((zoneAt(w.x,w.y)||(pg&&pg.type==='sheet'&&textAtPoint(w.x,w.y))) ? 'text' : (pg&&pg.type==='sheet'&&objAtPoint(w.x,w.y) ? 'move' : 'default'))));
  });
  stage.addEventListener('contextmenu',e=>{
    e.preventDefault();
    const pg=activePage(); if(!pg||pg.type!=='sheet'){ hideCtxMenu(); return; }
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    const hit=objAtPoint(w.x,w.y);
    if(hit && !selIds.has(hit.id)){ selIds=expandGroup(new Set([hit.id])); updateSelToolbar(); render(); }
    if(!selIds.size){ hideCtxMenu(); return; }
    showCtxMenu(e.clientX, e.clientY);
  });
  window.addEventListener('mousedown',e=>{ const m=$('#ctxmenu'); if(m&&m.style.display==='block' && !m.contains(e.target)) hideCtxMenu(); });
  window.addEventListener('wheel',()=>hideCtxMenu(),{passive:true});
  window.addEventListener('resize',()=>{ if(!$('#editor').classList.contains('hide')){ resizeCanvas(); fitView(); } });
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  cv=$('#cv'); ctx=cv.getContext('2d'); stage=$('#stage');
  paintIcons(document); watchIcons();
  load(); renderDashboard();
  loadAsync().then(moved=>{ if(moved) renderDashboard(); });
  $('#btnCreate').onclick=createProject;
  { const g=$('#btnDefaults'); if(g) g.onclick=()=>openFormat(true); }
  $('#btnBack').onclick=goBack;
  $('#btnUndo').onclick=undo; $('#btnRedo').onclick=redo;
  $('#btnCollapse').onclick=()=>$('#sidebar').classList.toggle('collapsed');
  $('#btnAddPage').onclick=addPage;
  $('#zoomIn').onclick=()=>zoomBy(1.25); $('#zoomOut').onclick=()=>zoomBy(0.8); $('#zoomFit').onclick=fitView;
  $('#navName').addEventListener('input',e=>setProjectName(e.target.value));
  $('#btnRenameProj').onclick=()=>$('#navName').focus();
  // module-2 features (wired to no-op-safe stubs until implemented)
  $('#btnFormat').onclick=()=>openFormat(false);
  $('#btnImport').onclick=importDXF;
  { const b=$('#btnStylize'); if(b) b.onclick=stylizeANSI; }                 // real DXF import (rpClose/rpSave handled by openTitlePanel)
  { const bt=$('#btnText'); if(bt) bt.onclick=addTextLabel; }
  // The build stamp, somewhere it can be checked without being in the way: the
  // console, and window.__build. The tab says the name of the program, nothing else.
  try{ window.__build='build 04 Sep 15:39';
       console.log('DrawingMaster — build 04 Sep 15:39'); }catch(e){}
  { const bb=$('#btnBalloon'); if(bb) bb.onclick=addBalloon; }
  { const bb=$('#btnBom'); if(bb) bb.onclick=addBOM; }
  { const be=$('#btnExport'); if(be) be.onclick=openExportMenu; }
  bindStage();
  window.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
    if(editor) return;
    const tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
    const pg=activePage(); const onSheet=pg&&pg.type==='sheet';
    if(!onSheet) return;
    if(e.key==='Escape'){
      /* one step at a time: out of the group first, keeping what is selected, so
         Esc undoes exactly what the double-click did */
      if(leaveGroup()){ selIds=expandGroup(selIds); updateSelToolbar(); render(); hideCtxMenu(); }
      else { clearSelection(); hideCtxMenu(); } }
    else if((e.key==='Delete'||e.key==='Backspace') && selIds.size){ e.preventDefault(); deleteSelection(); }
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='g'){ e.preventDefault(); e.shiftKey?ungroupSelection():groupSelection(); }
    else if(e.key.toLowerCase()==='g' && !e.ctrlKey && !e.metaKey){ e.preventDefault(); e.shiftKey?ungroupSelection():groupSelection(); }
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){ e.preventDefault(); selIds=new Set(selectableObjs().map(o=>o.id)); updateSelToolbar(); render(); }
    else if(selIds.size && e.key.startsWith('Arrow')){ e.preventDefault();
      const step=e.shiftKey?10:(e.altKey?0.1:1);
      let ddx=0,ddy=0; if(e.key==='ArrowLeft')ddx=-step; if(e.key==='ArrowRight')ddx=step; if(e.key==='ArrowUp')ddy=step; if(e.key==='ArrowDown')ddy=-step;
      snapshot(); selIds.forEach(id=>{ const o=objById(id); if(o){ o.dx+=ddx; o.dy+=ddy; } }); afterMutate();
    }
  });
}
function toast(msg){ const t=el('div','toast'); t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),250); },1800); }

/* expose */
window.App = { createProject, openProject, goDashboard, setActive, addPage, fitView, render,
               _state:()=>({store,view}) };
window.__hook = ()=>({ get store(){return store;}, render, App:window.App, fitView, createProject,
  loadDXFText, entitiesBBox, importDXF,

  get selIds(){return selIds;}, nudge:(dx,dy)=>{ selIds.forEach(id=>{const o=objById(id); if(o){o.dx+=dx;o.dy+=dy;}}); afterMutate(); },
  textAtPoint, startTextEdit, W2S:(x,y)=>W2S(x,y),
  computeSnap:(bb,dx,dy)=>computeSnap(bb,dx,dy), get snapGuides(){return snapGuides;},
  dimHandles:(pg)=>dimHandles(pg), beginDimDrag:(h)=>beginDimDrag(h),
  dimLineAt:(x,y)=>dimLineAt(x,y), beginDimLineDrag:(h,x,y)=>beginDimLineDrag(h,x,y),
  updateDimLineDrag:(x,y)=>updateDimLineDrag(x,y), dimAnalyse:(pg,id)=>dimAnalyse(pg,id),
  updateDimDrag:(x,y)=>updateDimDrag(x,y), endDimDrag:()=>endDimDrag(), entsToDXF:(e)=>entsToDXF(e),
  dimModels:(pg)=>dimModelsOf(pg), balModels:(pg)=>balModelsOf(pg),
  dimStretchAt:(x,y)=>dimStretchAt(x,y), expandGroup:(ids)=>expandGroup(ids), insideGroup:()=>insideGroup(), secReport:()=>secReport(), textReport:()=>textReport(), selectionBBox:()=>selectionBBox(), bakeOffsets:(pg)=>bakeOffsets(pg), deleteSelection:()=>deleteSelection(), mm2px:(v)=>mm2px(v), persist:()=>persist(), defaultFormat:()=>loadDefaultFormat(), projects:()=>DB,
  sheetFurnitureBox:(pg)=>sheetFurnitureBox(pg),
  usingIDB:()=>_useIDB, storageReport:()=>storageReport(), idbAll:()=>idbAll(), tbRect:()=>tbRect(),
  projSymAt:()=>{ const t=tbRect(); const X=(f)=>t.x+TB_W*f, Y=(f)=>t.y+TB_H*f;

  addBalloon:()=>addBalloon(), balGrips:(pg)=>balGrips(pg), balGeomOf:(m)=>balGeomOf(m),
  balSyncFromText:(pg,t)=>balSyncFromText(pg,t), balApply:(pg,m)=>balApply(pg,m), recoverReport:(pg)=>((pg.dxf&&pg.dxf.recoverReport)||[]), secModels:(pg)=>secModelsOf(pg),
  secGeomOf:(s)=>secGeomOf(s), secGrips:(pg)=>secGrips(pg), secAxis:(s)=>secAxis(s), secApply:(pg,s,h)=>secApply(pg,s,h), dimRelayout:(pg)=>dimRelayout(pg), dimModelById:(pg,id)=>dimModelById(pg,id),
  dimGeomOf:(m)=>dimGeomOf(m), S2W:(x,y)=>S2W(x,y), buildObjects:(pg)=>buildObjects(pg),
  stylizeLeftovers:(pg)=>stylizeLeftovers(pg), stylizeScan:(pg)=>stylizeScan(pg), recArrows:(o)=>recCollectArrows(o), recDims:(o,mm)=>v2RecoverDims(o,mm,{n:900}), dimTextRole:(s)=>dimTextRole(s), hatchFamilies:(h)=>hatchFamilies(h), hatchStep:(f)=>hatchStep(f), hatchDashArray:(d,k)=>hatchDashArray(d,k), dimTextWidth:(s,h)=>dimTextWidth(s,h), dimFitForm:(m)=>dimFitForm(m), dimFitForm:(m)=>dimFitForm(m), dimModelGrips:(pg)=>dimModelGrips(pg),
  dimApply:(pg,m)=>dimApply(pg,m), activePage:()=>activePage(), bomBounds:(pg)=>bomBounds(pg), convertDXF_v2:(p,t)=>convertDXF_v2(p,t), exportDXF:()=>exportDXF(), buildDXF:(pg)=>buildDXF(pg), captureSheet:(p)=>captureSheet(p), exportPDF:()=>exportPDF(), buildPDF:(im)=>buildPDF(im), renderPageCanvas:(p,d)=>renderPageCanvas(p,d),
  zoomRect(x1,y1,x2,y2){ const sw=stage.clientWidth,sh=stage.clientHeight,pad=60;
    const w=x2-x1,h=y2-y1; view.s=Math.min((sw-pad)/w,(sh-pad)/h);
    const cx=(x1+x2)/2, cy=(y1+y2)/2, c=W2S(cx,cy); view.tx+=sw/2-c.x; view.ty+=sh/2-c.y; render(); } });

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
