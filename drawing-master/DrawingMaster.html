   centre lines. Object geometry (the part outline) is sacred — touching it deleted
   real edges and the damage compounded on every press. A primitive qualifies when it
   belongs to a dimension group, is tagged as a section line, or lives on a layer that
   the CAD file itself marks as annotation. */
/* Dimension value placement (drafting convention): the text sits CENTRED on its
   dimension line and stands clear of it by a small gap. The gap is specified in
   screen pixels (5 px at 1:1) and converted to drawing millimetres so the drawing
   itself stays scale-correct. */
const DIM_TEXT_GAP_PX=5;
const PX_PER_MM=96/25.4;                       // CSS pixel density
function placeDimensionText(pg, txtH){
  const gap=DIM_TEXT_GAP_PX/PX_PER_MM;         // 5 px -> mm
  // collect each dimension's parts
  const byDim={};
  (pg.objects||[]).forEach(o=>{
    (o.prims.polys||[]).forEach(p=>{ if(!p._dim) return;
      (byDim[p._dim]||(byDim[p._dim]={lines:[],texts:[]})).lines.push({o,p}); });
    (o.prims.texts||[]).forEach(t=>{ if(!t._dim) return;
      (byDim[t._dim]||(byDim[t._dim]={lines:[],texts:[]})).texts.push({o,t}); });
  });
  let moved=0;
  // Modelled dimensions are placed from their model - no guessing which line is
  // which, and no cumulative bending when STYLIZE is pressed again.
  dimModelsOf(pg).forEach(m=>{ if(m.ok && dimStylizeText(pg, m, txtH)){ moved++; delete byDim[m.id]; } });
  Object.values(byDim).forEach(g=>{
    if(g.texts.length!==1 || !g.lines.length) return;      // only simple, unambiguous cases
    const {o:to, t}=g.texts[0];
    if(t._userMoved) return;                               // never fight a manual edit
    const rot=((t.rot||0)%180+180)%180;
    const wantVert=Math.abs(rot-90)<30;                    // 90 deg text belongs to a vertical dimension
    // the dimension line = longest straight segment running along the text direction
    let best=null, bl=-1;
    g.lines.forEach(({o,p})=>{
      if(p.pts.length<2) return;
      const a=[p.pts[0][0]+(o.dx||0), p.pts[0][1]+(o.dy||0)];
      const b=[p.pts[p.pts.length-1][0]+(o.dx||0), p.pts[p.pts.length-1][1]+(o.dy||0)];
      const dx=b[0]-a[0], dy=b[1]-a[1]; const len=Math.hypot(dx,dy);
      if(len<1e-6) return;
      const isVert=Math.abs(dy)>Math.abs(dx);
      if(isVert!==wantVert) return;                        // extension lines run the other way
      if(len>bl){ bl=len; best={a,b}; }
    });
    if(!best || bl<txtH) return;
    const mid=[(best.a[0]+best.b[0])/2, (best.a[1]+best.b[1])/2];
    // Perpendicular to the dimension line, on the side the text already favours.
    const n = wantVert ? [-1,0] : [0,1];
    const cur=[t.x+(to.dx||0), t.y+(to.dy||0)];
    const side=((cur[0]-mid[0])*n[0] + (cur[1]-mid[1])*n[1]) >= 0 ? 1 : -1;
    const nx=n[0]*side, ny=n[1]*side;
    // Glyphs grow away from the baseline along "up"; rotating the text by 90 deg turns
    // that direction too. If they grow TOWARDS the line, push the baseline out by one
    // text height so the visible gap stays the same on both sides.
    const rr=(t.rot||0)*Math.PI/180;
    const up=[-Math.sin(rr), Math.cos(rr)];
    const grows=(up[0]*nx + up[1]*ny) > 0;
    const off = gap + (grows?0:txtH);
    // Anchor exactly on the line's midpoint along the line, offset only perpendicular.
    t.align=1;                                             // centred on the dimension line
    t.x = (mid[0] + nx*off) - (to.dx||0);
    t.y = (mid[1] + ny*off) - (to.dy||0);
    moved++;
  });
  return moved;
}
/* Text that belongs to the sheet rather than to the drawing: the border with its
   zone letters, and the title block. Never restyled.
   The layer name catches most of it, but a title block is usually a block whose
   attributes carry some other layer, so the area the title-block text occupies is
   worked out from the file itself and anything sitting inside it is left alone. */
function sheetFurnitureBox(pg){
  let a=1e9,b=1e9,c=-1e9,d=-1e9, any=false;
  (pg.objects||[]).forEach(o=>(o.prims.texts||[]).forEach(t=>{
    if(!/^title|title\s*block/i.test(String(t._layer||''))) return;
    const x=t.x+(o.dx||0), y=t.y+(o.dy||0);
    any=true; if(x<a)a=x; if(y<b)b=y; if(x>c)c=x; if(y>d)d=y; }));
  if(!any) return null;
  const pad=6;
  const box={x0:a-pad, y0:b-pad, x1:c+pad, y1:d+pad};
  /* One stray text on a title layer, out on the drawing, stretches this box across
     the sheet. A title block does not cover a quarter of the page, so when the box
     grows that large it is measuring the wrong thing and the sheet's own title
     block is the better answer. */
  try{
    const {W,H}=paperDims();
    if((box.x1-box.x0)*(box.y1-box.y0) > W*H*0.25) return null;
  }catch(e){}
  return box;
}
function isSheetFurniture(t, o, box){
  if(!t) return false;
  /* A value that belongs to a dimension is never furniture, wherever it sits.
     The title-block area is worked out from where the block's own text happens to
     be, and on some drawings that area reaches out over the views - every value
     inside it was then left at the file's size, which is how a sheet came back
     with half its numbers resized and half not. What a dimension owns is not a
     question of position. */
  if(t._dim || t._dimPart) return false;
  const x=t.x+((o&&o.dx)||0), y=t.y+((o&&o.dy)||0);
  if(box && x>=box.x0 && x<=box.x1 && y>=box.y0 && y<=box.y1) return true;
  try{ const tb=tbRect();
    if(x>=tb.x && x<=tb.x+TB_W && y>=tb.y && y<=tb.y+TB_H) return true; }catch(e){}
  /* The layer name is trusted on its own. Requiring the text to ALSO sit at the
     edge of the sheet looked tighter and was worse: zone letters belong to the
     drawing's own frame, which does not line up with this sheet's margins, so
     seventeen of them were blown up to annotation size. */
  if(/border|frame|title\s*block|^title/i.test(String(t._layer||''))) return true;
  return false;
}
/* Say what STYLIZE did to every piece of text and why - run __hook().textReport()
   in the console. A sheet that comes back half-resized is answered by this list,
   not by guessing which rule missed. */
function textReport(){
  const pg=activePage(); if(!pg||!pg.objects) return 'open a sheet first';
  const want=+((store.format.fontSize||10)*PT_TO_MM).toFixed(3);
  const box=sheetFurnitureBox(pg), rows=[];
  pg.objects.forEach(o=>(o.prims.texts||[]).forEach(t=>{
    const furniture=isSheetFurniture(t,o,box);
    rows.push({ text:String(t.text||'').slice(0,22), heightMM:+(+t.h).toFixed(2),
      layer:t._layer||'', 
      treatedAs: t._dim? 'dimension value' : t._sec? 'section letter'
               : t._user? 'label you added' : furniture? 'sheet furniture - left alone'
               : 'note',
      /* A section letter is deliberately 1.4x the sheet size - ISO 128 asks for a
         larger letter than a dimension value - so it is at ITS wanted size, not
         at the plain one. */
      atWantedSize: Math.abs(t.h - (t._sec? want*SEC_LETTER_SCALE : want)) < 0.01 });
  }));
  const missed=rows.filter(r=>!r.atWantedSize && r.treatedAs!=='sheet furniture - left alone'
                              && r.treatedAs!=='label you added');
  if(console.table) console.table(rows); else console.log(rows);
  console.log(rows.length+' text item(s) · wanted '+want+' mm · '+
              missed.length+' not at that size and not furniture');
  if(missed.length) console.log('missed:', missed);
  return rows;
}
function isAnnotationPrim(p){
  if(!p) return false;
  if(p._dimPart) return false;          // owned by a dimension model, not up for grabs
  if(p._dim) return true;
  if(p._section) return true;
  const L=(p._layer||'').toString();
  return /dimension|dimen|annot|section|center|centre|defpoints|leader|smart\s*center/i.test(L);
}
/* ============================================================================
   §12  THE STYLIZE LOOP
   ----------------------------------------------------------------------------
   STYLIZE keeps going until there is nothing left it knows how to fix.

       repeat:
         1. scan the drawing for dimensions it has not modelled yet
         2. apply every model it has - dimensions, section markers, text
         3. if the scan found nothing new, stop
       then report what is still unresolved, and why

   Pressing it again re-scans from scratch, so anything missed the first time -
   because an earlier pass had taken a piece it needed, or because the drawing
   changed in between - gets picked up on the next press. It is never a one-shot
   pass over whatever happened to be recognised at import.
   ========================================================================== */
const STYLIZE_MAX_PASSES=6;

/* Look for dimensions the drawing has not declared and we have not yet rebuilt.
   Returns how many new ones were found. */
function stylizeScan(pg){
  const d=pg&&pg.dxf; if(!d) return 0;
  let added=0;
  try{
    const seq={n:(d.dims||[]).length+1};
    const rec=v2RecoverDims(d, 1, seq);
    rec.forEach(m=>{
      if(!m.ok) return;
      const raw=v2RecoverRaw(d, m);
      const built=dimProject(m, raw.polys[0], raw.texts);
      v2RecoverReplace(d, m, raw, built);
      (d.dims||(d.dims=[])).push(m);
      added++;
    });
    if(added) v2RecoverSweep(d);
  }catch(err){ console.warn('stylize scan failed', err); }
  return added;
}
/* A model built at import has not been drawn yet - the file's own strokes are
   still there, exactly as its author drew them. STYLIZE is where they are taken
   over, so importing shows the drawing and pressing the button changes it.

   Two kinds of model arrive here. One was read from a DIMENSION entity and every
   stroke that entity drew carries its id; the other was rebuilt from loose
   geometry and keeps a list of the pieces it claimed. A tag is the more reliable
   of the two, because indices shift and tags do not. */
function stylizeAdopt(pg){
  const d=pg&&pg.dxf; if(!d) return 0;
  let n=0;
  (d.dims||[]).forEach(m=>{
    if(!m.pending || !m.ok) return;
    try{
      let raw;
      if(m.refs) raw=v2RecoverRaw(d, m);
      else {
        raw={polys:[], solids:[], texts:[], idx:{polys:[],solids:[],texts:[]}};
        (d.polys||[]).forEach(p=>{ if(p._dim===m.id) raw.polys.push(p); });
        (d.solids||[]).forEach(x=>{ if(x._dim===m.id) raw.solids.push(x); });
        (d.texts||[]).forEach(t=>{ if(t._dim===m.id) raw.texts.push(t); });
      }
      const built=dimProject(m, raw.polys[0]||{}, raw.texts);
      v2RecoverReplace(d, m, raw, built);
      m.pending=false; n++;
    }catch(err){ console.warn('could not adopt', m.id, err); m.pending=false; }
  });
  (d.secs||[]).forEach(s=>{ if(s.ok) s.pending=false; });
  if(n){ v2RecoverSweep(d); buildObjects(pg); dimRelayout(pg); }
  return n;
}
/* Draw every model the page has, from the model - never from the strokes. */
/* The two ANSI switches in Format Config decide what STYLIZE is allowed to touch.
   They used to be wired to the old guess-from-shape passes; when those were
   removed the switches kept their place in the panel and quietly stopped meaning
   anything - the model passes ran either way. A switch that does nothing is worse
   than no switch, so each one now gates its own kind of annotation.

   Off does not mean "undo": it means LEAVE IT ALONE. Whatever the drawing already
   had stays exactly as it was. */
function stylizeApply(pg, txtH){
  const f=store.format;
  let dims=0, secs=0;
  /* One switch, one question: restyle the drawing, or only set the text size?
     Two switches asked which rules applied to which kind of annotation, which is
     not a question anybody wants to answer. Off does not mean "do nothing" - the
     text still gets the size you chose, because that is the part wanted on every
     drawing whether or not its annotation is redrawn. */
  if(!f.ansiRadius) return {dims, secs};
  dimModelsOf(pg).forEach(m=>{ if(m.ok && dimStylizeText(pg, m, txtH)) dims++; });
  balModelsOf(pg).forEach(m=>{ m.h=balTextH(); balApply(pg, m); });
  secModelsOf(pg).forEach(s=>{ if(s.ok && secApply(pg, s, txtH)) secs++; });
  return {dims, secs};
}
/* What is left that really looks like an unfinished dimension. A number on its own
   is not one: the sheet is full of numbers that measure nothing - zone letters,
   sheet counts, dates. What marks a number as a dimension we failed to build is an
   ARROWHEAD next to it that nothing has claimed. */
function stylizeLeftovers(pg){
  const d=pg&&pg.dxf; if(!d) return [];
  const free=[];
  (d.solids||[]).forEach(sd=>{ if(sd._dim||sd._sec) return;
    const a=recArrowFrom(sd); if(a) free.push(a.tip); });
  (d.polys||[]).forEach(p=>{ if(p._dim||p._sec||!p.pts||p.pts.length<3||p.pts.length>5) return;
    if(Math.hypot(p.pts[0][0]-p.pts[p.pts.length-1][0],
                  p.pts[0][1]-p.pts[p.pts.length-1][1])>0.05) return;
    const a=recArrowFrom(p.pts.slice(0,-1).length>=3? p.pts.slice(0,-1) : p.pts);
    if(a) free.push(a.tip); });
  const out=[];
  (d.texts||[]).forEach(t=>{
    if(t._dim || t._sec || t._dimPart) return;
    if(dimTextRole(t.text)!=='value') return;
    const reach=Math.max(40, (t.h||2.5)*20);
    if(!free.some(q=>Math.hypot(q[0]-t.x, q[1]-t.y)<reach)) return;
    out.push(String(t.text).trim());
  });
  return out;
}
function stylizeANSI(){
  const pg=activePage();
  if(!pg||pg.type!=='sheet'||!pg.objects||!pg.objects.length){ toast('open a sheet page with an imported drawing, then press Stylize'); return; }
  const f=store.format;
  snapshot();
  const txtH=(f.fontSize||10)*PT_TO_MM;
  let dims=0, secs=0, found=0, passes=0;
  // Keep going while each pass still turns up something new. A drawing whose
  // dimensions were not declared may need more than one look: the first pass can
  // take a stroke a later value needed, and the rescan puts that right.
  // Take over the file's own strokes only when the switch says to restyle. With
  // it off the drawing is left exactly as the file drew it, and only the text
  // size changes - which is what "off" has to mean for that to be reversible.
  if(store.format.ansiRadius) stylizeAdopt(pg);
  for(; passes<STYLIZE_MAX_PASSES; passes++){
    const add=stylizeScan(pg);
    if(add){ found+=add; buildObjects(pg); dimRelayout(pg); secRelayout(pg); }
    const r=stylizeApply(pg, txtH);
    dims=r.dims; secs=r.secs;
    if(!add) break;
  }
  // text that belongs to nobody: sized to the sheet, never moved
  const furniture=sheetFurnitureBox(pg);
  let textN=0;
  pg.objects.forEach(ob=>{ (ob.prims.texts||[]).forEach(t=>{
    if(isSheetFurniture(t, ob, furniture)) return;
    // a label the user added keeps its own house style: capitals, bold, and two
    // points above the sheet size - STYLIZE re-applies it rather than flattening it
    if(t._balPart){ /* sized by its own model, below */ }
    else if(isUserText(t)){ t.h=userTextHeightMM(); t.bold=true; t.text=userTextValue(t.text); }
    else if(!t._dimPart && !t._sec) t.h=txtH;
    textN++; }); });

  /* A guarantee, not a chain of conditions.
     Size used to be settled in several places - a model here, this pass there,
     a balloon somewhere else - so a value could be restyled by one path and never
     sized by another. That is exactly what a drawing looks like when its circle
     dimensions change shape but keep the file's own text height.
     From here on, everything that is not the sheet's own frame or title block
     leaves this pass at the size Format Config asks for. Section letters keep
     their 1.4x, which ISO 128 asks for. */
  let sizedN=0, fixedN=0;
  pg.objects.forEach(ob=>{ (ob.prims.texts||[]).forEach(t=>{
    if(isSheetFurniture(t, ob, furniture)) return;
    if(isUserText(t) || t._balPart) return;        // these carry their own size
    const want = t._sec ? txtH*SEC_LETTER_SCALE : txtH;
    if(Math.abs((t.h||0)-want)>0.005){ t.h=want; fixedN++; }
    sizedN++; }); });
  // and back into the models, so a later redraw cannot undo it
  dimModelsOf(pg).forEach(m=>{ if(m.ok && m.text) m.text.h=txtH; });
  secModelsOf(pg).forEach(s=>{ if(s.ok && s.label) s.label.h=txtH*SEC_LETTER_SCALE; });
  if(fixedN) console.log('text size: '+fixedN+' of '+sizedN+
    ' item(s) only reached '+txtH.toFixed(2)+' mm in the final pass');

  /* And say which text the size pass was not allowed to touch, and why. On most
     drawings this is the frame and title block, correctly. On a drawing whose
     dimension layer happens to be named after the title block, it is the whole
     reason some values are resized and some are not - so it is named, not left
     silent. */
  const heldBack={};
  pg.objects.forEach(ob=>{ (ob.prims.texts||[]).forEach(t=>{
    if(!isSheetFurniture(t, ob, furniture)) return;
    if(Math.abs((t.h||0)-txtH)<0.005) return;
    heldBack[String(t._layer||'(no layer)')]=(heldBack[String(t._layer||'(no layer)')]||0)+1; }); });
  const heldList=Object.entries(heldBack);
  if(heldList.length) console.log('kept at their own size as part of the sheet: '+
    heldList.map(([k,v])=>k+' x'+v).join(', ')+
    '   -- if any of those are really annotation, tell me that layer name');
  afterMutate();
  const left=stylizeLeftovers(pg);
  const parts=['dimensions '+dims];
  if(secs) parts.push('sections '+secs);
  if(found) parts.push('rebuilt from geometry '+found);
  parts.push('texts '+textN);
  toast('STYLIZE → ANSI ('+parts.join(' · ')+')'
    + (left.length? (' — values still unmatched: '+left.length+'') : ' — nothing left over'));
}

/* ---- inline editing of imported texts (dimension values, labels, ...) ---- */
function textAtPoint(wx,wy){
  const objs=selectableObjs();
  for(let i=objs.length-1;i>=0;i--){ const ob=objs[i]; const dx=ob.dx||0,dy=ob.dy||0;
    const ts=ob.prims.texts||[]; const x=wx-dx, y=wy-dy;
    for(let k=ts.length-1;k>=0;k--){ const t=ts[k]; const hh=t.h||2.5;
      const wlen=Math.max(hh*1.6, String(t.text).length*hh*0.62);
      let x0=t.x, x1=t.x+wlen;
      if(t.align===1){ x0=t.x-wlen/2; x1=t.x+wlen/2; }
      else if(t.align===2){ x0=t.x-wlen; x1=t.x; }
      if(x>=x0-hh*0.3 && x<=x1+hh*0.3 && y>=t.y-hh*0.3 && y<=t.y+hh*1.1) return {ob,t};
    }
  }
  return null;
}
let textEditEl=null;
/* One place that decides the shape of an inline editor, used by both of them:
   the labels on a sheet and the fields on the cover and description pages. */
const EDIT_PAD_MIN=4, EDIT_BORDER=2, EDIT_MIN_FONT=15, EDIT_MIN_W=56;
function editPad(fontPx){ return Math.max(EDIT_PAD_MIN, Math.round(fontPx*0.25)); }
function inlineTextWidth(v, fontPx, bold){
  try{ ctx.save(); ctx.font=(bold?'700 ':'400 ')+fontPx+'px '+store.format.font+',Arial';
       const w=ctx.measureText(String(v||'')||'M').width; ctx.restore(); return w; }
  catch(_){ return String(v||'').length*fontPx*0.6; }
}
/* o: {fontPx, bold, align:'left'|'center'|'right', anchorX, textMidY, textW, minW}
   anchorX is the screen x of the text's OWN anchor - its left edge, centre or
   right edge, whichever the alignment says - so the box is placed from the text
   rather than the text from the box, and nothing appears to jump when clicked. */
function layoutInlineEdit(el, o){
  const f=Math.max(EDIT_MIN_FONT, o.fontPx);
  const lh=Math.round(f*1.3);
  const EDIT_PAD_X=editPad(f), EDIT_PAD_Y=EDIT_PAD_X;   // the same air all round
  const h=lh+EDIT_PAD_Y*2+EDIT_BORDER*2;
  /* Width follows the text. A fixed width covers whatever is beside it, and on a
     sheet that is the drawing itself. */
  const w=(o.fixedW!=null) ? o.fixedW+EDIT_PAD_X*2+EDIT_BORDER*2
        : Math.max(o.minW||EDIT_MIN_W, o.textW+f*1.5)+EDIT_PAD_X*2+EDIT_BORDER*2;
  const rows=Math.max(1, o.rows||1), lhBox=o.lineH||lh;
  el.style.boxSizing='border-box';
  el.style.font=(o.bold?'700 ':'400 ')+f+'px '+store.format.font+',Arial';
  el.style.lineHeight=lh+'px';
  el.style.padding='0 '+EDIT_PAD_X+'px';
  el.style.borderWidth=EDIT_BORDER+'px';
  const hh=(rows>1)? (rows*lhBox+EDIT_PAD_Y*2+EDIT_BORDER*2) : h;
  el.style.width=w+'px'; el.style.height=hh+'px';
  if(rows>1) el.style.lineHeight=lhBox+'px';
  el.style.textAlign=o.align;
  let left=o.anchorX;
  if(o.align==='center') left-=w/2;
  else if(o.align==='right') left-=w-EDIT_PAD_X-EDIT_BORDER;
  else left-=EDIT_PAD_X+EDIT_BORDER;
  /* and never off the edge of the stage, where it could not be typed into */
  const sw=(stage&&stage.clientWidth)||0;
  if(sw){ left=Math.min(left, sw-w-8); left=Math.max(left, 8); }
  el.style.left=Math.round(left)+'px';
  /* One line is centred on the letters it replaces. Several lines are hung from
     the FIRST line, so line one lands on line one and the block grows downwards
     exactly as the drawn text does. */
  el.style.top=Math.round((rows>1)
      ? o.textMidY-lhBox/2-EDIT_PAD_Y-EDIT_BORDER
      : o.textMidY-h/2)+'px';
  return {w:w, h:hh, font:f};
}
function startTextEdit(ob,t){
  if(typeof closeEditor==='function') closeEditor(false);   // close any zone editor
  if(textEditEl) return;
  const dx=ob.dx||0, dy=ob.dy||0;
  const p=W2S(t.x+dx, t.y+dy); const hpx=mm2px(t.h);
  const el=document.createElement('input');
  el.className='inline-edit'; el.value=String(t.text||'');
  // measure the real text width so the box matches the drawn text
  const FW=t.bold?'700 ':'';
  let tw; try{ ctx.save(); ctx.font=`${FW}${hpx}px ${store.format.font},Arial`; tw=ctx.measureText(String(t.text||'')||'M').width; ctx.restore(); }
  catch(_){ tw=String(t.text||'').length*hpx*0.6; }
  const ALIGN=(t.align===1?'center':t.align===2?'right':'left');
  /* p.y is the baseline; the middle of the letters sits a third of the height
     above it, and that is the point the box is centred on. */
  const box=()=>layoutInlineEdit(el, {fontPx:hpx, bold:!!t.bold, align:ALIGN,
    anchorX:p.x, textMidY:p.y-hpx*0.35,
    textW:inlineTextWidth(el.value, Math.max(EDIT_MIN_FONT,hpx), !!t.bold)});
  box();
  if(isUserText(t)) el.style.textTransform='uppercase';
  const rot=((t.rot||0)+(t.scaleRot||0));
  if(rot){ el.style.transformOrigin=(t.align===1?'center':'left')+' center'; el.style.transform='rotate('+(-rot)+'deg)'; }
  stage.appendChild(el); textEditEl=el;
  let done=false;

let selIds=new Set();

let _inGroup=null;

let marquee=null;
let snapGuides=[];
const SNAP_PX=6;
function computeSnap(bb0, ddx, ddy, lock){
  const out={ddx, ddy, guides:[]};
  if(!bb0) return out;
  const tol=SNAP_PX/Math.max(view.s,1e-6);                 // screen px -> world mm
  const mv={minx:bb0.minx+ddx, miny:bb0.miny+ddy, maxx:bb0.maxx+ddx, maxy:bb0.maxy+ddy};
  const mcx=(mv.minx+mv.maxx)/2, mcy=(mv.miny+mv.maxy)/2;
  // static targets = every object NOT in the selection, plus the page/drawing-area centre
  const {W,H}=paperDims(); const m=store.format.margin;
  const targets=[];
  (activePage().objects||[]).forEach(o=>{ if(selIds.has(o.id))return; const bb=objBBox(o); if(bb) targets.push(bb); });
  const pageCx=W/2, pageCy=m+TB_H+(H-2*m-TB_H)/2;
  // ----- X snapping (vertical guides) -----
  const mXs = lock ? [['c',mcx]] : [['min',mv.minx],['c',mcx],['max',mv.maxx]];
  let bestX=null;
  const considerX=(sx, tb)=>{ mXs.forEach(([k,mx])=>{ const d=sx-mx; if(Math.abs(d)<=tol && (!bestX||Math.abs(d)<Math.abs(bestX.d))) bestX={d, x:sx, tb}; }); };
  targets.forEach(tb=>{ [tb.minx,(tb.minx+tb.maxx)/2,tb.maxx].forEach(sx=>considerX(sx,tb)); });
  considerX(pageCx,{miny:m,maxy:H-m,page:true});
  if(bestX){ out.ddx+=bestX.d; }

  const mv2={miny:bb0.miny+out.ddy, maxy:bb0.maxy+out.ddy}; const mcy2=(mv2.miny+mv2.maxy)/2;
  const mYs = lock ? [['c',mcy2]] : [['min',mv2.miny],['c',mcy2],['max',mv2.maxy]];
  let bestY=null;
  const considerY=(sy, tb)=>{ mYs.forEach(([k,my])=>{ const d=sy-my; if(Math.abs(d)<=tol && (!bestY||Math.abs(d)<Math.abs(bestY.d))) bestY={d, y:sy, tb}; }); };
  targets.forEach(tb=>{ [tb.miny,(tb.miny+tb.maxy)/2,tb.maxy].forEach(sy=>considerY(sy,tb)); });
  considerY(pageCy,{minx:m,maxx:W-m,page:true});
  if(bestY){ out.ddy+=bestY.d; }

  const fmv={minx:bb0.minx+out.ddx, miny:bb0.miny+out.ddy, maxx:bb0.maxx+out.ddx, maxy:bb0.maxy+out.ddy};
  if(bestX){ const tb=bestX.tb; const y0=Math.min(fmv.miny, tb.miny!=null?tb.miny:fmv.miny), y1=Math.max(fmv.maxy, tb.maxy!=null?tb.maxy:fmv.maxy);

  if(bestY){ const tb=bestY.tb; const x0=Math.min(fmv.minx, tb.minx!=null?tb.minx:fmv.minx), x1=Math.max(fmv.maxx, tb.maxx!=null?tb.maxx:fmv.maxx);
    out.guides.push({x0, y0:bestY.y, x1, y1:bestY.y}); }
  return out;
}
function drawSnapGuides(){
  if(!snapGuides.length) return;
  ctx.save(); ctx.strokeStyle='#e0348b'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  snapGuides.forEach(g=>{ const a=W2S(g.x0,g.y0), b=W2S(g.x1,g.y1);
    if(g.lock){ ctx.save(); ctx.strokeStyle='#0077ff'; ctx.setLineDash([9,4,2,4]); }
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();

}
let objDrag=null;

function selectableObjs(){ const pg=activePage(); return (pg&&pg.type==='sheet'&&pg.objects)?pg.objects:[]; }
function objById(id){ return selectableObjs().find(o=>o.id===id); }
function expandGroup(ids){

    if(o.group && o.group!==_inGroup) groups.add(o.group);
    else { const tag=o._dim||o._sec||o._bal; if(tag) parts.add(tag); } });
  const out=new Set(ids);

    if(o.group && groups.has(o.group)){ out.add(o.id); return; }

    if(_inGroup && o.group===_inGroup){

}
function bomSelBBox(){
  const pg=activePage(); if(!pg||!pg.bom||!selIds.has('bom')) return null;
  const bb=bomBounds(pg); if(!bb) return null;
  return {minx:bb.x, miny:bb.y-bb.h, maxx:bb.x+bb.w, maxy:bb.y};
}
function selectionBBox(){
  let a=1e9,b=1e9,c=-1e9,d=-1e9,any=false;
  selIds.forEach(id=>{ const o=objById(id); if(!o)return; const bb=objBBox(o); if(bb){any=true;
    if(bb.minx<a)a=bb.minx; if(bb.miny<b)b=bb.miny; if(bb.maxx>c)c=bb.maxx; if(bb.maxy>d)d=bb.maxy; } });
  return any?{minx:a,miny:b,maxx:c,maxy:d}:null;

function objHit(ob,wx,wy,tolW){
  const P=ob.prims, dx=ob.dx||0, dy=ob.dy||0; const x=wx-dx, y=wy-dy;
  const near=(ax,ay,bx,by)=>{ const dxl=bx-ax,dyl=by-ay,L2=dxl*dxl+dyl*dyl; let t=L2?((x-ax)*dxl+(y-ay)*dyl)/L2:0; t=Math.max(0,Math.min(1,t));
    const px=ax+t*dxl, py=ay+t*dyl; return Math.hypot(x-px,y-py)<=tolW; };

  for(const c of (P.clines||[])){ if(Math.abs((x-c.x)*(-c.dy)+(y-c.y)*(c.dx))/(Math.hypot(c.dx,c.dy)||1) <= tolW) return true; }

function objAtPoint(wx,wy){

    if(objs[i]._dim) return objs[i];        // a dimension part is what you aimed at

}
function objsInRect(x0,y0,x1,y1){
  const a=Math.min(x0,x1),b=Math.min(y0,y1),c=Math.max(x0,x1),d=Math.max(y0,y1);
  return selectableObjs().filter(o=>{ const bb=objBBox(o); return bb && bb.minx>=a && bb.maxx<=c && bb.miny>=b && bb.maxy<=d; });

function setSelection(ids){ selIds=expandGroup(new Set(ids)); updateSelToolbar(); render(); }
function clearSelection(){ selIds=new Set(); marquee=null; _inGroup=null; updateSelToolbar(); render(); }

/* ============================================================================
   §6.3 STRETCHABLE PROJECTION LINES
   A dimension's extension lines run from the measured feature out past the
   dimension line. Only that overhang is cosmetic, so the handle drags the OUTER
   end along the extension line's own direction: the anchor that touches the part
   never moves and the measured value never changes.
   ========================================================================== */
const DIM_HANDLE_PX=5;
function dimPartsOf(pg, dimId){
  const lines=[], texts=[];
  (pg.objects||[]).forEach(o=>{
    (o.prims.polys||[]).forEach(p=>{ if(p._dim===dimId && p.pts.length>=2) lines.push({o,p}); });
    (o.prims.texts||[]).forEach(t=>{ if(t._dim===dimId) texts.push({o,t}); });
  });
  return {lines, texts};
}
function selectedDimId(){                       // the single dimension currently selected
  let id=null;
  for(const sid of selIds){ const o=objById(sid); if(!o) continue;
    const d=o._dim || (o.prims.polys[0]&&o.prims.polys[0]._dim) || (o.prims.texts[0]&&o.prims.texts[0]._dim);
    if(!d) return null;
    if(id===null) id=d; else if(id!==d) return null; }
  return id;
}
/* Work out which segment is the dimension line and which are extension lines. */
function dimAnalyse(pg, dimId){
  const {lines, texts}=dimPartsOf(pg, dimId);
  if(!lines.length) return null;
  const abs=(o,pt)=>[pt[0]+(o.dx||0), pt[1]+(o.dy||0)];
  const segs=lines.map(({o,p})=>{
    const a=abs(o,p.pts[0]), b=abs(o,p.pts[p.pts.length-1]);
    const dx=b[0]-a[0], dy=b[1]-a[1];
    return {o,p,a,b,len:Math.hypot(dx,dy), vert:Math.abs(dy)>Math.abs(dx)};
  }).filter(s=>s.len>1e-6);
  if(!segs.length) return null;
  const t=texts[0]&&texts[0].t;
  const rot=t? ((t.rot||0)%180+180)%180 : 0;
  const wantVert=Math.abs(rot-90)<30;
  let dim=null;                                  // dimension line: longest along the text axis
  segs.forEach(s=>{ if(s.vert!==wantVert) return; if(!dim||s.len>dim.len) dim=s; });
  if(!dim) return null;
  // Every stub lying on that same axis is part of the SAME dimension line. Dragging
  // has to carry all of them; moving only one left the rest behind.
  const dl=dim.len||1, ux=(dim.b[0]-dim.a[0])/dl, uy=(dim.b[1]-dim.a[1])/dl;
  const dimAll=segs.filter(s=>{
    if(s===dim) return true;
    const L=s.len||1, vx=(s.b[0]-s.a[0])/L, vy=(s.b[1]-s.a[1])/L;
    if(Math.abs(vx*ux+vy*uy)<0.98) return false;
    const px=s.a[0]-dim.a[0], py=s.a[1]-dim.a[1];
    return Math.abs(-px*uy+py*ux)<0.35;
  });
  const ext=segs.filter(s=>!dimAll.includes(s) && s.vert!==dim.vert);
  return {dim, dimAll, ext, texts};
}
/* Handles = the outer end of each extension line (the end nearest the dimension
   line, i.e. the overhang side). */
function dimHandles(pg){
  const id=selectedDimId(); if(!id) return [];
  const an=dimAnalyse(pg, id); if(!an) return [];
  const dmid=[(an.dim.a[0]+an.dim.b[0])/2, (an.dim.a[1]+an.dim.b[1])/2];
  // unit vector along the dimension line
  const ddx=an.dim.b[0]-an.dim.a[0], ddy=an.dim.b[1]-an.dim.a[1];
  const dl=Math.hypot(ddx,ddy)||1; const ux=ddx/dl, uy=ddy/dl;
  const out=[];
  // endpoints of the dimension line itself: dragging these changes its length and the
  // arrowheads follow, because they are drawn from these very points.
  // One grip per side of the dimension: dragging it stretches EVERY part of the
  // dimension together (both extension lines and the dimension line), instead of
  // making the user adjust each line on its own.
  const dm=[(an.dim.a[0]+an.dim.b[0])/2, (an.dim.a[1]+an.dim.b[1])/2];
  const nrm=[-uy, ux];
  out.push({dimId:id, kind:'group', an, n:nrm, at:dm});
  return out;
}
function drawDimHandles(){
  const pg=activePage(); if(!pg||pg.type!=='sheet') return;
  if(drawBalGrips(pg)) return;
  if(drawSecGrips(pg)) return;
  if(drawDimModelGrips(pg)) return;
  const hs=dimHandles(pg); if(!hs.length) return;
  ctx.save(); ctx.setLineDash([]);
  hs.forEach(h=>{ const p=h.at||h.outer; const q=W2S(p[0], p[1]);
    ctx.fillStyle='#fff'; ctx.strokeStyle='#0077ff'; ctx.lineWidth=1.5;
    ctx.fillRect(q.x-DIM_HANDLE_PX, q.y-DIM_HANDLE_PX, DIM_HANDLE_PX*2, DIM_HANDLE_PX*2);
    ctx.strokeRect(q.x-DIM_HANDLE_PX, q.y-DIM_HANDLE_PX, DIM_HANDLE_PX*2, DIM_HANDLE_PX*2); });
  ctx.restore();
}
function dimHandleAt(wx,wy){
  const pg=activePage(); if(!pg||pg.type!=='sheet') return null;
  const tol=(DIM_HANDLE_PX+3)/Math.max(view.s,1e-6);
  const hs=dimHandles(pg);
  for(const h of hs){ const p=h.at||h.outer; if(Math.hypot(p[0]-wx, p[1]-wy)<=tol) return h; }
  return null;
}
let dimDrag=null;
function beginDimDrag(h){
  snapshot();
  const dx=h.outer[0]-h.anchor[0], dy=h.outer[1]-h.anchor[1];
  const L=Math.hypot(dx,dy)||1;
  dimDrag={ h, ux:dx/L, uy:dy/L, anchor:h.anchor.slice(), moved:false };
}
function updateDimDrag(wx,wy){
  if(!dimDrag) return;
  const {h,ux,uy,anchor}=dimDrag;
  // project the cursor onto the extension line so it can only get longer/shorter
  let t=(wx-anchor[0])*ux + (wy-anchor[1])*uy;
  t=Math.max(0.5, t);                                     // never collapse past the anchor
  const nx=anchor[0]+ux*t, ny=anchor[1]+uy*t;
  const o=h.seg.o;
  h.seg.p.pts[h.outerIdx]=[nx-(o.dx||0), ny-(o.dy||0)];
  dimDrag.moved=true;
  render();
}
function endDimDrag(){
  if(!dimDrag) return;
  if(dimDrag.moved) afterMutate(); else { history.undo.pop(); updateUndoButtons(); }
  dimDrag=null;
}

/* ---- dragging the DIMENSION LINE itself ------------------------------------
   Moving a dimension away from the part must take its arrowheads with it and let
   the extension lines grow to keep reaching it — arrowheads are the ends of the
   dimension line, not separate objects the user has to chase. */
function dimSolidsOf(pg, dimId, an){
  // Arrowheads are plain filled triangles; rather than rely on a tag surviving
  // persistence, claim the ones sitting at this dimension line's own end points.
  const out=[];
  if(!an) an=dimAnalyse(pg,dimId);
  if(!an) return out;
  // Collect the ends of EVERY stub of this dimension line, not just the main one:
  // a tight dimension is split into pieces and its arrowheads sit on the pieces, so
  // looking only at the main stub left some arrows behind when the line was dragged.
  const ends=[];
  (an.dimAll||[an.dim]).forEach(s=>{ ends.push(s.a, s.b); });
  const tol=4;
  (pg.objects||[]).forEach(o=>(o.prims.solids||[]).forEach(sd=>{
    if(!sd||sd.length<3) return;
    let cx=0,cy=0; sd.forEach(p=>{cx+=p[0]+(o.dx||0); cy+=p[1]+(o.dy||0);});
    cx/=sd.length; cy/=sd.length;
    if(ends.some(E=>Math.hypot(cx-E[0], cy-E[1])<=tol)) out.push({o,sd});
  }));
  return out;
}
function dimLineAt(wx,wy){
  const pg=activePage(); if(!pg||pg.type!=='sheet') return null;
  const id=selectedDimId(); if(!id) return null;
  const an=dimAnalyse(pg,id); if(!an) return null;
  const {a,b}=an.dim;
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L;
  const vx=wx-a[0], vy=wy-a[1];
  const t=vx*ux+vy*uy;
  if(t<0||t>L) return null;                                // outside the segment
  const perp=Math.abs(-vx*uy+vy*ux);
  const tol=6/Math.max(view.s,1e-6);
  if(perp>tol) return null;
  return {dimId:id, an, n:[-uy,ux]};                       // n = perpendicular (offset direction)
}
function beginDimLineDrag(hit, wx, wy){
  const pg=activePage();
  snapshot();
  const an=hit.an;
  dimDrag={ mode:'line', dimId:hit.dimId, n:hit.n, start:[wx,wy], moved:false,
    dim:{seg:an.dim, pts:an.dim.p.pts.map(p=>p.slice())},
    dimAll:(an.dimAll||[an.dim]).map(s=>({seg:s, pts:s.p.pts.map(p=>p.slice())})),
    ext:an.ext.map(s=>({seg:s, pts:s.p.pts.map(p=>p.slice())})),
    solids:dimSolidsOf(pg,hit.dimId,an).map(x=>({...x, pts:x.sd.map(p=>p.slice())})),
    texts:dimPartsOf(pg,hit.dimId).texts.map(x=>({...x, x0:x.t.x, y0:x.t.y})) };

function updateDimLineDrag(wx,wy){
  if(!dimDrag||dimDrag.mode!=='line') return;
  const D=dimDrag;
  const d=(wx-D.start[0])*D.n[0] + (wy-D.start[1])*D.n[1];   // perpendicular travel only
  const mx=D.n[0]*d, my=D.n[1]*d;
  // dimension line slides across
  (D.dimAll||[D.dim]).forEach(S=>{ S.seg.p.pts.forEach((pt,i)=>{ pt[0]=S.pts[i][0]+mx; pt[1]=S.pts[i][1]+my; }); });
  // arrowheads are carried along - they ARE the ends of the dimension line
  D.solids.forEach(s=>{ s.sd.forEach((pt,i)=>{ pt[0]=s.pts[i][0]+mx; pt[1]=s.pts[i][1]+my; }); });
  // extension lines grow/shrink so they still meet the dimension line
  const dimN = (D.dim.pts[0][0]+(D.dim.seg.o.dx||0))*D.n[0] + (D.dim.pts[0][1]+(D.dim.seg.o.dy||0))*D.n[1];
  D.ext.forEach(E=>{
    const o=E.seg.o;
    const nOf=(i)=>(E.pts[i][0]+(o.dx||0))*D.n[0] + (E.pts[i][1]+(o.dy||0))*D.n[1];
    const last=E.seg.p.pts.length-1;
    // the end that must follow is the one already sitting at the dimension line
    const outerIdx = Math.abs(nOf(0)-dimN) <= Math.abs(nOf(last)-dimN) ? 0 : last;
    E.seg.p.pts.forEach((pt,i)=>{ pt[0]=E.pts[i][0]; pt[1]=E.pts[i][1]; });   // reset
    E.seg.p.pts[outerIdx][0]=E.pts[outerIdx][0]+mx;
    E.seg.p.pts[outerIdx][1]=E.pts[outerIdx][1]+my;
  });
  // the value rides along with its dimension line

/* ============================================================================
   §7.2  GRIPS THAT EDIT THE MODEL  —  Dimension-Design.md §3
   ----------------------------------------------------------------------------
   AutoCAD gives a dimension several grips, each with its own job. We do the same,
   but every grip now writes ONE number into the model and lets dimApply() redraw
   the whole dimension. Nothing is bent by hand, so:
     - the extension lines cannot fail to reach the dimension line
     - the arrowheads cannot drift off the ends (they ARE the ends)
     - the value cannot change, because it is derived from `measure`
     - dragging out and back returns exactly where it started
   ========================================================================== */
const DIM_GRIP_PX=5;
/* An object dragged bodily carries a dx/dy the model knows nothing about. Fold it
   into the model before editing, so both agree on where the dimension is. */
function dimBake(pg, m){
  let dx=null, dy=null, same=true;
  (pg.objects||[]).forEach(o=>{
    if(o._dim!==m.id) return;
    if(dx===null){ dx=o.dx||0; dy=o.dy||0; }
    else if((o.dx||0)!==dx || (o.dy||0)!==dy) same=false;
  });
  if(dx===null || (!dx && !dy)) return;
  if(same){ dimTranslate(m, dx, dy);
    (pg.objects||[]).forEach(o=>{ if(o._dim===m.id){ o.dx=0; o.dy=0; } }); }
}
/* Where the grips are: one on the dimension line, one on the value, one at the
   outer end of each extension line. */
function dimModelGrips(pg){
  const id=selectedDimId(); if(!id) return [];
  const m=dimModelById(pg,id); if(!m) return [];
  dimBake(pg,m);
  const g=dimGeomOf(m), out=[];
  if(m.kind==='angular'){
    /* Two things to grab, the same two every dimension has: the ARC, which sets
       how far out the dimension stands, and the VALUE, which can be slid round
       the arc and pushed in or out. */
    const C=m.centre, am=m.a0+m.sweep/2;
    out.push({m, kind:'angarc',
              at:[C[0]+m.radius*Math.cos(am), C[1]+m.radius*Math.sin(am)]});
    out.push({m, kind:'angtext', at:[g.text.x, g.text.y]});
    return out;
  }
  if(g.radial){
    /* A radius has one place to grab: the landing carrying the value. The leader
       stays on the arc's radius whatever you do, because that is what makes it a

  afterMutate(); toast('grouped'); }
function ungroupSelection(){ let any=false; snapshot();
  selIds.forEach(id=>{ const o=objById(id); if(o&&o.group){ o.group=null; o.ug=false;
    primsOf(o).forEach(x=>{ if(x._grp!=null) delete x._grp; }); any=true; } });
  if(any){ afterMutate(); toast('ungrouped'); } else history.undo.pop(); }
function deleteSelection(){ if(!selIds.size) return; snapshot(); const pg=activePage();
  let n=0;
  if(selIds.has('bom') && pg.bom){ pg.bom=null; n++;
    const rp=$('#rpanel'); if(rp) rp.classList.remove('open'); }
  const before=pg.objects.length;
  const removedObjects=pg.objects.filter(o=>selIds.has(o.id));
  pg.objects=pg.objects.filter(o=>!selIds.has(o.id));
  n+=before-pg.objects.length;
  // a dimension, a marker or a balloon whose drawing is gone must not leave its
  // model behind, or STYLIZE would faithfully redraw something nobody can see
  const live=new Set();
  pg.objects.forEach(o=>{ if(o._dim) live.add(o._dim); if(o._sec) live.add(o._sec); if(o._bal) live.add(o._bal); });
  if(pg.dxf){
    pg.dxf.dims=(pg.dxf.dims||[]).filter(m=>live.has(m.id));
    pg.dxf.secs=(pg.dxf.secs||[]).filter(m=>live.has(m.id));
    pg.dxf.balloons=(pg.dxf.balloons||[]).filter(m=>live.has(m.id));
    /* And the strokes of the pieces that were deleted - taken from those pieces
       themselves, collected before they were dropped.
       Keeping "everything still referenced" and throwing away the rest looked
       equivalent and was not: a stroke the object list does not happen to carry -
       one hidden under a cutting plane, one belonging to a page the rebuild groups
       differently - is not deleted, it is merely unreferenced, and that filter
       wiped the drawing. Only what was actually selected goes. */
    const doomed=new Set();
    removedObjects.forEach(o=>{
      (o.prims.polys||[]).forEach(p=>doomed.add(p));
      (o.prims.texts||[]).forEach(t=>doomed.add(t));
      (o.prims.solids||[]).forEach(x=>doomed.add(x));
      (o.prims.hatches||[]).forEach(h=>doomed.add(h));
      (o.prims.clines||[]).forEach(c=>doomed.add(c));
    });
    if(doomed.size){
      pg.dxf.polys=(pg.dxf.polys||[]).filter(p=>!doomed.has(p));
      pg.dxf.texts=(pg.dxf.texts||[]).filter(t=>!doomed.has(t));
      pg.dxf.solids=(pg.dxf.solids||[]).filter(x=>!doomed.has(x));
      pg.dxf.hatches=(pg.dxf.hatches||[]).filter(h=>!doomed.has(h));
      pg.dxf.clines=(pg.dxf.clines||[]).filter(c=>!doomed.has(c));
    }
  }
  selIds=new Set(); afterMutate(); toast('deleted '+n+' item(s)'); }

function alignSelection(mode){
  if(selIds.size<1) return;
  if(mode==='frame'){                                     // center the whole selection block in the page
    const sb=selectionBBox(); if(!sb) return; snapshot();
    const {W,H}=paperDims(); const m=store.format.margin;
    const fcx=W/2, fcy=m+TB_H+(H-2*m-TB_H)/2;             // drawing area centre (above title block)
    const dx=fcx-(sb.minx+sb.maxx)/2, dy=fcy-(sb.miny+sb.maxy)/2;
    selIds.forEach(id=>{ const o=objById(id); if(o){ o.dx+=dx; o.dy+=dy; } });
    afterMutate(); return;
  }
  // group selected objects into UNITS: a group = one unit, an ungrouped object = its own unit
  const units=new Map();
  selIds.forEach(id=>{ const o=objById(id); if(!o) return; const key=o.group||('single:'+id);
    if(!units.has(key)) units.set(key,[]); units.get(key).push(o); });
  const unitList=[...units.values()].map(objs=>{
    let a=1e9,b=1e9,c=-1e9,d=-1e9;
    objs.forEach(o=>{ const bb=objBBox(o); if(bb){ if(bb.minx<a)a=bb.minx; if(bb.miny<b)b=bb.miny; if(bb.maxx>c)c=bb.maxx; if(bb.maxy>d)d=bb.maxy; } });
    return {objs, bb:{minx:a,miny:b,maxx:c,maxy:d}};
  }).filter(u=>u.bb.minx<1e9);
  if(!unitList.length) return;
  snapshot();
  let ref;
  if(unitList.length>=2){                                  // align units to each other (overall bbox)
    let a=1e9,b=1e9,c=-1e9,d=-1e9;
    unitList.forEach(u=>{ a=Math.min(a,u.bb.minx); b=Math.min(b,u.bb.miny); c=Math.max(c,u.bb.maxx); d=Math.max(d,u.bb.maxy); });
    ref={minx:a,miny:b,maxx:c,maxy:d};
  } else {                                                 // single unit -> align to the page (inside margins)
    const {W,H}=paperDims(); const m=store.format.margin;
    ref={minx:m, miny:m, maxx:W-m, maxy:H-m};
  }
  unitList.forEach(u=>{ const bb=u.bb; let ddx=0,ddy=0;
    if(mode==='left')    ddx=ref.minx-bb.minx;
    if(mode==='right')   ddx=ref.maxx-bb.maxx;
    if(mode==='hcenter') ddx=(ref.minx+ref.maxx)/2-(bb.minx+bb.maxx)/2;
    if(mode==='top')     ddy=ref.maxy-bb.maxy;
    if(mode==='bottom')  ddy=ref.miny-bb.miny;
    if(mode==='vcenter') ddy=(ref.miny+ref.maxy)/2-(bb.miny+bb.maxy)/2;
    u.objs.forEach(o=>{ o.dx+=ddx; o.dy+=ddy; });          // move the whole unit together
  });
  afterMutate();
}

/* ---- line types (ISO/ANSI drawing conventions) --------------------------------
   Each style carries both a dash pattern and a relative weight, so switching a line
   from an object line to a centre line looks right without touching the geometry. */
const LINE_TYPES={
  object : {label:'Object line',  icon:'bi-slash-lg',      dash:null,            w:1.0,  _section:false},
  hidden : {label:'Hidden line',  icon:'bi-three-dots',    dash:[3,2],           w:0.7,  _section:false},
  center : {label:'Center line',  icon:'bi-dash-lg',       dash:[9,2,2,2],       w:0.55, _section:false},
  phantom: {label:'Phantom line', icon:'bi-dash',          dash:[9,2,2,2,2,2],   w:0.7,  _section:false},
};
function lineTypeOf(p){
  if(p._ltype) return p._ltype;
  if(p._section) return 'section';
  const d=p.dash;
  if(!d) return 'object';
  const k=d.join(',');
  if(k==='3,2') return 'hidden';
  if(k==='9,2,2,2') return 'center';
  if(k==='9,2,2,2,2,2') return 'phantom';
  return 'object';
}
function selectionLineType(){                     // shared type across the selection, else null
  let t=null;
  for(const id of selIds){ const o=objById(id); if(!o) continue;
    for(const p of (o.prims.polys||[])){ const k=lineTypeOf(p);
      if(t===null) t=k; else if(t!==k) return null; } }
  return t;
}
function applyLineType(kind){
  const def=LINE_TYPES[kind]; if(!def) return;
  if(!selIds.size){ toast('select something first'); return; }
  snapshot();
  let n=0;
  selIds.forEach(id=>{ const o=objById(id); if(!o) return;
    (o.prims.polys||[]).forEach(p=>{
      p._ltype=kind; p.dash=def.dash? def.dash.slice() : null;
      p._lw=def.w; p._section=def._section; n++; });
  });
  afterMutate();
  toast('now '+def.label+' ('+n+' strokes)');
}
function ctxAnyGrouped(){ for(const id of selIds){ const o=objById(id); if(o&&o.group) return true; } return false; }
function showCtxMenu(px,py){
  let m=$('#ctxmenu');
  if(!m){ m=el('div'); m.id='ctxmenu'; document.body.appendChild(m);
    m.addEventListener('mousedown',e=>e.stopPropagation());
    m.addEventListener('contextmenu',e=>e.preventDefault());
  }
  const canGroup=selIds.size>=2, canUngroup=ctxAnyGrouped(), has=selIds.size>0;
  const cur=selectionLineType();
  let lt='';
  if(has){
    lt='<div class="ctitle">Line style</div>';
    Object.entries(LINE_TYPES).forEach(([k,d])=>{
      /* Draw the line itself rather than name it: a chain line and a phantom line
         are told apart by their pattern, and no icon carries that. */
      const W=54, Y=9, arr=(d.dash||[]).map(v=>v*1.6);
      const svg='<svg width="'+W+'" height="18" viewBox="0 0 '+W+' 18" style="vertical-align:middle;flex:0 0 auto">'
        + '<line x1="1" y1="'+Y+'" x2="'+(W-1)+'" y2="'+Y+'" stroke="currentColor" '
        + 'stroke-width="'+Math.max(1, d.w*1.4).toFixed(1)+'"'
        + (arr.length? ' stroke-dasharray="'+arr.join(' ')+'"':'') + ' stroke-linecap="butt"/></svg>';
      lt+='<div class="ci" data-lt="'+k+'" style="display:flex;align-items:center;gap:10px">'
        + svg + '<span style="flex:1">' + d.label + '</span>'
        + (cur===k?'<span class="k"><i class="bi bi-check-lg"></i></span>':'') + '</div>';
    });
    lt+='<div class="cisep"></div>';
  }
  m.innerHTML= lt
    +'<div class="ci'+(canGroup?'':' dis')+'" data-c="group"><i class="bi bi-collection"></i> Group <span class="k">Ctrl+G</span></div>'
    +'<div class="ci'+(canUngroup?'':' dis')+'" data-c="ungroup"><i class="bi bi-diagram-2"></i> Ungroup <span class="k">Ctrl+Shift+G</span></div>'
    +'<div class="cisep"></div>'
    +'<div class="ci'+(has?'':' dis')+'" data-c="delete"><i class="bi bi-trash"></i> Delete <span class="k">Del</span></div>';
  m.querySelectorAll('.ci').forEach(it=>it.onclick=()=>{ if(it.classList.contains('dis'))return;
    if(it.dataset.lt){ applyLineType(it.dataset.lt); hideCtxMenu(); return; }
    const c=it.dataset.c; if(c==='group')groupSelection(); else if(c==='ungroup')ungroupSelection(); else if(c==='delete')deleteSelection();
    hideCtxMenu(); });
  m.style.display='block';
  // position within viewport
  m.style.left='0px'; m.style.top='0px';
  const mw=m.offsetWidth||210, mh=m.offsetHeight||220;
  const x=Math.min(px, window.innerWidth-mw-8), y=Math.min(py, window.innerHeight-mh-8);
  m.style.left=x+'px'; m.style.top=y+'px';
}



/* ============================================================
   INLINE TEXT EDITING — double-click any field (PRD §11)
   ============================================================ */
let editor=null;
function zoneAt(wx,wy){
  const page=activePage(); const z=page._zones||[];
  for(let i=z.length-1;i>=0;i--){ const b=z[i];
    if(wx>=b.x&&wx<=b.x+b.w&&wy>=b.y&&wy<=b.y+b.h) return b; }
  return null;
}
function commitZone(key,val){
  snapshot();
  const pg=activePage();
  if(key==='project' && pg.type==='description'){
    /* Description page keeps its OWN project name once edited here:
       it syncs FROM the global name until the user overrides it, and an
       edit here never propagates back to the navbar / cover / title block.
       Clearing the field returns the page to auto-sync.                    */
    if(val.trim()===''){ pg.desc.override=false; pg.desc.project=''; }
    else { pg.desc.override=true; pg.desc.project=val; }
  }
  else if(key==='project') store.name=val;
  else if(key==='docType') store.format.docType=val;
  else if(key==='company') store.format.company=val;
  else if(key==='body'||key==='descBody'){ const pg=activePage(); if(pg.desc) pg.desc.body=val; }
  else if(/^lg\d$/.test(key)){ const pg=activePage(); if(pg.desc&&pg.desc.legend) pg.desc.legend[+key.slice(2)]=val; }
  afterMutate();
}
function closeEditor(save){
  if(!editor) return;
  const {el,zone}=editor; const val=el.value;
  editor=null; el.remove();
  if(save && val!==zone.val) commitZone(zone.key,val); else render();
}
function startEdit(zone){
  closeEditor(false);
  const el=document.createElement(zone.multiline?'textarea':'input');
  el.className='inline-edit'; el.value=zone.val||'';
  const ALIGN=zone.align==='c'?'center':zone.align==='r'?'right':'left';
  const fontPx=mm2px(zone.em);
  /* The anchor is the edge the text is drawn from, and the middle of the box is
     the middle of the letters - zone.y is their foot, zone.h their height. */
  const anchorX=(ALIGN==='center') ? W2S(zone.x+zone.w/2, 0).x
              : (ALIGN==='right')  ? W2S(zone.x+zone.w, 0).x
                                   : W2S(zone.x, 0).x;
  const midY=W2S(0, zone.y+zone.h/2).y;
  /* A wrapping field keeps the width it wraps at, so what is typed breaks where
     it will break on the paper. Everything else is as wide as its own text. */
  /* When the drawn text is smaller than the smallest comfortable typing size the
     box is a SCALED copy of the block on the paper - width and line height in the
     same proportion as the font - so the words break in the editor exactly where
     they will break when drawn. Widening the box alone would not do it: a bigger
     font in the same width wraps a word earlier. */
  const zoomUp=Math.max(1, EDIT_MIN_FONT/Math.max(fontPx,0.01));
  const wrapW=zone.multiline? mm2px(zone.w)*zoomUp : null;
  const lineH=zone.multiline? mm2px(zone.lh)*zoomUp : null;
  /* the top line of the block is the one to hang the box from */
  const topMidY=zone.multiline? W2S(0, zone.y+zone.h-zone.em*0.716/2).y : midY;
  const box=()=>{
    const rows=zone.multiline
      ? Math.max(1, wrapTextMM(el.value, zone.em, !!zone.bold, zone.w).length) : 1;
    layoutInlineEdit(el, {fontPx:fontPx, bold:!!zone.bold, align:ALIGN,
      anchorX:anchorX, textMidY:topMidY, fixedW:wrapW, rows:rows, lineH:lineH,
      textW:inlineTextWidth(el.value, Math.max(EDIT_MIN_FONT,fontPx), !!zone.bold)});
  };
  box();
  el.addEventListener('input',()=>{ try{ box(); }catch(_){} });
  stage.appendChild(el);
  editor={el,zone};
  el.focus(); el.select();
  el.addEventListener('keydown',e=>{ e.stopPropagation();
    if(e.key==='Enter'&&!(zone.multiline&&!e.ctrlKey&&!e.metaKey)){ e.preventDefault(); closeEditor(true); }
    else if(e.key==='Escape'){ e.preventDefault(); closeEditor(false); } });
  el.addEventListener('blur',()=>closeEditor(true));
}

/* ---------- rounded rect ---------- */
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

        <input class="inp2" data-ap="${k}" data-fld="d"${perDwg} placeholder="DD" value="${t.d}">
        <input class="inp2" data-ap="${k}" data-fld="m"${perDwg} placeholder="MM" value="${t.m}">
        <input class="inp2" data-ap="${k}" data-fld="y"${perDwg} placeholder="YYYY" value="${t.y}">
      </div>`;}).join('')}
      <div class="tbprevbox"><div class="cap">Preview</div><canvas id="tbPrev"></canvas></div>
    </div>

    <div class="fmt-actions">
      <button class="btn-cancel" id="fCancel">Cancel</button>
      <button class="btn-dark" id="fSave"><i class="bi bi-save"></i> Save</button>
    </div>
  </div>`;
  bindFormat(); updateFormatPreviews();
}

function bindFormat(){
  const f=fmtDraft;
  const on=(id,ev,fn)=>{ const e=$('#'+id); if(e) e.addEventListener(ev,fn); };
  on('fPaper','change',e=>{ f.paper=e.target.value; f.margin=frameMargin(f.paper);
    const mi=$('#fMargin'); if(mi) mi.value=f.margin; updateFormatPreviews(); });
  on('fFont','change',e=>{ f.font=e.target.value; updateFormatPreviews(); });
  on('fSize','input',e=>{ f.fontSize=+e.target.value||10; updateFormatPreviews(); });
  on('fDec','change',e=>{ f.decimals=+e.target.value; updateFormatPreviews(); });
  on('fStrokeRange','input',e=>{ f.stroke=+e.target.value; updateFormatPreviews(); });
  on('fAnsiR','click',e=>{ f.ansiRadius=!f.ansiRadius; f.ansiSection=f.ansiRadius;
    e.currentTarget.classList.toggle('on',f.ansiRadius); });
  on('fVersion','input',e=>{ f.version=e.target.value; updateFormatPreviews(); });
  on('fProject','input',e=>{ f.__project=e.target.value; updateFormatPreviews(); });
  on('fTitle','input',e=>{ f.title=e.target.value; updateFormatPreviews(); });
  const sc=()=>{ f.scale=($('#fScale1').value||'1')+':'+($('#fScale2').value||'1'); updateFormatPreviews(); };
  on('fScale1','input',sc); on('fScale2','input',sc);
  document.querySelectorAll('#formatView [data-ap]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const k=inp.dataset.ap, fld=inp.dataset.fld;
      if(!f.approvals[k]) f.approvals[k]={name:'',date:''};
      if(fld==='name') f.approvals[k].name=inp.value;
      else{
        const row=document.querySelectorAll(`#formatView [data-ap="${k}"]`);
        const get=n=>{ const el=[...row].find(x=>x.dataset.fld===n); return el?el.value:''; };
        f.approvals[k].date=joinDate(get('y'),get('m'),get('d'));
      }
      updateFormatPreviews();
    });
  });
  on('fCancel','click',()=>closeFormat(false));
  on('fSave','click',()=>closeFormat(true));
}

function updateFormatPreviews(){
  const f=fmtDraft; if(!f) return;
  drawTypoPreview();
  const sv=$('#fStrokeVal'); if(sv) sv.textContent=(+f.stroke).toFixed(2).replace(/0$/,'')+'mm';
  drawStrokePreview();
  drawTBPreview();
}

/* One scale for every preview, so they show the same millimetre as the same
   number of pixels and can never contradict each other. */
function previewScale(wcss, hcss, spanMM){
  const f=fmtDraft;
  let px=(wcss-24)/spanMM;
  const need=()=>(f.fontSize||10)*PT_TO_MM*px + (4/PX_PER_MM)*px + (f.stroke||0.2)*px + 10;
  if(need()>hcss*0.92) px*=hcss*0.92/need();
  return px;
}
/* The type sample, drawn at its true height on the sheet - not at a pixel size
   that merely looks about right. */
function drawTypoPreview(){
  const cvs=$('#typoPrev'); const f=fmtDraft; if(!cvs||!f) return;
  const wcss=cvs.clientWidth||420, hcss=64, dpr=window.devicePixelRatio||1;
  cvs.width=Math.round(wcss*dpr); cvs.height=Math.round(hcss*dpr);
  const c=cvs.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,wcss,hcss);
  let px=previewScale(wcss,hcss,60);
  const d=f.decimals;
  const sample='\u2300 '+fmtNum(24.5,d)+'  \u00B7  A-A  \u00B7  M8\u00D7'+fmtNum(1.25,d);
  let th=(f.fontSize||10)*PT_TO_MM*px;
  c.font=th+'px '+f.font+',Arial';
  /* previewScale only ever shrank for HEIGHT; at a large text size the sample ran
     off both ends of its box and came out clipped and smeared. Shrink for WIDTH
     too, and leave a margin, rather than clip the one thing being shown. */
  const room=wcss-24, wide=c.measureText(sample).width;
  if(wide>room){ px*=room/wide; th=(f.fontSize||10)*PT_TO_MM*px; c.font=th+'px '+f.font+',Arial'; }
  c.fillStyle='#111'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(sample, wcss/2, hcss/2-4);
  c.font='12px '+f.font+',Arial'; c.fillStyle='#8a8f96';
  c.fillText((f.fontSize*PT_TO_MM).toFixed(2)+' mm', wcss/2, hcss-10);
}

/* A dimension drawn to the settings themselves: the stroke weight you chose, the
   font and text height you chose, and real arrowheads at 3:1 - so the preview is
   the thing, not a picture of the thing. */
function drawStrokePreview(){
  const cvs=$('#strokePrev'); const f=fmtDraft; if(!cvs||!f) return;
  const wcss=cvs.clientWidth||420, hcss=64, dpr=window.devicePixelRatio||1;
  cvs.width=Math.round(wcss*dpr); cvs.height=Math.round(hcss*dpr);
  const c=cvs.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,wcss,hcss);
  const spanMM=60, px=previewScale(wcss,hcss,spanMM);
  const w2=spanMM*px, x0=(wcss-w2)/2, x1=x0+w2;
  const y=Math.round(hcss-14)+0.5;
  const lw=Math.max(1, f.stroke*px), ah=Math.max(4, 2.5*px), aw=ah/3;
  c.strokeStyle='#111'; c.fillStyle='#111'; c.lineWidth=lw; c.lineCap='butt';
  c.beginPath(); c.moveTo(x0,y); c.lineTo(x1,y); c.stroke();
  [[x0,1],[x1,-1]].forEach(([x,d])=>{                // the arrowheads it really has
    c.beginPath(); c.moveTo(x,y);
    c.lineTo(x+d*ah, y-aw/2); c.lineTo(x+d*ah, y+aw/2); c.closePath(); c.fill(); });
  // ...and the extension lines the arrowheads point at, which is what tells you
  // the weight applies to a dimension and not just to a stroke
  const ext=2.5*px;
  [x0,x1].forEach(x=>{ c.beginPath();
    c.moveTo(x+0.5, y-ext); c.lineTo(x+0.5, y+ext*0.55); c.stroke(); });
  const th=Math.max(9, (f.fontSize||10)*PT_TO_MM*px);
  c.font=th+'px '+f.font+',Arial';
  c.textAlign='center'; c.textBaseline='alphabetic';
  // the same clear space the sheet uses: 4 px at paper scale, measured to the ink
  const gap=(4/PX_PER_MM)*px;
  c.fillText(fmtNum(spanMM,f.decimals), (x0+x1)/2, y-gap-lw/2);
}

/* live title-block preview — drawn with the very same renderer as the sheet */
function drawTBPreview(){
  const cvs=$('#tbPrev'); if(!cvs||!fmtDraft) return;
  const wcss=cvs.clientWidth||1299, dpr=window.devicePixelRatio||1;
  const s=(wcss-2)/TB_W, hcss=Math.round(TB_H*s+2);
  cvs.width=Math.round(wcss*dpr); cvs.height=Math.round(hcss*dpr);
  cvs.style.height=hcss+'px';
  const c=cvs.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle='#fff'; c.fillRect(0,0,wcss,hcss);
  const oCtx=ctx, oView=view, oFmt=store.format, oName=store.name;
  ctx=c; store.format=fmtDraft; store.name=(fmtDraft.__project!=null?fmtDraft.__project:store.name)||'PROJECT';
  const r=tbRect();
  view={s:s, tx:1-r.x*s, ty:1+(r.y+TB_H)*s, zoom:1, dpr:1};
  try{ drawTitleBlock({type:'sheet',title:{title:fmtDraft.title||'',partNo:'',version:'',drawingNo:'',scale:'',material:'',finish:'',color:''}}); }
  catch(e){ console.error(e); }
  ctx=oCtx; view=oView; store.format=oFmt; store.name=oName;
}

/* ============================================================================
   §13  BRINGING A SAVED PROJECT UP TO DATE
   ----------------------------------------------------------------------------
   A project is saved with its dimension and section MODELS inside it. Open it in a
   newer build and those models are restored exactly as they were written - by the
   older code, with the older fields and the older strings. Nothing re-reads the
   DXF, because the DXF is long gone.

   The effect is that every improvement appears to have done nothing: the values
   keep the decimals they were saved with, the markers keep the shape they were
   saved in, and pressing STYLIZE changes nothing, because STYLIZE faithfully
   redraws the stale model it was handed.

   So on opening, any model older than the current build is brought up to date.
   What is kept is what a drawing actually asserts - the points that were measured,
   the centre, the radius, the viewing direction. What is rebuilt is everything
   derived from those, which is exactly what the newer rules are about.
   ========================================================================== */
const MODEL_VERSION=3;

function dimMigrateModel(m){
  if(!m || m.v===MODEL_VERSION) return false;
  m.text=m.text||{};
  if(m.kind==='radial'||m.kind==='diameter'){
    m.land=m.land||{};
    if(m.land.len===undefined) m.land.len=null;
    if(m.land.off===undefined) m.land.off=null;
    if(m.land.side===undefined) m.land.side=1;
    if(m.land.y===undefined) m.land.y=(m.point?m.point[1]:0);
    m.run=m.run||{len:null};
    m.line=m.line||{};
    if(m.line.arrow===undefined) m.line.arrow=2.5;
    if(m.line.arrowW===undefined) m.line.arrowW=m.line.arrow/3;
  }else{
    m.ext=m.ext||{gap:[1,1], overshoot:[2.5,2.5], visible:[true,true]};
    m.line=m.line||{};
    if(m.line.stub===undefined) m.line.stub=[0,0];
    if(m.line.inside===undefined) m.line.inside=true;
    if(m.line.arrowW===undefined) m.line.arrowW=(m.line.arrow||2.5)/3;
    if(m.text.side===undefined) m.text.side=1;
    if(m.text.outSide===undefined) m.text.outSide=1;
  }
  if(m.text.gapPx===undefined) m.text.gapPx=DIM_TXT_GAP_PX;
  if(m.text.align===undefined) m.text.align=1;
  /* The number is the point of the whole exercise: split the saved string so the
     wrapper is kept and the number goes back to being measured and formatted. */
  if(m.text.prefix===undefined && m.text.suffix===undefined){
    const saved=(m.text.override!=null? m.text.override : m.text.value);
    try{ dimSplitValue(m, saved); }catch(e){}
  }
  m.v=MODEL_VERSION;
  return true;
}
function secMigrateModel(s){
  if(!s || s.v===MODEL_VERSION) return false;
  s.leg=(s.leg==null? SEC_LEG_MM : s.leg);
  s.label=s.label||{};
  if(s.label.h==null) s.label.h=3.5;
  if(s.label.gapPx==null) s.label.gapPx=SEC_LABEL_GAP_PX;
  s.arrow=s.arrow||{len:3.5, wid:1.2};
  s.v=MODEL_VERSION;
  return true;
}
/* An older save has no memory of which polylines were circles - that was only
   added later - so a radius has nothing to check itself against and cannot be
   rebuilt. The polyline still IS a circle though: every one of its points is the
   same distance from one centre. Fit that centre and the arc comes back. */
function recFitCircle(pts){
  const n=pts&&pts.length; if(!n || n<5) return null;
  let Sx=0,Sy=0,Sxx=0,Syy=0,Sxy=0,Sxz=0,Syz=0,Sz=0;
  for(let i=0;i<n;i++){ const x=pts[i][0], y=pts[i][1], z=x*x+y*y;
    Sx+=x; Sy+=y; Sxx+=x*x; Syy+=y*y; Sxy+=x*y; Sxz+=x*z; Syz+=y*z; Sz+=z; }
  const A=[[Sxx,Sxy,Sx],[Sxy,Syy,Sy],[Sx,Sy,n]], B=[-Sxz,-Syz,-Sz];
  const det=(m)=>m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])
                -m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])
                +m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
  const D=det(A); if(Math.abs(D)<1e-9) return null;
  const rep=(k)=>{ const m=A.map(r=>r.slice()); for(let i=0;i<3;i++) m[i][k]=B[i]; return det(m)/D; };
  const a=rep(0), b=rep(1), c=rep(2);
  const cx=-a/2, cy=-b/2, r2=cx*cx+cy*cy-c;
  if(!(r2>1e-9)) return null;
  const r=Math.sqrt(r2);
  let worst=0;
  for(let i=0;i<n;i++) worst=Math.max(worst, Math.abs(Math.hypot(pts[i][0]-cx, pts[i][1]-cy)-r));
  if(worst>Math.max(0.02, r*0.002)) return null;      /* not a circle at all */
  const ang=(q)=>{ const t=Math.atan2(q[1]-cy,q[0]-cx)*180/Math.PI; return (t%360+360)%360; };
  const closed=Math.hypot(pts[0][0]-pts[n-1][0], pts[0][1]-pts[n-1][1])<Math.max(0.01,r*0.001);
  if(closed) return {cx, cy, r, a0:null, a1:null};
  const ccw=(f,t)=>((t-f)%360+360)%360;
  let a0=ang(pts[0]), a1=ang(pts[n-1]);
  const mid=ang(pts[Math.floor(n/2)]);
  if(ccw(a0,mid) > ccw(a0,a1)){ const t=a0; a0=a1; a1=t; }
  return {cx, cy, r, a0, a1};
}
/* Give an older drawing its circles back, so radii can be checked and so the
   export writes CIRCLE and ARC instead of many-sided polygons. */
function migrateRound(pg){
  const d=pg&&pg.dxf; if(!d||!d.polys) return 0;
  let n=0;
  d.polys.forEach(p=>{
    if(p._round || !p.pts || p.pts.length<5) return;
    const R=recFitCircle(p.pts);
    if(R){ p._round=R; n++; }
  });
  return n;
}
/* A project saved before models existed has NO models at all - only the lines,
   arrowheads and numbers that were drawn. There is no DXF left to re-read, but
   none is needed: those shapes are exactly what the recovery pass reads. So an old
   project is rebuilt from its own drawing, the same way a drawing that never
   declared its dimensions is. */
function migrateRebuild(pg){
  const d=pg&&pg.dxf; if(!d || !d.polys || !d.polys.length) return 0;
  let n=0;
  try{
    if(!d.secs || !d.secs.length) d.secs=v2SectionModels(d, 1)||[];
    n+=(d.secs||[]).length;
  }catch(err){ console.warn('section rebuild failed', err); }
  try{ n+=stylizeScan(pg); }catch(err){ console.warn('dimension rebuild failed', err); }
  return n;
}
/* Run over every page of a project as it is opened. */
function migrateProject(st){
  if(!st||!st.pages) return 0;
  let n=0;
  st.pages.forEach(pg=>{
    const d=pg&&pg.dxf; if(!d) return;
    (d.dims||[]).forEach(m=>{ if(dimMigrateModel(m)) n++; });
    (d.secs||[]).forEach(s=>{ if(secMigrateModel(s)) n++; });
    if(pg.type==='sheet'){ migrateRound(pg);
      if(!(d.dims||[]).length) n+=migrateRebuild(pg); }
  });
  return n;
}
function openProject(id){
  store=DB.find(p=>p.id===id); if(!store) return;
  if(!store.activeId) store.activeId=store.pages[0].id;
  // A project saved by an older build carries older models. Bring them up to date
  // and redraw from them, or every rule added since will appear to do nothing.
  try{
    store.pages.forEach(pg=>{ if(pg.type==='sheet' && pg.dxf && !(pg.objects&&pg.objects.length)) buildObjects(pg); });
    store.pages.forEach(pg=>{ if(pg.type!=='sheet' || !pg.dxf) return;
      const waiting=((pg.dxf.dims||[]).some(m=>m.pending) ||
                     (pg.dxf.secs||[]).some(s=>s.pending));
      if(waiting){ dimRelayout(pg); secRelayout(pg); } });
    const n=migrateProject(store);
    if(n){ store.pages.forEach(pg=>{ if(pg.type==='sheet' && pg.dxf){
      buildObjects(pg); dimRelayout(pg); secRelayout(pg); } }); persist();
      console.log('project brought up to date:', n, 'models'); }
  }catch(err){ console.warn('project migration failed', err); }
  if(store.format){ const fm=frameMargin(store.format.paper);
    if(store.format.margin!==fm){ store.format.margin=fm; persist(); } }
  history={undo:[],redo:[]};
  $('#dashboard').classList.add('hide'); $('#editor').classList.remove('hide'); $('#formatView').classList.add('hide');
  syncNavName(); renderSidebar();
  requestAnimationFrame(()=>{ resizeCanvas(); fitView(); updateUndoButtons(); });
}
function formatOpen(){ return !$('#formatView').classList.contains('hide'); }

  $('#dashboard').classList.remove('hide'); renderDashboard(); }
