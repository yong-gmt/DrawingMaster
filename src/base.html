function centerDXF(pg){
  const bb=dxfBBox(pg); if(!bb) return;
  const {W,H}=paperDims(); const m=store.format.margin;
  const cx=W/2, cy=m+TB_H+(H-2*m-TB_H)/2;
  const dx=cx-(bb.minx+bb.maxx)/2, dy=cy-(bb.miny+bb.maxy)/2;
  const d=pg.dxf;
  d.polys.forEach(p=>p.pts=p.pts.map(pt=>[pt[0]+dx,pt[1]+dy]));
  d.texts.forEach(t=>{ t.x+=dx; t.y+=dy; });
  d.hatches.forEach(h=>h.loops=h.loops.map(l=>l.map(pt=>[pt[0]+dx,pt[1]+dy])));
  (d.solids||[]).forEach((sd,i)=>d.solids[i]=sd.map(pt=>[pt[0]+dx,pt[1]+dy]));
  (d.marks||[]).forEach((m,i)=>d.marks[i]=[m[0]+dx,m[1]+dy]);
  (d.clines||[]).forEach(c=>{ c.x+=dx; c.y+=dy; });
}
function fitToDXF(pg){
  const bb=dxfBBox(pg); if(!bb){ fitView(); return; }
  const a=fitArea(), pad=60;
  const bw=Math.max(1,bb.maxx-bb.minx), bh=Math.max(1,bb.maxy-bb.miny);
  const sc=Math.min((a.w-pad)/bw,(a.h-pad)/bh);
  view.zoom=sc/fitScale(); view.s=sc;
  const c=W2S((bb.minx+bb.maxx)/2,(bb.miny+bb.maxy)/2);
  view.tx+=a.x0+a.w/2-c.x; view.ty+=a.y0+a.h/2-c.y;
  updateZoomLabel(); render();
}
/* keep old names alive for any external callers */
function entitiesBBox(pg){ return dxfBBox(pg); }

/* ---- rendering (1:1) ------------------------------------------------ */
function mtextPlain(s){ return String(s)
  .replace(/\\P/g,'\n').replace(/\\~/g,' ')
  .replace(/\\[A-Za-z][^;\\]*;?/g,'').replace(/[{}]/g,'').trim(); }
/* ============================================================
   OBJECTS — selectable/movable pieces (vector-style editing)
   Imported geometry is clustered into objects (each view/part =
   one piece). Objects can be dragged, marquee-selected, grouped,
   and aligned/snapped. All coords are world millimetres.
   ============================================================ */
function _bbPts(pts){ let a=1e9,b=1e9,c=-1e9,d=-1e9; pts.forEach(p=>{ if(p[0]<a)a=p[0]; if(p[1]<b)b=p[1]; if(p[0]>c)c=p[0]; if(p[1]>d)d=p[1]; }); return [a,b,c,d]; }
function _bbLoops(ls){ let a=1e9,b=1e9,c=-1e9,d=-1e9; ls.forEach(L=>L.forEach(p=>{ if(p[0]<a)a=p[0]; if(p[1]<b)b=p[1]; if(p[0]>c)c=p[0]; if(p[1]>d)d=p[1]; })); return [a,b,c,d]; }
function _bbUnion(A,B){ return [Math.min(A[0],B[0]),Math.min(A[1],B[1]),Math.max(A[2],B[2]),Math.max(A[3],B[3])]; }
function _bbNear(A,B,g){ return !(A[2]+g<B[0] || B[2]+g<A[0] || A[3]+g<B[1] || B[3]+g<A[1]); }

let _oidSeq=1;
let _gidSeq=1;
function addTextLabel(){
  const pg=activePage();
  if(!pg||pg.type!=='sheet'){ toast('open a sheet page first, then add text'); return; }
  if(!pg.objects) buildObjects(pg);
  snapshot();
  const {W,H}=paperDims(); const m=store.format.margin;
  const cx=W/2, cy=m+TB_H+(H-2*m-TB_H)/2;                 // centre of the drawing area
  const h=(store.format.fontSize||20)*PT_TO_MM;
  const t={ text:'TEXT', x:cx, y:cy, h, rot:0, align:1, _ruled:true, _user:true };
  const ob={ id:'o'+(_oidSeq++), dx:0, dy:0, group:null,
             prims:{polys:[],texts:[t],solids:[],marks:[],hatches:[],clines:[]} };
  pg.objects.push(ob);
  setSelection([ob.id]);
  afterMutate();
  startTextEdit(ob, t);                                    // let the user type right away
}
function buildObjects(pg){
  const d=pg.dxf; if(!d){ pg.objects=[]; return; }
  const items=[];
  (d.polys||[]).forEach(o=>items.push({t:'polys',o,bb:_bbPts(o.pts)}));
  (d.solids||[]).forEach(o=>items.push({t:'solids',o,bb:_bbPts(o)}));
  (d.hatches||[]).forEach(o=>items.push({t:'hatches',o,bb:_bbLoops(o.loops)}));
  (d.texts||[]).forEach(o=>{ const h=o.h||2.5; items.push({t:'texts',o,bb:[o.x-h,o.y-h,o.x+h*8,o.y+h]}); });
  (d.marks||[]).forEach(o=>items.push({t:'marks',o,bb:[o[0]-1,o[1]-1,o[0]+1,o[1]+1]}));
  // Each primitive is its own selectable object (vector-editor model).
  // The user defines higher-level "pieces" by marquee-selecting and grouping.
  const objs=[];
  const dimGroups={};                                 // dimension id -> group id
  const push=(t,o)=>{ const prims={polys:[],texts:[],solids:[],marks:[],hatches:[],clines:[]}; prims[t].push(o);
    // A dimension's parts (extension lines, dimension line, arrowheads, value text)
    // arrive already tagged, so they land in one group and select/move as a unit.
    const dim=o&&o._dim;
    let grp=null;
    if(dim){ grp=dimGroups[dim] || (dimGroups[dim]='g'+(_gidSeq++)); }
    objs.push({ id:'o'+(_oidSeq++), dx:0, dy:0, group:grp, _dim:dim||null, prims }); };
  items.forEach(it=>push(it.t,it.o));
  (d.clines||[]).forEach(c=>push('clines',c));
  pg.objects=objs;
}
function objBBox(ob){
  let a=1e9,b=1e9,c=-1e9,d=-1e9; const P=ob.prims;
  const add=(x,y)=>{ if(x<a)a=x; if(y<b)b=y; if(x>c)c=x; if(y>d)d=y; };
  (P.polys||[]).forEach(o=>o.pts.forEach(p=>add(p[0],p[1])));
  (P.solids||[]).forEach(o=>o.forEach(p=>add(p[0],p[1])));
  (P.hatches||[]).forEach(o=>o.loops.forEach(L=>L.forEach(p=>add(p[0],p[1]))));
  (P.texts||[]).forEach(o=>{ const h=o.h||2.5; const w=Math.max(h*1.5, String(o.text).length*h*0.62);
    let x0=o.x; if(o.align===1)x0=o.x-w/2; else if(o.align===2)x0=o.x-w;
    add(x0, o.y-h*0.35); add(x0+w, o.y+h*1.15); });
  (P.marks||[]).forEach(o=>add(o[0],o[1]));
  (P.clines||[]).forEach(o=>add(o.x,o.y));
  if(a===1e9) return null;
  return {minx:a+ob.dx,miny:b+ob.dy,maxx:c+ob.dx,maxy:d+ob.dy};
}
function drawEntities(page){
  const objs=page.objects; if(!objs||!objs.length){ if(page.dxf) buildObjects(page); }
  const list=page.objects||[]; if(!list.length) return;
  ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
  const lw=Math.max(1, mm2px(store.format.stroke||0.2));
  const u=view.s*0.35;
  list.forEach(ob=>drawObject(ob,lw,u));
  ctx.restore();
}
function drawObject(ob,lw,u){
  const P=ob.prims, dx=ob.dx||0, dy=ob.dy||0;
  const TP=(x,y)=>W2S(x+dx,y+dy);
  ctx.strokeStyle=INK; ctx.fillStyle=INK; ctx.lineWidth=lw;
  // hatches
  (P.hatches||[]).forEach(h=>drawHatchOff(h,lw,dx,dy));
  // polylines
  (P.polys||[]).forEach(p=>{
    ctx.setLineDash(p.dash? p.dash.map(v=>v*u):[]);
    ctx.lineWidth = p._lw ? Math.max(0.6, lw*p._lw) : lw;   // line type carries its own weight
    ctx.beginPath();
    p.pts.forEach((pt,i)=>{ const q=TP(pt[0],pt[1]); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
    ctx.stroke();
    // A dimension line owns its arrowheads: they are drawn FROM its start/end points,
    // so stretching the line moves them automatically - no separate objects to chase.
    if(p._arrow) drawLineArrows(p, TP);
  });
  ctx.setLineDash([]);
  ctx.lineWidth=lw;                                   // restore base weight for the rest
  // solids
  (P.solids||[]).forEach(sd=>{ if(sd.length<3)return; ctx.beginPath();
    sd.forEach((pt,i)=>{ const q=TP(pt[0],pt[1]); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }); ctx.closePath(); ctx.fill(); });
  // construction lines
  if(P.clines&&P.clines.length){ const bb=objBBox(ob)||{minx:0,miny:0,maxx:100,maxy:100};
    const span=Math.hypot(bb.maxx-bb.minx,bb.maxy-bb.miny); const L=Math.max(span,200)*2+50;
    ctx.setLineDash([mm2px(4),mm2px(2)]);
    P.clines.forEach(c=>{ const n=Math.hypot(c.dx,c.dy)||1; const ux=c.dx/n, uy=c.dy/n;
      const a=TP(c.x-(c.ray?0:ux*L), c.y-(c.ray?0:uy*L)); const b=TP(c.x+ux*L, c.y+uy*L);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); });
    ctx.setLineDash([]); }
  // marks
  (P.marks||[]).forEach(m=>{ const q=TP(m[0],m[1]); const r=Math.max(1.5,lw*1.5);
    ctx.beginPath(); ctx.moveTo(q.x-r,q.y); ctx.lineTo(q.x+r,q.y); ctx.moveTo(q.x,q.y-r); ctx.lineTo(q.x,q.y+r); ctx.stroke(); });
  // text
  (P.texts||[]).forEach(t=>drawImportedText({x:t.x+dx,y:t.y+dy,h:t.h,text:t.text,rot:t.rot,align:t.align,scaleRot:t.scaleRot,_ruled:t._ruled}));
}
function drawHatchOff(h,lw,dx,dy){
  if(!h.loops.length) return;
  ctx.save(); ctx.setLineDash([]); ctx.strokeStyle=INK; ctx.fillStyle=INK; ctx.lineWidth=lw;
  const TP=(x,y)=>W2S(x+dx,y+dy);
  const path=()=>{ ctx.beginPath();
    h.loops.forEach(L=>{ L.forEach((pt,i)=>{ const q=TP(pt[0],pt[1]); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }); ctx.closePath(); }); };
  if(h.solid){ path(); ctx.fill('evenodd'); ctx.restore(); return; }
  // hatch style 2 ("ignore") fills through islands; 0/1 cut them out (even-odd)
  path(); ctx.clip(h.style===2?'nonzero':'evenodd');
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  h.loops.forEach(L=>L.forEach(pt=>{ const q=TP(pt[0],pt[1]);
    if(q.x<mnx)mnx=q.x; if(q.y<mny)mny=q.y; if(q.x>mxx)mxx=q.x; if(q.y>mxy)mxy=q.y; }));
  const cx=(mnx+mxx)/2, cy=(mny+mxy)/2, diag=Math.hypot(mxx-mnx,mxy-mny)+2;
  const scale=(h.scale&&h.scale>0)?h.scale:1;
  // draw each pattern definition line family from the file; fall back to ANSI31 (45 deg)
  // The parser already converts both the pattern angle (group 52) and each pattern
  // definition line angle (group 53) to RADIANS. Converting again turned a 45 degree
  // ANSI31 section fill into an almost horizontal one, so use them as they arrive.
  const fams=(h.lines&&h.lines.length)?h.lines:[{angle:Math.PI/4, ox:0, oy:3.18}];
  fams.forEach(f=>{
    const ang=(f.angle||0)+(h.angle||0);
    const off=Math.hypot(f.ox||0, f.oy||0) || 3.18;          // spacing between lines (pattern units)
    const gap=Math.max(3, mm2px(off*scale));
    const ddx=Math.cos(ang), ddy=-Math.sin(ang);             // screen Y is flipped
    const nx=-ddy, ny=ddx;
    for(let t=-diag;t<=diag;t+=gap){ const px=cx+nx*t, py=cy+ny*t;
      ctx.beginPath(); ctx.moveTo(px-ddx*diag,py-ddy*diag); ctx.lineTo(px+ddx*diag,py+ddy*diag); ctx.stroke(); }
  });
  ctx.restore();
}
function drawImportedText(t){
  if(t.text==null||t.text==='') return;
  const p=W2S(t.x,t.y); const hpx=mm2px(t.h);
  ctx.save(); ctx.setLineDash([]); ctx.fillStyle=INK;
  ctx.translate(p.x,p.y); ctx.rotate(-((t.rot||0)+(t.scaleRot||0))*Math.PI/180);
  ctx.font=`${hpx}px ${store.format.font},Arial`;
  ctx.textBaseline='alphabetic'; ctx.textAlign=(t.align===1?'center':t.align===2?'right':'left');
  String(t.text).split('\n').forEach((ln,i)=>ctx.fillText(ln,0,i*hpx*1.25));
  if(t._ruled){                                            // "view label" style: a rule above and below
    const lines=String(t.text).split('\n');
    let tw=0; lines.forEach(ln=>{ tw=Math.max(tw, ctx.measureText(ln).width); });
    const nL=lines.length, botY=(nL-1)*hpx*1.25 + hpx*0.34, topY=-hpx*1.02;
    let x0,x1; if(t.align===1){x0=-tw/2;x1=tw/2;} else if(t.align===2){x0=-tw;x1=0;} else {x0=0;x1=tw;}
    const pad=hpx*0.28;
    ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1,mm2px(store.format.stroke||0.2));
    ctx.beginPath(); ctx.moveTo(x0-pad,topY); ctx.lineTo(x1+pad,topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0-pad,botY); ctx.lineTo(x1+pad,botY); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- TITLE BLOCK grid fractions ---------- */
const FX={apN:0.1444, ap:0.2404, scl:0.3599, tol:0.4801, size:0.5734, mat:0.6198,
          ver:0.6667, part:0.7596, col:0.8318, logo:0.9036};
const FY={b1:0.3333, b2:0.664, a2:0.5, a3:0.664, a4:0.828, t2:0.5, t3:0.828};

function sheetInfo(page){ const sheets=store.pages.filter(p=>p.type==='sheet'); const i=sheets.indexOf(page);
  if(i<0) return {idx:'X',total:'X'};                       // template preview
  return {idx:i+1,total:sheets.length}; }
function tbRect(){ const {W,H}=paperDims(); const m=store.format.margin; return { x:W-m-TB_W, y:m, w:TB_W, h:TB_H }; }

function drawTitleBlock(page){
  const r=tbRect(), t=page.title||{}, f=store.format, ap=f.approvals||{}, si=sheetInfo(page);
  const X=fx=>r.x+fx*TB_W, Y=fy=>r.y+(1-fy)*TB_H;      // fx/fy are fractions, fy measured from top
  const thin=Math.max(0.7,mm2px(0.18)), thick=Math.max(1.1,mm2px(0.3));
  ctx.strokeStyle=INK; ctx.lineWidth=thick;
  const o1=W2S(r.x,r.y+TB_H), o2=W2S(r.x+TB_W,r.y);
  ctx.strokeRect(o1.x,o1.y,o2.x-o1.x,o2.y-o1.y);
  ctx.lineWidth=thin;
  const V=(fx,fy0,fy1)=>{ const a=W2S(X(fx),Y(fy0)),b=W2S(X(fx),Y(fy1)); seg(a,b); };
  const Hl=(fy,fx0,fx1)=>{ const a=W2S(X(fx0),Y(fy)),b=W2S(X(fx1),Y(fy)); seg(a,b); };
  /* text: fits inside a cell, shrinking if necessary */
  const T=(x,yBase,txt,em,bold,al,maxW)=>{
    txt=(txt==null?'':String(txt)); if(!txt) return;
    let e=em; if(maxW){ const w=measureMM(txt,em,bold); if(w>maxW) e=em*maxW/w; }
    drawTextMM(x,yBase,txt,e,bold,al);
  };
  const LB=(fx,fyTop,txt)=>T(X(fx)+0.8, Y(fyTop)-2.50, txt, 1.65, false,'l');      // cell label (baseline 2.50mm below the rule)
  const VAL=(fx0,fx1,fyTop,fyBot,txt,em,bold)=>{                                    // value: baseline at 24.5% of cell height
    const yT=Y(fyTop), yB=Y(fyBot);
    T((X(fx0)+X(fx1))/2, yB+(yT-yB)*0.245, txt, em, bold, 'c', (X(fx1)-X(fx0))-2.4);
  };
  const CEN=(fx0,fx1,fyTop,fyBot,txt,em,bold)=>{                                    // vertically centred
    const yT=Y(fyTop), yB=Y(fyBot);
    T((X(fx0)+X(fx1))/2, (yT+yB)/2-em*0.716/2, txt, em, bold, 'c', (X(fx1)-X(fx0))-2.0);
  };

  /* ---------------- grid ---------------- */
  V(FX.ap,0,1); V(FX.tol,0,1); V(FX.part,0,1);
  V(FX.apN,FY.b1,1);
  V(FX.scl,FY.t2,FY.t3);
  V(FX.size,FY.b1,FY.b2); V(FX.ver,FY.b1,FY.b2);
  V(FX.mat,FY.b2,1); V(FX.col,FY.b2,1);
  V(FX.logo,FY.b1,1);
  Hl(FY.b1,0,FX.ap); Hl(FY.b1,FX.tol,1); Hl(FY.b2,FX.tol,FX.logo);   // middle column has no line at .3333
  Hl(FY.a2,0,FX.tol); Hl(FY.a3,0,FX.ap); Hl(FY.a4,0,FX.tol);

  /* ---------------- left: notes + approvals ---------------- */
  const cxL=(0+FX.ap)/2;
  T(X(cxL), Y(0.145), 'BREAK ALL SHARP EDGES AND REMOVE', 1.65,false,'c', TB_W*FX.ap-2);
  T(X(cxL), Y(0.242), 'BURRS', 1.65,false,'c');
  CEN(0,FX.apN,FY.b1,FY.a2,'APPROVALS',1.65,false);
  CEN(FX.apN,FX.ap,FY.b1,FY.a2,'DATE',1.65,false);
  [['DESIGN',ap.design,FY.a2,FY.a3],['DRAWN',ap.drawn,FY.a3,FY.a4],['APPROVED',ap.approved,FY.a4,1]]
   .forEach(([role,obj,f0,f1])=>{

  LB(FX.tol,FY.b1,'SIZE');        VAL(FX.tol,FX.size,FY.b1,FY.b2,f.paper,2.24,true);
  LB(FX.size,FY.b1,'VERSION');    VAL(FX.size,FX.ver,FY.b1,FY.b2,t.version||f.version||'VER.',2.24,true);
  LB(FX.ver,FY.b1,'PART NO.');    VAL(FX.ver,FX.part,FY.b1,FY.b2,t.partNo||'NO.',2.24,true);
  LB(FX.part,FY.b1,'DRAWING NO.');VAL(FX.part,FX.logo,FY.b1,FY.b2,t.drawingNo||'PRJ-VER-PRT-XX',2.24,true);

  LB(FX.mat,FY.b2,'FINISH');      VAL(FX.mat,FX.part,FY.b2,1,t.finish||'FINISH',2.24,true);

  LB(FX.col,FY.b2,'SHEET');       VAL(FX.col,FX.logo,FY.b2,1,`${si.idx} OF ${si.total}`,2.24,true);

/* first-angle projection symbol: truncated cone + crosshair target */
function projSym(cx,cy,wmm){
  const u=mm2px(wmm)/15;
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.7,mm2px(0.18));
  const c=W2S(cx,cy), fx=c.x-u*4.0, tx=c.x+u*3.4;
  ctx.beginPath();
  ctx.moveTo(fx-u*2.6,c.y-u*1.5); ctx.lineTo(fx+u*1.0,c.y-u*2.7);
  ctx.lineTo(fx+u*1.0,c.y+u*2.7); ctx.lineTo(fx-u*2.6,c.y+u*1.5); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fx-u*3.6,c.y); ctx.lineTo(fx+u*1.6,c.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(tx,c.y,u*2.2,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(tx,c.y,u*1.0,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx-u*3.4,c.y); ctx.lineTo(tx+u*3.4,c.y);
  ctx.moveTo(tx,c.y-u*3.4); ctx.lineTo(tx,c.y+u*3.4); ctx.stroke();
}
function tbLogo(cx,cy,wmm){
  const c=W2S(cx,cy), R=mm2px(wmm*0.30);
  ctx.strokeStyle='#1b3b6f'; ctx.fillStyle='#1b3b6f'; ctx.lineWidth=Math.max(0.9,mm2px(0.28));
  ctx.beginPath();
  for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3, x=c.x+R*Math.cos(a), y=c.y-mm2px(1.7)+R*Math.sin(a);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${R*0.85}px ${store.format.font},Arial`; ctx.fillText('GM',c.x,c.y-mm2px(1.7));
  ctx.font=`700 ${mm2px(1.25)}px ${store.format.font},Arial`; ctx.fillText('GENERAL MAGIC',c.x,c.y+mm2px(2.9));
  ctx.font=`400 ${mm2px(0.95)}px ${store.format.font},Arial`; ctx.fillText('(THAILAND) CO.,Ltd.',c.x,c.y+mm2px(4.3));
  ctx.fillStyle=INK; ctx.strokeStyle=INK; ctx.textAlign='left'; ctx.textBaseline='top';
}

/* ---------- selection (module 2 fills hit-testing) ---------- */
/* ============================================================
   STYLIZE — convert Radius/Section dimensions to ANSI style and
   normalise text size & stroke to Format Config. 1:1, undoable.
   ============================================================ */
/* STYLIZE must only ever reshape ANNOTATION: dimension leaders, section markers and
   centre lines. Object geometry (the part outline) is sacred — touching it deleted
   real edges and the damage compounded on every press. A primitive qualifies when it
   belongs to a dimension group, is tagged as a section line, or lives on a layer that
   the CAD file itself marks as annotation. */
/* Dimension value placement (drafting convention): the text sits CENTRED on its
   dimension line and stands clear of it by a small gap. The gap is specified in
   screen pixels (5 px at 1:1) and converted to drawing millimetres so the drawing
   itself stays scale-correct. */
const DIM_TEXT_GAP_PX=5;
const PX_PER_MM=96/25.4;                       // CSS pixel density
function placeDimensionText(pg, txtH){
  const gap=DIM_TEXT_GAP_PX/PX_PER_MM;         // 5 px -> mm
  // collect each dimension's parts
  const byDim={};
  (pg.objects||[]).forEach(o=>{
    (o.prims.polys||[]).forEach(p=>{ if(!p._dim) return;
      (byDim[p._dim]||(byDim[p._dim]={lines:[],texts:[]})).lines.push({o,p}); });
    (o.prims.texts||[]).forEach(t=>{ if(!t._dim) return;
      (byDim[t._dim]||(byDim[t._dim]={lines:[],texts:[]})).texts.push({o,t}); });
  });
  let moved=0;
  Object.values(byDim).forEach(g=>{
    if(g.texts.length!==1 || !g.lines.length) return;      // only simple, unambiguous cases
    const {o:to, t}=g.texts[0];
    if(t._userMoved) return;                               // never fight a manual edit
    const rot=((t.rot||0)%180+180)%180;
    const wantVert=Math.abs(rot-90)<30;                    // 90 deg text belongs to a vertical dimension
    // the dimension line = longest straight segment running along the text direction
    let best=null, bl=-1;
    g.lines.forEach(({o,p})=>{
      if(p.pts.length<2) return;
      const a=[p.pts[0][0]+(o.dx||0), p.pts[0][1]+(o.dy||0)];
      const b=[p.pts[p.pts.length-1][0]+(o.dx||0), p.pts[p.pts.length-1][1]+(o.dy||0)];
      const dx=b[0]-a[0], dy=b[1]-a[1]; const len=Math.hypot(dx,dy);
      if(len<1e-6) return;
      const isVert=Math.abs(dy)>Math.abs(dx);
      if(isVert!==wantVert) return;                        // extension lines run the other way
      if(len>bl){ bl=len; best={a,b}; }
    });
    if(!best || bl<txtH) return;
    const mid=[(best.a[0]+best.b[0])/2, (best.a[1]+best.b[1])/2];
    // Perpendicular to the dimension line, on the side the text already favours.
    const n = wantVert ? [-1,0] : [0,1];
    const cur=[t.x+(to.dx||0), t.y+(to.dy||0)];
    const side=((cur[0]-mid[0])*n[0] + (cur[1]-mid[1])*n[1]) >= 0 ? 1 : -1;
    const nx=n[0]*side, ny=n[1]*side;
    // Glyphs grow away from the baseline along "up"; rotating the text by 90 deg turns
    // that direction too. If they grow TOWARDS the line, push the baseline out by one
    // text height so the visible gap stays the same on both sides.
    const rr=(t.rot||0)*Math.PI/180;
    const up=[-Math.sin(rr), Math.cos(rr)];
    const grows=(up[0]*nx + up[1]*ny) > 0;
    const off = gap + (grows?0:txtH);
    // Anchor exactly on the line's midpoint along the line, offset only perpendicular.
    t.align=1;                                             // centred on the dimension line
    t.x = (mid[0] + nx*off) - (to.dx||0);
    t.y = (mid[1] + ny*off) - (to.dy||0);
    moved++;
  });
  return moved;
}
function isAnnotationPrim(p){
  if(!p) return false;
  if(p._dim) return true;
  if(p._section) return true;
  const L=(p._layer||'').toString();
  return /dimension|dimen|annot|section|center|centre|defpoints|leader|smart\s*center/i.test(L);
}
function stylizeANSI(){
  const pg=activePage();
  if(!pg||pg.type!=='sheet'||!pg.objects||!pg.objects.length){ toast('open a sheet page with an imported drawing, then press Stylize'); return; }
  const f=store.format;
  snapshot();                                   // save pre-stylize state for Undo
  const txtH=(f.fontSize||20)*PT_TO_MM;         // all text -> Format Config size (pt -> mm)
  let radiusN=0, sectionN=0, textN=0;
  // ---- RADIUS/DIAMETER -> ANSI: make the shoulder segment horizontal, text sits on it ----
  if(f.ansiRadius){
    const isRadT=(t)=>{ if(t.dimType===4||t.dimType===3) return true;   // tagged at import
      const s=String(t.text||'').trim(); return /^R\s*[\d.]/i.test(s) || /^[Ø⌀ΦφøØ]\s*[\d.]/.test(s); }; // fallback by content
    const radTexts=[];
    pg.objects.forEach(o=>(o.prims.texts||[]).forEach(t=>{ if(isRadT(t)) radTexts.push({o,t,ax:t.x+(o.dx||0),ay:t.y+(o.dy||0)}); }));
    // leader candidates = straight 2-point line segments (tagged shoulders preferred)
    const lines=[];
    pg.objects.forEach(o=>(o.prims.polys||[]).forEach(p=>{ if(!p._ansi && p.pts.length===2 && isAnnotationPrim(p)) lines.push({o,p}); }));
    radTexts.forEach(rt=>{
      rt.t.rot=0; rt.t.h=txtH;                            // always horizontalise + size the text
      if(rt.t._ansiDone) return;
      // find the leader's text-end segment: nearest 2-pt line endpoint to the text (tagged shoulders win big)
      let sh=null, best=1e9, tpi=0;
      lines.forEach(({o,p})=>{ if(p._ansiUsed) return;
        [0,1].forEach(ei=>{ const te=p.pts[ei]; const ax=te[0]+(o.dx||0), ay=te[1]+(o.dy||0);
          const d=Math.hypot(ax-rt.ax, ay-rt.ay); const score=d-(p._radShoulder?1e4:0);
          if(score<best && d<txtH*4){ best=score; sh={o,p}; tpi=ei; } }); });
      if(!sh) return;
      const o=sh.o, p=sh.p, ti=tpi, ei=tpi===0?1:0;
      const TP=p.pts[ti], E=p.pts[ei];
      const tpx=TP[0]+(o.dx||0), tpy=TP[1]+(o.dy||0);
      const ex=E[0]+(o.dx||0), ey=E[1]+(o.dy||0);
      const w=Math.max(txtH*2, String(rt.t.text).length*txtH*0.62);
      // is the elbow end E joined to another leader segment? (multi-segment leader has a separate shoulder)
      let connected=false;
      for(const L2 of lines){ if(L2.p===p) continue;
        for(const k of [0,1]){ const q=L2.p.pts[k]; const qx=q[0]+(L2.o.dx||0), qy=q[1]+(L2.o.dy||0);
          if(Math.hypot(qx-ex,qy-ey)<txtH*0.6){ connected=true; break; } } if(connected) break; }
      let elbowX, elbowY, dir;
      if(connected){                                       // real shoulder segment -> flatten it (keep elbow)
        elbowX=ex; elbowY=ey; dir=(tpx>=ex)?1:-1;
        p.pts[ti]=[ (ex+dir*(w+txtH*0.6))-(o.dx||0), ey-(o.dy||0) ];
        p._ansiUsed=true;
      } else {                                             // single radial leader -> keep it, ADD a horizontal shoulder at TP
        elbowX=tpx; elbowY=tpy; dir=(tpx>=ex)?1:-1;        // shoulder continues away from the arc
        o.prims.polys.push({ pts:[ [tpx-(o.dx||0), tpy-(o.dy||0)], [(tpx+dir*(w+txtH*0.6))-(o.dx||0), tpy-(o.dy||0)] ], dash:null, _ansi:true });
      }
      // place the text sitting on the shoulder line (baseline just above the line)
      rt.t.align=0;
      const startXw = dir>0 ? (elbowX+txtH*0.35) : (elbowX-txtH*0.35 - w);
      rt.t.x = startXw-(rt.o.dx||0);
      rt.t.y = (elbowY + txtH*0.12)-(rt.o.dy||0);          // baseline sits ON the shoulder line
      rt.t._ansiDone=true; radiusN++;
    });
  }
  // normalise every text size (all texts)
  pg.objects.forEach(ob=>{ (ob.prims.texts||[]).forEach(t=>{ if(!t._ansiDone) t.h=txtH; textN++; }); });
  // Dimension text orientation is decided at import from the DIMENSION entity's own
  // type and angle (see v2DimTextRot), which is exact — no need to re-guess it here.
  // ---- SECTION -> ANSI: identify by letter labels (A-H), any orientation, avoid overlaps ----
  if(f.ansiSection){
    const abs=(o,p)=>[p[0]+(o.dx||0),p[1]+(o.dy||0)];
    // every straight 2-pt line is a leader candidate; tagged section lines are preferred
    const allLines=[];
    pg.objects.forEach(o=>(o.prims.polys||[]).forEach(p=>{ if(!p._ansi && p.pts.length>=2 && isAnnotationPrim(p))
      allLines.push({o,p, a:abs(o,p.pts[0]), b:abs(o,p.pts[p.pts.length-1]), sec:!!p._section}); }));
    // section markers = single-letter labels grouped by letter
    const byLetter={};
    pg.objects.forEach(o=>(o.prims.texts||[]).forEach(t=>{ const s=String(t.text).trim();
      if(/^[A-H]$/.test(s)) (byLetter[s]||(byLetter[s]=[])).push({o,t,x:t.x+(o.dx||0),y:t.y+(o.dy||0)}); }));
    // collect boxes of ALL other texts for overlap avoidance
    const txtBox=(x0,y0,w,h)=>({x0,y0,x1:x0+w,y1:y0+h});
    const boxes=[];
    pg.objects.forEach(o=>(o.prims.texts||[]).forEach(t=>{ if(/^[A-H]$/.test(String(t.text).trim()))return;
      const h=t.h||txtH, w=Math.max(h*1.2,String(t.text).length*h*0.62); let x0=t.x+(o.dx||0);
      if(t.align===1)x0-=w/2; else if(t.align===2)x0-=w; boxes.push(txtBox(x0,t.y+(o.dy||0),w,h)); }));
    const overlaps=(bx)=>boxes.some(b=>!(bx.x1<b.x0||bx.x0>b.x1||bx.y1<b.y0||bx.y0>b.y1));

    Object.keys(byLetter).forEach(L=>{
      const labs=byLetter[L]; if(!labs.length) return;
      // axis: line joining the two like-letters (for a 2-marker section); else use tagged line dir
      let axu;
      if(labs.length>=2){ const v=[labs[1].x-labs[0].x, labs[1].y-labs[0].y]; const l=Math.hypot(v[0],v[1])||1; axu=[v[0]/l,v[1]/l]; }
      // cutting line = the longest line most parallel to the axis and closest to it (tagged preferred)
      let cut=null,best=1e9;
      allLines.forEach(s=>{ const dv=[s.b[0]-s.a[0],s.b[1]-s.a[1]]; const dl=Math.hypot(dv[0],dv[1]); if(dl<txtH*3) return;
        const du=[dv[0]/dl,dv[1]/dl];
        let par=1; if(axu) par=Math.abs(du[0]*axu[0]+du[1]*axu[1]);
        // must pass near the labels
        const mid=[(s.a[0]+s.b[0])/2,(s.a[1]+s.b[1])/2];
        const dlab=Math.min(...labs.map(p=>Math.hypot(mid[0]-p.x,mid[1]-p.y)));
        const sc=dlab - dl*0.5 - (s.sec?1e4:0) - (par>0.85?1e3:0);
        if((axu?par>0.7:true) && sc<best){ best=sc; cut=s; } });
      if(!cut) return;
      // orientation + the two extreme ends among colinear section/tagged segments
      const vertical=Math.abs(cut.b[0]-cut.a[0]) < Math.abs(cut.b[1]-cut.a[1]);
      const axisX=(cut.a[0]+cut.b[0])/2, axisY=(cut.a[1]+cut.b[1])/2;
      const colinear=allLines.filter(s=>{ const dv=[s.b[0]-s.a[0],s.b[1]-s.a[1]]; const dl=Math.hypot(dv[0],dv[1])||1;
        const along= vertical ? Math.abs(dv[1])>Math.abs(dv[0]) : Math.abs(dv[0])>Math.abs(dv[1]);
        const near = vertical ? Math.abs((s.a[0]+s.b[0])/2-axisX)<txtH : Math.abs((s.a[1]+s.b[1])/2-axisY)<txtH;
        return along&&near; });
      let e1,e2;
      if(vertical){ let mn=1e9,mx=-1e9; colinear.forEach(s=>[s.a,s.b].forEach(p=>{ if(p[1]<mn)mn=p[1]; if(p[1]>mx)mx=p[1]; })); e1=[axisX,mx]; e2=[axisX,mn]; }
      else { let mn=1e9,mx=-1e9; colinear.forEach(s=>[s.a,s.b].forEach(p=>{ if(p[0]<mn)mn=p[0]; if(p[0]>mx)mx=p[0]; })); e1=[mx,axisY]; e2=[mn,axisY]; }
      // perpendicular arm candidates (any short line perpendicular to the cut, near an end)
      const arms=allLines.filter(s=>{ const dv=[s.b[0]-s.a[0],s.b[1]-s.a[1]]; return vertical? Math.abs(dv[0])>Math.abs(dv[1]) : Math.abs(dv[1])>Math.abs(dv[0]); });

      [e1,e2].forEach(E=>{
        // the label for this end = nearest like-letter
        let lb=null,ld=1e9; labs.forEach(p=>{ const d=Math.hypot(p.x-E[0],p.y-E[1]); if(d<ld){ld=d;lb=p;} });
        if(!lb) return;
        if(lb.t._ansiDone) return;                   // already ANSI-styled: pressing again is a no-op
        // viewing direction = the side the ORIGINAL arrowhead sits on (its centroid relative to the
        // cut-line end). This follows the source file exactly; we only reposition, never flip.
        let sideRef=null, ahd=1e9;
        pg.objects.forEach(o=>(o.prims.solids||[]).forEach(sd=>{ if(sd.length<3)return; let cx=0,cy=0,k=0;
          sd.forEach(q=>{cx+=q[0]+(o.dx||0);cy+=q[1]+(o.dy||0);k++;}); cx/=k;cy/=k;
          const d=Math.hypot(cx-E[0],cy-E[1]); if(d<ahd){ahd=d;sideRef=[cx,cy];} }));
        if(!(sideRef && ahd<txtH*14)){                    // no arrowhead near: use arm side, then label side
          sideRef=null; let amd=1e9;
          arms.forEach(s=>{ const m=[(s.a[0]+s.b[0])/2,(s.a[1]+s.b[1])/2]; const d=Math.hypot(m[0]-E[0],m[1]-E[1]); if(d<amd){amd=d;sideRef=m;} });
          if(!(sideRef && amd<txtH*12)) sideRef=[lb.x,lb.y];
        }
        let n = vertical ? [ (sideRef[0]>=E[0]?1:-1), 0 ] : [ 0, (sideRef[1]>=E[1]?1:-1) ];
        const armLen=txtH*3.2, armEnd=[E[0]+n[0]*armLen, E[1]+n[1]*armLen];

        let armObj;
        if(arm && bd<txtH*10){ arm.p.pts=[[E[0]-(arm.o.dx||0),E[1]-(arm.o.dy||0)],[armEnd[0]-(arm.o.dx||0),armEnd[1]-(arm.o.dy||0)]]; arm.p._ansi=true; arm.p.dash=null; armObj=arm.o; }
        else { armObj=cut.o; armObj.prims.polys.push({pts:[[E[0]-(armObj.dx||0),E[1]-(armObj.dy||0)],[armEnd[0]-(armObj.dx||0),armEnd[1]-(armObj.dy||0)]],dash:null,_ansi:true}); }
        // fresh arrowhead at armEnd pointing OUTWARD (n); reuse nearest SOLID if present
        const hl=txtH*1.15, hw=txtH*0.42, perp=[-n[1],n[0]];

        let head=null,hd=1e9,hobj=null; pg.objects.forEach(o=>(o.prims.solids||[]).forEach(sd=>{ if(sd.length<3)return; let cx=0,cy=0; sd.forEach(q=>{cx+=q[0]+(o.dx||0);cy+=q[1]+(o.dy||0);}); cx/=sd.length; cy/=sd.length; const d=Math.hypot(cx-((E[0]+armEnd[0])/2),cy-((E[1]+armEnd[1])/2)); if(d<hd){hd=d;head=sd;hobj=o;} }));
        if(head && hd<txtH*6){ head.length=0; [apex,b1,b2].forEach(pt=>head.push([pt[0]-(hobj.dx||0),pt[1]-(hobj.dy||0)])); }
        else { (armObj.prims.solids||(armObj.prims.solids=[])).push([[apex[0]-(armObj.dx||0),apex[1]-(armObj.dy||0)],[b1[0]-(armObj.dx||0),b1[1]-(armObj.dy||0)],[b2[0]-(armObj.dx||0),b2[1]-(armObj.dy||0)]]); }

        for(let k=0;k<12;k++){ const cx=armEnd[0]+n[0]*gap, cy=armEnd[1]+n[1]*gap;

        sectionN++;

  }

  // snapDimLineEnds removed: it guessed which stub was the dimension line and, when
  // it guessed wrong, chopped the stub that runs outside the extension lines to carry
  // the value. That is why those lines vanished and a shortened leftover stayed behind.
  attachDimArrows(pg);                 // arrows become part of the dimension line
  placeDimensionText(pg, txtH);
  afterMutate();
  const parts=[]; if(radiusN)parts.push('รัศมี '+radiusN); if(sectionN)parts.push('sections '+sectionN);
  toast('STYLIZE → ANSI'+(parts.length?(' ('+parts.join(', ')+')'):'')+' · ปรับtexts '+textN+' ตาม Format Config'
    + ((!f.ansiRadius&&!f.ansiSection)?' — เปิดสวิตช์ ANSI ใน Format Config ก่อน':''));
}

/* ---- inline editing of imported texts (dimension values, labels, ...) ---- */

/* ============================================================
   SELECTION / DRAG / MARQUEE / GROUP / ALIGN  (vector editing)
   ============================================================ */
let selIds=new Set();
let marquee=null;
let snapGuides=[];
const SNAP_PX=6;
function computeSnap(bb0, ddx, ddy){
  const out={ddx, ddy, guides:[]};
  if(!bb0) return out;
  const tol=SNAP_PX/Math.max(view.s,1e-6);                 // screen px -> world mm
  const mv={minx:bb0.minx+ddx, miny:bb0.miny+ddy, maxx:bb0.maxx+ddx, maxy:bb0.maxy+ddy};
  const mcx=(mv.minx+mv.maxx)/2, mcy=(mv.miny+mv.maxy)/2;
  // static targets = every object NOT in the selection, plus the page/drawing-area centre
  const {W,H}=paperDims(); const m=store.format.margin;
  const targets=[];
  (activePage().objects||[]).forEach(o=>{ if(selIds.has(o.id))return; const bb=objBBox(o); if(bb) targets.push(bb); });
  const pageCx=W/2, pageCy=m+TB_H+(H-2*m-TB_H)/2;
  // ----- X snapping (vertical guides) -----
  const mXs=[['min',mv.minx],['c',mcx],['max',mv.maxx]];
  let bestX=null;
  const considerX=(sx, tb)=>{ mXs.forEach(([k,mx])=>{ const d=sx-mx; if(Math.abs(d)<=tol && (!bestX||Math.abs(d)<Math.abs(bestX.d))) bestX={d, x:sx, tb}; }); };
  targets.forEach(tb=>{ [tb.minx,(tb.minx+tb.maxx)/2,tb.maxx].forEach(sx=>considerX(sx,tb)); });
  considerX(pageCx,{miny:m,maxy:H-m,page:true});
  if(bestX){ out.ddx+=bestX.d; }
  // ----- Y snapping (horizontal guides) -----
  const mv2={miny:bb0.miny+out.ddy, maxy:bb0.maxy+out.ddy}; const mcy2=(mv2.miny+mv2.maxy)/2;
  const mYs=[['min',mv2.miny],['c',mcy2],['max',mv2.maxy]];
  let bestY=null;
  const considerY=(sy, tb)=>{ mYs.forEach(([k,my])=>{ const d=sy-my; if(Math.abs(d)<=tol && (!bestY||Math.abs(d)<Math.abs(bestY.d))) bestY={d, y:sy, tb}; }); };
  targets.forEach(tb=>{ [tb.miny,(tb.miny+tb.maxy)/2,tb.maxy].forEach(sy=>considerY(sy,tb)); });
  considerY(pageCy,{minx:m,maxx:W-m,page:true});
  if(bestY){ out.ddy+=bestY.d; }
  // ----- build guide segments (span moving bbox + target) -----
  const fmv={minx:bb0.minx+out.ddx, miny:bb0.miny+out.ddy, maxx:bb0.maxx+out.ddx, maxy:bb0.maxy+out.ddy};
  if(bestX){ const tb=bestX.tb; const y0=Math.min(fmv.miny, tb.miny!=null?tb.miny:fmv.miny), y1=Math.max(fmv.maxy, tb.maxy!=null?tb.maxy:fmv.maxy);
    out.guides.push({x0:bestX.x, y0, x1:bestX.x, y1}); }
  if(bestY){ const tb=bestY.tb; const x0=Math.min(fmv.minx, tb.minx!=null?tb.minx:fmv.minx), x1=Math.max(fmv.maxx, tb.maxx!=null?tb.maxx:fmv.maxx);
    out.guides.push({x0, y0:bestY.y, x1, y1:bestY.y}); }
  return out;
}
function drawSnapGuides(){
  if(!snapGuides.length) return;
  ctx.save(); ctx.strokeStyle='#e0348b'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  snapGuides.forEach(g=>{ const a=W2S(g.x0,g.y0), b=W2S(g.x1,g.y1);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); });
  ctx.restore();
}
let objDrag=null;

function selectableObjs(){ const pg=activePage(); return (pg&&pg.type==='sheet'&&pg.objects)?pg.objects:[]; }
function objById(id){ return selectableObjs().find(o=>o.id===id); }
function expandGroup(ids){
  const objs=selectableObjs(); const groups=new Set();
  ids.forEach(id=>{ const o=objById(id); if(o&&o.group) groups.add(o.group); });
  const out=new Set(ids);
  objs.forEach(o=>{ if(o.group&&groups.has(o.group)) out.add(o.id); });
  return out;
}
function selectionBBox(){
  let a=1e9,b=1e9,c=-1e9,d=-1e9,any=false;
  selIds.forEach(id=>{ const o=objById(id); if(!o)return; const bb=objBBox(o); if(bb){any=true;
    if(bb.minx<a)a=bb.minx; if(bb.miny<b)b=bb.miny; if(bb.maxx>c)c=bb.maxx; if(bb.maxy>d)d=bb.maxy; } });
  return any?{minx:a,miny:b,maxx:c,maxy:d}:null;
}
function objHit(ob,wx,wy,tolW){
  const P=ob.prims, dx=ob.dx||0, dy=ob.dy||0; const x=wx-dx, y=wy-dy;
  const near=(ax,ay,bx,by)=>{ const dxl=bx-ax,dyl=by-ay,L2=dxl*dxl+dyl*dyl; let t=L2?((x-ax)*dxl+(y-ay)*dyl)/L2:0; t=Math.max(0,Math.min(1,t));
    const px=ax+t*dxl, py=ay+t*dyl; return Math.hypot(x-px,y-py)<=tolW; };
  for(const p of (P.polys||[])){ for(let i=1;i<p.pts.length;i++){ if(near(p.pts[i-1][0],p.pts[i-1][1],p.pts[i][0],p.pts[i][1])) return true; } }
  for(const sd of (P.solids||[])){ let inside=false; for(let i=0,j=sd.length-1;i<sd.length;j=i++){ const xi=sd[i][0],yi=sd[i][1],xj=sd[j][0],yj=sd[j][1];
      if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi)) inside=!inside; } if(inside) return true; }
  for(const h of (P.hatches||[])){ for(const L of h.loops){ for(let i=1;i<L.length;i++){ if(near(L[i-1][0],L[i-1][1],L[i][0],L[i][1])) return true; } } }
  for(const t of (P.texts||[])){ const hh=t.h||2.5; if(x>=t.x-hh*0.5 && x<=t.x+hh*8 && y>=t.y-hh*0.2 && y<=t.y+hh*1.1) return true; }
  for(const m of (P.marks||[])){ if(Math.hypot(x-m[0],y-m[1])<=tolW+1) return true; }
  for(const c of (P.clines||[])){ if(Math.abs((x-c.x)*(-c.dy)+(y-c.y)*(c.dx))/(Math.hypot(c.dx,c.dy)||1) <= tolW) return true; }

}
function objAtPoint(wx,wy){
  const objs=selectableObjs(); const tolW=6/view.s;
  for(let i=objs.length-1;i>=0;i--){ if(objHit(objs[i],wx,wy,tolW)) return objs[i]; }
  return null;
}
function objsInRect(x0,y0,x1,y1){
  const a=Math.min(x0,x1),b=Math.min(y0,y1),c=Math.max(x0,x1),d=Math.max(y0,y1);
  return selectableObjs().filter(o=>{ const bb=objBBox(o); return bb && bb.minx>=a && bb.maxx<=c && bb.miny>=b && bb.maxy<=d; });
}
function setSelection(ids){ selIds=expandGroup(new Set(ids)); updateSelToolbar(); render(); }
function clearSelection(){ selIds=new Set(); marquee=null; updateSelToolbar(); render(); }

/* ============================================================================
   §6.3 STRETCHABLE PROJECTION LINES
   A dimension's extension lines run from the measured feature out past the
   dimension line. Only that overhang is cosmetic, so the handle drags the OUTER
   end along the extension line's own direction: the anchor that touches the part
   never moves and the measured value never changes.
   ========================================================================== */
const DIM_HANDLE_PX=5;
function dimPartsOf(pg, dimId){
  const lines=[], texts=[];
  (pg.objects||[]).forEach(o=>{
    (o.prims.polys||[]).forEach(p=>{ if(p._dim===dimId && p.pts.length>=2) lines.push({o,p}); });
    (o.prims.texts||[]).forEach(t=>{ if(t._dim===dimId) texts.push({o,t}); });
  });
  return {lines, texts};
}
function selectedDimId(){                       // the single dimension currently selected
  let id=null;
  for(const sid of selIds){ const o=objById(sid); if(!o) continue;
    const d=o._dim || (o.prims.polys[0]&&o.prims.polys[0]._dim) || (o.prims.texts[0]&&o.prims.texts[0]._dim);
    if(!d) return null;
    if(id===null) id=d; else if(id!==d) return null; }
  return id;
}
/* Work out which segment is the dimension line and which are extension lines. */
function dimAnalyse(pg, dimId){
  const {lines, texts}=dimPartsOf(pg, dimId);
  if(!lines.length) return null;
  const abs=(o,pt)=>[pt[0]+(o.dx||0), pt[1]+(o.dy||0)];
  const segs=lines.map(({o,p})=>{
    const a=abs(o,p.pts[0]), b=abs(o,p.pts[p.pts.length-1]);
    const dx=b[0]-a[0], dy=b[1]-a[1];
    return {o,p,a,b,len:Math.hypot(dx,dy), vert:Math.abs(dy)>Math.abs(dx)};
  }).filter(s=>s.len>1e-6);
  if(!segs.length) return null;
  const t=texts[0]&&texts[0].t;
  const rot=t? ((t.rot||0)%180+180)%180 : 0;
  const wantVert=Math.abs(rot-90)<30;
  let dim=null;                                  // dimension line: longest along the text axis
  segs.forEach(s=>{ if(s.vert!==wantVert) return; if(!dim||s.len>dim.len) dim=s; });
  if(!dim) return null;
  // Every stub lying on that same axis is part of the SAME dimension line. Dragging
  // has to carry all of them; moving only one left the rest behind.
  const dl=dim.len||1, ux=(dim.b[0]-dim.a[0])/dl, uy=(dim.b[1]-dim.a[1])/dl;
  const dimAll=segs.filter(s=>{
    if(s===dim) return true;
    const L=s.len||1, vx=(s.b[0]-s.a[0])/L, vy=(s.b[1]-s.a[1])/L;
    if(Math.abs(vx*ux+vy*uy)<0.98) return false;
    const px=s.a[0]-dim.a[0], py=s.a[1]-dim.a[1];
    return Math.abs(-px*uy+py*ux)<0.35;
  });
  const ext=segs.filter(s=>!dimAll.includes(s) && s.vert!==dim.vert);
  return {dim, dimAll, ext, texts};
}
/* Handles = the outer end of each extension line (the end nearest the dimension
   line, i.e. the overhang side). */
function dimHandles(pg){
  const id=selectedDimId(); if(!id) return [];
  const an=dimAnalyse(pg, id); if(!an) return [];
  const dmid=[(an.dim.a[0]+an.dim.b[0])/2, (an.dim.a[1]+an.dim.b[1])/2];
  // unit vector along the dimension line
  const ddx=an.dim.b[0]-an.dim.a[0], ddy=an.dim.b[1]-an.dim.a[1];
  const dl=Math.hypot(ddx,ddy)||1; const ux=ddx/dl, uy=ddy/dl;
  const out=[];
  // endpoints of the dimension line itself: dragging these changes its length and the
  // arrowheads follow, because they are drawn from these very points.
  // One grip per side of the dimension: dragging it stretches EVERY part of the
  // dimension together (both extension lines and the dimension line), instead of
  // making the user adjust each line on its own.
  const dm=[(an.dim.a[0]+an.dim.b[0])/2, (an.dim.a[1]+an.dim.b[1])/2];
  const nrm=[-uy, ux];
  out.push({dimId:id, kind:'group', an, n:nrm, at:dm});
  return out;
}
function drawDimHandles(){
  const pg=activePage(); if(!pg||pg.type!=='sheet') return;
  const hs=dimHandles(pg); if(!hs.length) return;
  ctx.save(); ctx.setLineDash([]);
  hs.forEach(h=>{ const p=h.at||h.outer; const q=W2S(p[0], p[1]);
    ctx.fillStyle='#fff'; ctx.strokeStyle='#0077ff'; ctx.lineWidth=1.5;
    ctx.fillRect(q.x-DIM_HANDLE_PX, q.y-DIM_HANDLE_PX, DIM_HANDLE_PX*2, DIM_HANDLE_PX*2);
    ctx.strokeRect(q.x-DIM_HANDLE_PX, q.y-DIM_HANDLE_PX, DIM_HANDLE_PX*2, DIM_HANDLE_PX*2); });
  ctx.restore();
}
function dimHandleAt(wx,wy){
  const pg=activePage(); if(!pg||pg.type!=='sheet') return null;
  const tol=(DIM_HANDLE_PX+3)/Math.max(view.s,1e-6);
  const hs=dimHandles(pg);
  for(const h of hs){ const p=h.at||h.outer; if(Math.hypot(p[0]-wx, p[1]-wy)<=tol) return h; }
  return null;
}
let dimDrag=null;
function beginDimDrag(h){
  snapshot();
  const dx=h.outer[0]-h.anchor[0], dy=h.outer[1]-h.anchor[1];
  const L=Math.hypot(dx,dy)||1;
  dimDrag={ h, ux:dx/L, uy:dy/L, anchor:h.anchor.slice(), moved:false };
}
function updateDimDrag(wx,wy){
  if(!dimDrag) return;
  const {h,ux,uy,anchor}=dimDrag;
  // project the cursor onto the extension line so it can only get longer/shorter
  let t=(wx-anchor[0])*ux + (wy-anchor[1])*uy;
  t=Math.max(0.5, t);                                     // never collapse past the anchor
  const nx=anchor[0]+ux*t, ny=anchor[1]+uy*t;
  const o=h.seg.o;
  h.seg.p.pts[h.outerIdx]=[nx-(o.dx||0), ny-(o.dy||0)];
  dimDrag.moved=true;
  render();
}
function endDimDrag(){
  if(!dimDrag) return;
  if(dimDrag.moved) afterMutate(); else { history.undo.pop(); updateUndoButtons(); }
  dimDrag=null;
}

/* ---- dragging the DIMENSION LINE itself ------------------------------------
   Moving a dimension away from the part must take its arrowheads with it and let
   the extension lines grow to keep reaching it — arrowheads are the ends of the
   dimension line, not separate objects the user has to chase. */
function dimSolidsOf(pg, dimId, an){
  // Arrowheads are plain filled triangles; rather than rely on a tag surviving
  // persistence, claim the ones sitting at this dimension line's own end points.
  const out=[];
  if(!an) an=dimAnalyse(pg,dimId);
  if(!an) return out;
  // Collect the ends of EVERY stub of this dimension line, not just the main one:
  // a tight dimension is split into pieces and its arrowheads sit on the pieces, so
  // looking only at the main stub left some arrows behind when the line was dragged.
  const ends=[];
  (an.dimAll||[an.dim]).forEach(s=>{ ends.push(s.a, s.b); });
  const tol=4;
  (pg.objects||[]).forEach(o=>(o.prims.solids||[]).forEach(sd=>{
    if(!sd||sd.length<3) return;
    let cx=0,cy=0; sd.forEach(p=>{cx+=p[0]+(o.dx||0); cy+=p[1]+(o.dy||0);});
    cx/=sd.length; cy/=sd.length;
    if(ends.some(E=>Math.hypot(cx-E[0], cy-E[1])<=tol)) out.push({o,sd});
  }));
  return out;
}
function dimLineAt(wx,wy){
  const pg=activePage(); if(!pg||pg.type!=='sheet') return null;
  const id=selectedDimId(); if(!id) return null;
  const an=dimAnalyse(pg,id); if(!an) return null;
  const {a,b}=an.dim;
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L;
  const vx=wx-a[0], vy=wy-a[1];
  const t=vx*ux+vy*uy;
  if(t<0||t>L) return null;                                // outside the segment
  const perp=Math.abs(-vx*uy+vy*ux);
  const tol=6/Math.max(view.s,1e-6);
  if(perp>tol) return null;
  return {dimId:id, an, n:[-uy,ux]};                       // n = perpendicular (offset direction)
}
function beginDimLineDrag(hit, wx, wy){
  const pg=activePage();
  snapshot();
  const an=hit.an;
  dimDrag={ mode:'line', dimId:hit.dimId, n:hit.n, start:[wx,wy], moved:false,
    dim:{seg:an.dim, pts:an.dim.p.pts.map(p=>p.slice())},
    dimAll:(an.dimAll||[an.dim]).map(s=>({seg:s, pts:s.p.pts.map(p=>p.slice())})),
    ext:an.ext.map(s=>({seg:s, pts:s.p.pts.map(p=>p.slice())})),
    solids:dimSolidsOf(pg,hit.dimId,an).map(x=>({...x, pts:x.sd.map(p=>p.slice())})),
    texts:dimPartsOf(pg,hit.dimId).texts.map(x=>({...x, x0:x.t.x, y0:x.t.y})) };
}
function updateDimLineDrag(wx,wy){
  if(!dimDrag||dimDrag.mode!=='line') return;
  const D=dimDrag;
  const d=(wx-D.start[0])*D.n[0] + (wy-D.start[1])*D.n[1];   // perpendicular travel only
  const mx=D.n[0]*d, my=D.n[1]*d;
  // dimension line slides across
  (D.dimAll||[D.dim]).forEach(S=>{ S.seg.p.pts.forEach((pt,i)=>{ pt[0]=S.pts[i][0]+mx; pt[1]=S.pts[i][1]+my; }); });
  // arrowheads are carried along - they ARE the ends of the dimension line
  D.solids.forEach(s=>{ s.sd.forEach((pt,i)=>{ pt[0]=s.pts[i][0]+mx; pt[1]=s.pts[i][1]+my; }); });
  // extension lines grow/shrink so they still meet the dimension line
  const dimN = (D.dim.pts[0][0]+(D.dim.seg.o.dx||0))*D.n[0] + (D.dim.pts[0][1]+(D.dim.seg.o.dy||0))*D.n[1];
  D.ext.forEach(E=>{
    const o=E.seg.o;
    const nOf=(i)=>(E.pts[i][0]+(o.dx||0))*D.n[0] + (E.pts[i][1]+(o.dy||0))*D.n[1];
    const last=E.seg.p.pts.length-1;
    // the end that must follow is the one already sitting at the dimension line
    const outerIdx = Math.abs(nOf(0)-dimN) <= Math.abs(nOf(last)-dimN) ? 0 : last;
    E.seg.p.pts.forEach((pt,i)=>{ pt[0]=E.pts[i][0]; pt[1]=E.pts[i][1]; });   // reset
    E.seg.p.pts[outerIdx][0]=E.pts[outerIdx][0]+mx;
    E.seg.p.pts[outerIdx][1]=E.pts[outerIdx][1]+my;
  });
  // the value rides along with its dimension line
  D.texts.forEach(T=>{ T.t.x=T.x0+mx; T.t.y=T.y0+my; });
  D.moved=true;
  render();
}
function dimStretchAt(wx,wy){
  const h=dimHandleAt(wx,wy);
  if(h && h.kind==='group') return {kind:'line', l:{dimId:h.dimId, an:h.an, n:h.n}};
  const l=dimLineAt(wx,wy);   if(l) return {kind:'line', l};
  return null;
}
/* ---- arrowheads that belong to the line itself ------------------------------ */
function drawLineArrows(p, TP){
  const A=p._arrow; if(!A) return;
  const n=p.pts.length; if(n<2) return;
  const size=(A.h||2.5);
  const tri=(tip, from)=>{
    const dx=tip[0]-from[0], dy=tip[1]-from[1], L=Math.hypot(dx,dy); if(L<1e-9) return;
    const ux=dx/L, uy=dy/L, px=-uy, py=ux;
    const b=[tip[0]-ux*size, tip[1]-uy*size];
    const w=size*0.32;
    const q0=TP(tip[0],tip[1]), q1=TP(b[0]+px*w, b[1]+py*w), q2=TP(b[0]-px*w, b[1]-py*w);
    ctx.save(); ctx.setLineDash([]); ctx.fillStyle=INK;
    ctx.beginPath(); ctx.moveTo(q0.x,q0.y); ctx.lineTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y); ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  if(A.s) tri(p.pts[0], p.pts[1]);
  if(A.e) tri(p.pts[n-1], p.pts[n-2]);
}
/* Convert a dimension's free-floating arrowhead SOLIDs into a property of its
   dimension line. Run once during STYLIZE: after this the arrows are defined by the
   line's start/end points, so any stretch keeps them attached and correctly aimed. */
/* The dimension line must terminate exactly ON its extension lines - a visible gap
   or overshoot there is a drafting error, so we snap the ends rather than let the
   user nudge them. */
function snapDimLineEnds(pg){
  const ids=[...new Set((pg.objects||[]).flatMap(o=>(o.prims.polys||[]).map(p=>p._dim)).filter(Boolean))];
  let n=0;
  ids.forEach(id=>{
    const an=dimAnalyse(pg,id); if(!an || an.ext.length<1) return;
    const seg=an.dim, o=seg.o, last=seg.p.pts.length-1;
    const ddx=seg.b[0]-seg.a[0], ddy=seg.b[1]-seg.a[1], L=Math.hypot(ddx,ddy)||1;
    const ux=ddx/L, uy=ddy/L;
    // parameter along the dimension line where each extension line crosses it
    const ts=[];
    an.ext.forEach(E=>{
      const ex=E.b[0]-E.a[0], ey=E.b[1]-E.a[1];
      const den=ux*ey - uy*ex;
      if(Math.abs(den)<1e-9) return;
      const t=((E.a[0]-seg.a[0])*ey - (E.a[1]-seg.a[1])*ex)/den;
      ts.push(t);
    });
    if(ts.length<2) return;
    ts.sort((a,b)=>a-b);
    const t0=ts[0], t1=ts[ts.length-1];
    seg.p.pts[0]   =[seg.a[0]+ux*t0-(o.dx||0), seg.a[1]+uy*t0-(o.dy||0)];
    seg.p.pts[last]=[seg.a[0]+ux*t1-(o.dx||0), seg.a[1]+uy*t1-(o.dy||0)];
    n++;
  });
  return n;
}
function attachDimArrows(pg){
  const dimIds=[...new Set((pg.objects||[]).flatMap(o=>(o.prims.polys||[]).map(p=>p._dim)).filter(Boolean))];
  let done=0;
  dimIds.forEach(id=>{
    const an=dimAnalyse(pg,id); if(!an) return;
    const line=an.dim.p;
    const found=dimSolidsOf(pg,id,an);
    if(!found.length && !line._arrow) return;
    // size taken from the real arrowhead so the drawing keeps its own proportions
    let size=2.5;
    if(found.length){ const sd=found[0].sd;
      let mx=0; for(let i=0;i<sd.length;i++) for(let j=i+1;j<sd.length;j++)
        mx=Math.max(mx, Math.hypot(sd[i][0]-sd[j][0], sd[i][1]-sd[j][1]));
      if(mx>0.2) size=mx; }
    line._arrow={s:true, e:true, h:size};
    // remove the now-redundant solids
    found.forEach(({o,sd})=>{ const i=o.prims.solids.indexOf(sd); if(i>=0) o.prims.solids.splice(i,1); });
    done++;
  });
  return done;
}

function alignSelection(mode){
  if(selIds.size<1) return;
  if(mode==='frame'){                                     // center the whole selection block in the page
    const sb=selectionBBox(); if(!sb) return; snapshot();
    const {W,H}=paperDims(); const m=store.format.margin;
    const fcx=W/2, fcy=m+TB_H+(H-2*m-TB_H)/2;             // drawing area centre (above title block)
    const dx=fcx-(sb.minx+sb.maxx)/2, dy=fcy-(sb.miny+sb.maxy)/2;
    selIds.forEach(id=>{ const o=objById(id); if(o){ o.dx+=dx; o.dy+=dy; } });
    afterMutate(); return;
  }
  // group selected objects into UNITS: a group = one unit, an ungrouped object = its own unit
  const units=new Map();
  selIds.forEach(id=>{ const o=objById(id); if(!o) return; const key=o.group||('single:'+id);
    if(!units.has(key)) units.set(key,[]); units.get(key).push(o); });
  const unitList=[...units.values()].map(objs=>{
    let a=1e9,b=1e9,c=-1e9,d=-1e9;
    objs.forEach(o=>{ const bb=objBBox(o); if(bb){ if(bb.minx<a)a=bb.minx; if(bb.miny<b)b=bb.miny; if(bb.maxx>c)c=bb.maxx; if(bb.maxy>d)d=bb.maxy; } });
    return {objs, bb:{minx:a,miny:b,maxx:c,maxy:d}};
  }).filter(u=>u.bb.minx<1e9);
  if(!unitList.length) return;
  snapshot();
  let ref;
  if(unitList.length>=2){                                  // align units to each other (overall bbox)
    let a=1e9,b=1e9,c=-1e9,d=-1e9;
    unitList.forEach(u=>{ a=Math.min(a,u.bb.minx); b=Math.min(b,u.bb.miny); c=Math.max(c,u.bb.maxx); d=Math.max(d,u.bb.maxy); });
    ref={minx:a,miny:b,maxx:c,maxy:d};
  } else {                                                 // single unit -> align to the page (inside margins)
    const {W,H}=paperDims(); const m=store.format.margin;
    ref={minx:m, miny:m, maxx:W-m, maxy:H-m};
  }
  unitList.forEach(u=>{ const bb=u.bb; let ddx=0,ddy=0;
    if(mode==='left')    ddx=ref.minx-bb.minx;
    if(mode==='right')   ddx=ref.maxx-bb.maxx;
    if(mode==='hcenter') ddx=(ref.minx+ref.maxx)/2-(bb.minx+bb.maxx)/2;
    if(mode==='top')     ddy=ref.maxy-bb.maxy;
    if(mode==='bottom')  ddy=ref.miny-bb.miny;
    if(mode==='vcenter') ddy=(ref.miny+ref.maxy)/2-(bb.miny+bb.maxy)/2;
    u.objs.forEach(o=>{ o.dx+=ddx; o.dy+=ddy; });          // move the whole unit together
  });
  afterMutate();
}

/* ---- line types (ISO/ANSI drawing conventions) --------------------------------
   Each style carries both a dash pattern and a relative weight, so switching a line
   from an object line to a centre line looks right without touching the geometry. */
const LINE_TYPES={
  object : {label:'Object line',  icon:'bi-slash-lg',      dash:null,            w:1.0,  _section:false},
  hidden : {label:'Hidden line',  icon:'bi-three-dots',    dash:[3,2],           w:0.7,  _section:false},
  center : {label:'Center line',  icon:'bi-dash-lg',       dash:[9,2,2,2],       w:0.55, _section:false},
  section: {label:'Section line', icon:'bi-scissors',      dash:[12,2,3,2,3,2],  w:1.4,  _section:true},
  phantom: {label:'Phantom line', icon:'bi-dash',          dash:[9,2,2,2,2,2],   w:0.7,  _section:false},
};
function lineTypeOf(p){
  if(p._ltype) return p._ltype;
  if(p._section) return 'section';
  const d=p.dash;
  if(!d) return 'object';
  const k=d.join(',');
  if(k==='3,2') return 'hidden';
  if(k==='9,2,2,2') return 'center';
  if(k==='9,2,2,2,2,2') return 'phantom';
  return 'object';
}
function selectionLineType(){                     // shared type across the selection, else null
  let t=null;
  for(const id of selIds){ const o=objById(id); if(!o) continue;
    for(const p of (o.prims.polys||[])){ const k=lineTypeOf(p);
      if(t===null) t=k; else if(t!==k) return null; } }
  return t;
}
function applyLineType(kind){
  const def=LINE_TYPES[kind]; if(!def) return;
  if(!selIds.size){ toast('select something first'); return; }
  snapshot();
  let n=0;
  selIds.forEach(id=>{ const o=objById(id); if(!o) return;
    (o.prims.polys||[]).forEach(p=>{
      p._ltype=kind; p.dash=def.dash? def.dash.slice() : null;
      p._lw=def.w; p._section=def._section; n++; });
  });
  afterMutate();
  toast('now '+def.label+' ('+n+' strokes)');
}

    if(wx>=b.x&&wx<=b.x+b.w&&wy>=b.y&&wy<=b.y+b.h) return b; }

function commitZone(key,val){
  snapshot();
  const pg=activePage();
  if(key==='project' && pg.type==='description'){
    /* Description page keeps its OWN project name once edited here:
       it syncs FROM the global name until the user overrides it, and an
       edit here never propagates back to the navbar / cover / title block.
       Clearing the field returns the page to auto-sync.                    */
    if(val.trim()===''){ pg.desc.override=false; pg.desc.project=''; }
    else { pg.desc.override=true; pg.desc.project=val; }
  }
  else if(key==='project') store.name=val;
  else if(key==='docType') store.format.docType=val;
  else if(key==='company') store.format.company=val;
  else if(key==='body'||key==='descBody'){ const pg=activePage(); if(pg.desc) pg.desc.body=val; }
  else if(/^lg\d$/.test(key)){ const pg=activePage(); if(pg.desc&&pg.desc.legend) pg.desc.legend[+key.slice(2)]=val; }
  afterMutate();
}

function bindFormat(){
  const f=fmtDraft;
  const on=(id,ev,fn)=>{ const e=$('#'+id); if(e) e.addEventListener(ev,fn); };
  on('fPaper','change',e=>{ f.paper=e.target.value; updateFormatPreviews(); });
  on('fMargin','input',e=>{ f.margin=Math.max(0,+e.target.value||0); updateFormatPreviews(); });
  on('fFont','change',e=>{ f.font=e.target.value; updateFormatPreviews(); });
  on('fSize','input',e=>{ f.fontSize=+e.target.value||20; updateFormatPreviews(); });
  on('fDec','change',e=>{ f.decimals=+e.target.value; updateFormatPreviews(); });
  on('fStrokeRange','input',e=>{ f.stroke=+e.target.value; updateFormatPreviews(); });
  on('fAnsiR','click',e=>{ f.ansiRadius=!f.ansiRadius; e.currentTarget.classList.toggle('on',f.ansiRadius); });
  on('fAnsiS','click',e=>{ f.ansiSection=!f.ansiSection; e.currentTarget.classList.toggle('on',f.ansiSection); });
  on('fVersion','input',e=>{ f.version=e.target.value; updateFormatPreviews(); });
  on('fProject','input',e=>{ f.__project=e.target.value; updateFormatPreviews(); });
  on('fTitle','input',e=>{ f.title=e.target.value; updateFormatPreviews(); });
  const sc=()=>{ f.scale=($('#fScale1').value||'1')+':'+($('#fScale2').value||'1'); updateFormatPreviews(); };
  on('fScale1','input',sc); on('fScale2','input',sc);
  document.querySelectorAll('#formatView [data-ap]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const k=inp.dataset.ap, fld=inp.dataset.fld;
      if(!f.approvals[k]) f.approvals[k]={name:'',date:''};
      if(fld==='name') f.approvals[k].name=inp.value;
      else{
        const row=document.querySelectorAll(`#formatView [data-ap="${k}"]`);
        const get=n=>{ const el=[...row].find(x=>x.dataset.fld===n); return el?el.value:''; };
        f.approvals[k].date=joinDate(get('y'),get('m'),get('d'));
      }
      updateFormatPreviews();
    });
  });
  on('fCancel','click',()=>closeFormat(false));
  on('fSave','click',()=>closeFormat(true));
}

function updateFormatPreviews(){
  const f=fmtDraft; if(!f) return;
  const tp=$('#typoPrev');
  if(tp){ tp.style.fontFamily=f.font+',Arial'; tp.style.fontSize=Math.max(10,f.fontSize*1.15)+'px';
    const d=f.decimals;
    tp.innerHTML='&#216; '+fmtNum(24.5,d)+' &middot; A-A &middot; M8&times;'+fmtNum(1.25,d); }
  const st2=$('#strokePrevTxt'); if(st2) st2.textContent=fmtNum(f.stroke,f.decimals)+' mm';
  const sv=$('#fStrokeVal'); if(sv) sv.textContent=(+f.stroke).toFixed(2).replace(/0$/,'')+'mm';
  const ln=$('#strokePrevLine'); if(ln) ln.style.height=Math.max(1,f.stroke*12)+'px';
  const st=$('#strokePrevTxt'); if(st) st.style.fontFamily=f.font+',Arial';
  drawTBPreview();
}

/* live title-block preview — drawn with the very same renderer as the sheet */
function drawTBPreview(){
  const cvs=$('#tbPrev'); if(!cvs||!fmtDraft) return;
  const wcss=cvs.clientWidth||1299, dpr=window.devicePixelRatio||1;
  const s=(wcss-2)/TB_W, hcss=Math.round(TB_H*s+2);
  cvs.width=Math.round(wcss*dpr); cvs.height=Math.round(hcss*dpr);
  cvs.style.height=hcss+'px';
  const c=cvs.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle='#fff'; c.fillRect(0,0,wcss,hcss);
  const oCtx=ctx, oView=view, oFmt=store.format, oName=store.name;
  ctx=c; store.format=fmtDraft; store.name=(fmtDraft.__project!=null?fmtDraft.__project:store.name)||'PROJECT';
  const r=tbRect();
  view={s:s, tx:1-r.x*s, ty:1+(r.y+TB_H)*s, zoom:1, dpr:1};
  try{ drawTitleBlock({type:'sheet',title:{title:fmtDraft.title||'',partNo:'',version:'',drawingNo:'',scale:'',material:'',finish:'',color:''}}); }
  catch(e){ console.error(e); }
  ctx=oCtx; view=oView; store.format=oFmt; store.name=oName;
}


/* ---- Import flow: pick a real .dxf and hand it to loadDXFText ---- */
function importDXF(){
  const pg=activePage();
  if(!pg||pg.type!=='sheet'){ toast('open a sheet page first, then import'); return; }
  const inp=$('#fileInput'); inp.value='';
  inp.onchange=()=>{ const file=inp.files&&inp.files[0]; if(!file) return;
    if(!/\.dxf$/i.test(file.name)){ toast('only .dxf files can be opened'); return; }
    const rd=new FileReader();
    rd.onload=()=>{ try{ loadDXFText(rd.result, file.name); }
      catch(err){ console.error(err); toast('could not read the DXF: '+err.message); } };
    rd.readAsText(file);
  };
  inp.click();
}

function renderDashboard(){
  const g=$('#projGrid'); g.innerHTML='';
  if(!DB.length){ const e=el('div','dash-empty'); e.textContent='No projects yet. Click “Create New” to start.'; g.appendChild(e); return; }
  const list=[...DB].sort((a,b)=>(b.updated||0)-(a.updated||0));   // newest-edited first
  list.forEach(p=>{
    const sheets=p.pages.filter(x=>x.type==='sheet').length;
    const c=el('div','proj-card');
    c.innerHTML=`<div class="pc-top"><i class="bi bi-file-earmark-text pc-icon"></i><span class="pc-size">${p.format.paper}</span></div>
      <div class="pc-title">${escapeHtml(p.name)}</div>
      <div class="pc-meta">
        <div class="row"><i class="bi bi-clock"></i> ${fmtDate(p.updated)}</div>
        <div class="row">${sheets} Sheet${sheets!==1?'s':''}</div>
      </div>
      <span class="pc-del" title="delete project"><i class="bi bi-trash"></i></span>`;
    c.onclick=()=>openProject(p.id);
    const del=c.querySelector('.pc-del');
    del.addEventListener('click',e=>{ e.stopPropagation(); deleteProject(p.id); });
    g.appendChild(c);
  });
}
function deleteProject(id){
  const p=DB.find(x=>x.id===id); if(!p) return;
  if(!confirm('Delete the project "'+p.name+'" ?\nThis cannot be undone')) return;
  const i=DB.findIndex(x=>x.id===id); if(i>=0) DB.splice(i,1);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(_){}
  renderDashboard();
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function createProject(){
  const p=newProject('Project '+(DB.length+1)); p.activeId=p.pages[0].id;
  DB.push(p); persist(); openProject(p.id);
}
function openProject(id){
  store=DB.find(p=>p.id===id); if(!store) return;
  if(!store.activeId) store.activeId=store.pages[0].id;
  history={undo:[],redo:[]};
  $('#dashboard').classList.add('hide'); $('#editor').classList.remove('hide'); $('#formatView').classList.add('hide');
  syncNavName(); renderSidebar();
  requestAnimationFrame(()=>{ resizeCanvas(); fitView(); updateUndoButtons(); });
}
function formatOpen(){ return !$('#formatView').classList.contains('hide'); }
function goBack(){ if(formatOpen()){ closeFormat(false); return; } goDashboard(); }
function goDashboard(){ persist(); $('#editor').classList.add('hide'); $('#formatView').classList.add('hide');
  $('#dashboard').classList.remove('hide'); renderDashboard(); }

/* ============================================================
   SIDEBAR (pages list)
   ============================================================ */
const PAGE_ICON={cover:'bi-book',description:'bi-text-left',sheet:'bi-layers'};
function renderSidebar(){
  const list=$('#pageList'); list.innerHTML='';
  store.pages.forEach(p=>{
    const it=el('div','page-item'+(p.id===store.activeId?' active':''));
    it.dataset.id=p.id;
    it.draggable = (p.type==='sheet');                     // only sheets reorder (Cover/Description fixed)
    it.innerHTML=`<span class="pico"><i class="bi ${PAGE_ICON[p.type]||'bi-file'}"></i></span><span class="pname">${escapeHtml(p.name)}</span>`;
    it.onclick=()=>{ if(!it._dragging && !it._editing) setActive(p.id); };
    // manual double-click detection (native dblclick is unreliable on draggable rows).
    // keyed by page id so it survives the re-render that the first click triggers.
    it.querySelector('.pname').addEventListener('click',e=>{
      const now=Date.now();
      if(_pnClick.id===p.id && now-_pnClick.t<450){ e.stopPropagation(); _pnClick={id:null,t:0};
        const cur=[...$('#pageList').children].find(c=>c.dataset.id===p.id) || it;
        startRenamePage(cur, p);
      } else { _pnClick={id:p.id, t:now}; }   // first click still bubbles -> activates the page
    });
    if(p.type==='sheet'){ bindDrag(it,p);
      const del=el('span','pdel'); del.title='delete this page'; del.innerHTML='<i class="bi bi-trash"></i>';
      del.setAttribute('draggable','false');
      del.addEventListener('mousedown',e=>e.stopPropagation());
      del.addEventListener('click',e=>{ e.stopPropagation(); deleteSheet(p.id); });
      it.appendChild(del);
    }
    list.appendChild(it);
  });
}
let dragId=null;
let _pnClick={id:null,t:0};
function bindDrag(it,page){
  it.addEventListener('dragstart',e=>{ dragId=page.id; it._dragging=true; it.classList.add('dragging');
    e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',page.id);}catch(_){} });
  it.addEventListener('dragend',()=>{ it._dragging=false; it.classList.remove('dragging'); dragId=null;
    [...$('#pageList').children].forEach(c=>c.classList.remove('drop-above','drop-below')); });
  it.addEventListener('dragover',e=>{
    if(!dragId||dragId===page.id||page.type!=='sheet') return; e.preventDefault();
    const rect=it.getBoundingClientRect(); const below=(e.clientY-rect.top)>rect.height/2;
    it.classList.toggle('drop-below',below); it.classList.toggle('drop-above',!below);
  });
  it.addEventListener('dragleave',()=>{ it.classList.remove('drop-above','drop-below'); });
  it.addEventListener('drop',e=>{
    e.preventDefault(); if(!dragId||dragId===page.id) return;
    const rect=it.getBoundingClientRect(); const below=(e.clientY-rect.top)>rect.height/2;
    reorderSheet(dragId, page.id, below);
  });
}
function reorderSheet(fromId,toId,after){
  const pages=store.pages;
  const fi=pages.findIndex(p=>p.id===fromId); if(fi<0) return;
  snapshot();
  const [moved]=pages.splice(fi,1);
  let ti=pages.findIndex(p=>p.id===toId);
  if(after) ti+=1;
  pages.splice(ti,0,moved);
  afterMutate();                                           // re-renders sidebar + sheet (numbering follows)
}
function deleteSheet(id){
  const p=store.pages.find(x=>x.id===id); if(!p||p.type!=='sheet') return;   // only sheets deletable
  const idx=store.pages.findIndex(x=>x.id===id); if(idx<0) return;
  snapshot();
  store.pages.splice(idx,1);
  if(store.activeId===id){                                                   // choose a sensible next page
    const next=store.pages[idx] || store.pages[idx-1] || store.pages[0];
    if(next) store.activeId=next.id;
  }
  afterMutate();                                                             // re-render sidebar+sheet, renumber, persist, undo
  toast('page deleted');
}
function startRenamePage(it,page){
  if(it._editing) return;
  it._editing=true; it.draggable=false;
  const span=it.querySelector('.pname');
  const inp=document.createElement('input');
  inp.className='pedit'; inp.value=page.name; inp.spellcheck=false;
  span.replaceWith(inp); inp.focus(); inp.select();
  const finish=(save)=>{
    if(it._done) return; it._done=true;
    const val=inp.value.trim();
    if(save && val && val!==page.name){ snapshot(); page.name=val; afterMutate(); }
    else renderSidebar();
  };
  inp.addEventListener('keydown',e=>{ e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); finish(true); }
    else if(e.key==='Escape'){ e.preventDefault(); finish(false); } });
  inp.addEventListener('blur',()=>finish(true));
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.addEventListener('dblclick',e=>e.stopPropagation());
}
function setActive(id){
  try{ setTimeout(updateImportBadge,0); }catch(_){} store.activeId=id; if(typeof clearSelection==='function'){ selIds=new Set(); marquee=null; updateSelToolbar(); if(typeof hideCtxMenu==='function')hideCtxMenu(); } renderSidebar(); render(); persist(); }
function addPage(){ snapshot(); const n=store.pages.filter(p=>p.type==='sheet').length+1;
  const s=mkSheet('Sheet '+String(n).padStart(2,'0')); store.pages.push(s); store.activeId=s.id; afterMutate(); }

/* ============================================================
   INTERACTION (pan / zoom / coord) — selection in module 2
   ============================================================ */
let panning=false, panStart=null;
function bindStage(){
  stage.addEventListener('mousedown',e=>{
    if(e.button===1){ panning=true; panStart={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty}; e.preventDefault(); return; } // middle = pan
    if(e.button!==0 || editor) return;
    const pg=activePage(); if(!pg||pg.type!=='sheet') return;
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    const tb=tbRect(); if(w.x>=tb.x&&w.x<=tb.x+TB_W&&w.y>=tb.y&&w.y<=tb.y+TB_H) return;  // title block handled by dblclick
    { const dhit=dimStretchAt(w.x,w.y);              // stretch a dimension
      if(dhit){ if(dhit.kind==='end') beginDimDrag(dhit.h);
                else beginDimLineDrag(dhit.l, w.x, w.y);
                e.preventDefault(); return; } }
    const rh=bomResizeHit(pg, w.x, w.y);              // BOM width / column resize
    if(rh){ const b=pg.bom; snapshot();
      bomDrag={ ...rh, startX:w.x, colW0:JSON.parse(JSON.stringify(b.colW)), moved:false }; e.preventDefault(); return; }
    if(pg.bom){ const bb=bomBounds(pg);               // drag inside the table = move it
      if(bb && w.x>=bb.x && w.x<=bb.x+bb.w && w.y<=bb.y && w.y>=bb.y-bb.h){ snapshot();
        bomDrag={ type:'move', startX:w.x, startY:w.y, x0:pg.bom.x, y0:pg.bom.y, moved:false }; e.preventDefault(); return; } }
    const additive=(e.shiftKey||e.ctrlKey||e.metaKey);      // Shift or Ctrl/Cmd add to the selection
    const hit=objAtPoint(w.x,w.y);
    if(hit){
      const ids=expandGroup(new Set([hit.id]));
      if(additive){                                         // toggle this object in/out of the selection
        const inSel=[...ids].every(id=>selIds.has(id));
        if(inSel) ids.forEach(id=>selIds.delete(id)); else ids.forEach(id=>selIds.add(id));
        selIds=expandGroup(selIds); updateSelToolbar();
      } else if(!selIds.has(hit.id)){ selIds=ids; updateSelToolbar(); }
      if(selIds.size && selIds.has(hit.id)){                // begin dragging the current selection
        snapshot();
        const orig=new Map(); selIds.forEach(id=>{ const o=objById(id); if(o) orig.set(id,{dx:o.dx,dy:o.dy}); });
        objDrag={ startW:w, orig, moved:false, bb0:selectionBBox() };
      }
      e.preventDefault();
    } else {
      if(e.shiftKey){ panning=true; panStart={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty}; e.preventDefault(); return; } // shift+empty = pan
      if(!(e.ctrlKey||e.metaKey)) { selIds=new Set(); updateSelToolbar(); }   // Ctrl keeps existing (additive marquee)
      marquee={ x0:w.x, y0:w.y, x1:w.x, y1:w.y }; e.preventDefault();
    }
    render();
  });
  window.addEventListener('mousemove',e=>{
    if(panning){ view.tx=panStart.tx+(e.clientX-panStart.x); view.ty=panStart.ty+(e.clientY-panStart.y); render(); }
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    const h=$('#coordHud'); if(h) h.textContent=`${w.x.toFixed(1)}, ${w.y.toFixed(1)} mm`;
    if(dimDrag){ if(dimDrag.mode==='line') updateDimLineDrag(w.x,w.y); else updateDimDrag(w.x,w.y); return; }
    if(bomDrag){ const pg=activePage(); const b=pg&&pg.bom; if(b){
      if(bomDrag.type==='move'){ const dx=w.x-bomDrag.startX, dy=w.y-bomDrag.startY;
        if(Math.abs(dx)+Math.abs(dy)>0.001) bomDrag.moved=true; b.x=bomDrag.x0+dx; b.y=bomDrag.y0+dy; render(); return; }
      const dx=w.x-bomDrag.startX;
      if(Math.abs(dx)>0.001) bomDrag.moved=true;
      if(bomDrag.type==='col'){ b.colW[bomDrag.key]=Math.max(BOM_MINCOL, bomDrag.colW0[bomDrag.key]+dx); }
      else { const vis=bomVisible(b); const tot0=vis.reduce((s,d)=>s+(bomDrag.colW0[d.key]||d.w),0);
        const sc=Math.max(0.3,(tot0+dx)/tot0); vis.forEach(d=>{ b.colW[d.key]=Math.max(BOM_MINCOL,(bomDrag.colW0[d.key]||d.w)*sc); }); }
      render(); } return; }
    if(objDrag){ let ddx=w.x-objDrag.startW.x, ddy=w.y-objDrag.startW.y;
      if(Math.abs(ddx)+Math.abs(ddy)>0.001) objDrag.moved=true;
      const sn=computeSnap(objDrag.bb0, ddx, ddy);        // Illustrator-style smart snapping
      ddx=sn.ddx; ddy=sn.ddy; snapGuides=sn.guides;
      objDrag.orig.forEach((o0,id)=>{ const o=objById(id); if(o){ o.dx=o0.dx+ddx; o.dy=o0.dy+ddy; } });
      render(); }
    else if(marquee){ marquee.x1=w.x; marquee.y1=w.y; render(); }
  });
  window.addEventListener('mouseup',e=>{
    panning=false; snapGuides=[];
    if(dimDrag){ endDimDrag(); }
    if(bomDrag){ if(bomDrag.moved) afterMutate(); else { history.undo.pop(); updateUndoButtons(); } bomDrag=null; }
    if(objDrag){ if(objDrag.moved){ afterMutate(); }   // keep pre-move snapshot, persist new state
      else { history.undo.pop(); updateUndoButtons(); } // no movement -> discard spurious snapshot
      objDrag=null; }
    if(marquee){ const found=objsInRect(marquee.x0,marquee.y0,marquee.x1,marquee.y1);
      if(found.length){ const ids=new Set(selIds); found.forEach(o=>ids.add(o.id)); selIds=expandGroup(ids); }
      marquee=null; updateSelToolbar(); render(); }
  });
  stage.addEventListener('wheel',e=>{ e.preventDefault(); const r=stage.getBoundingClientRect();
    zoomBy(e.deltaY<0?1.1:0.9, e.clientX-r.left, e.clientY-r.top); }, {passive:false});
  stage.addEventListener('dblclick',e=>{
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    const pg=activePage();
    if(pg&&pg.type==='sheet'){ const tb=tbRect();
      if(w.x>=tb.x&&w.x<=tb.x+TB_W&&w.y>=tb.y&&w.y<=tb.y+TB_H){ openTitlePanel(); return; }
      const bb=bomBounds(pg); if(bb && w.x>=bb.x && w.x<=bb.x+bb.w && w.y<=bb.y && w.y>=bb.y-bb.h){ openBomPanel(); return; }
      const ht=textAtPoint(w.x,w.y); if(ht){ startTextEdit(ht.ob,ht.t); return; } }
    const z=zoneAt(w.x,w.y); if(z) startEdit(z);
  });
  stage.addEventListener('mousemove',e=>{
    if(editor) return;
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    const pg=activePage(); let overTB=false;
    if(pg&&pg.type==='sheet'){ const tb=tbRect(); overTB=(w.x>=tb.x&&w.x<=tb.x+TB_W&&w.y>=tb.y&&w.y<=tb.y+TB_H); }
    const dhit = pg&&pg.type==='sheet' ? dimStretchAt(w.x,w.y) : null;
    const dhz = dhit;
    const rhz = pg&&pg.type==='sheet' ? bomResizeHit(pg,w.x,w.y) : null;
    let overBom=false; if(pg&&pg.type==='sheet'&&pg.bom&&!rhz){ const bb=bomBounds(pg); overBom=!!(bb && w.x>=bb.x && w.x<=bb.x+bb.w && w.y<=bb.y && w.y>=bb.y-bb.h); }
    stage.style.cursor = dhz ? (dhit.kind==='end'?'crosshair':'move') : rhz ? 'ew-resize' : (overBom ? 'move' : (overTB ? 'pointer' : ((zoneAt(w.x,w.y)||(pg&&pg.type==='sheet'&&textAtPoint(w.x,w.y))) ? 'text' : (pg&&pg.type==='sheet'&&objAtPoint(w.x,w.y) ? 'move' : 'default'))));
  });
  stage.addEventListener('contextmenu',e=>{
    e.preventDefault();
    const pg=activePage(); if(!pg||pg.type!=='sheet'){ hideCtxMenu(); return; }
    const r=stage.getBoundingClientRect(); const w=S2W(e.clientX-r.left,e.clientY-r.top);
    const hit=objAtPoint(w.x,w.y);
    if(hit && !selIds.has(hit.id)){ selIds=expandGroup(new Set([hit.id])); updateSelToolbar(); render(); }
    if(!selIds.size){ hideCtxMenu(); return; }
    showCtxMenu(e.clientX, e.clientY);
  });
  window.addEventListener('mousedown',e=>{ const m=$('#ctxmenu'); if(m&&m.style.display==='block' && !m.contains(e.target)) hideCtxMenu(); });
  window.addEventListener('wheel',()=>hideCtxMenu(),{passive:true});
  window.addEventListener('resize',()=>{ if(!$('#editor').classList.contains('hide')){ resizeCanvas(); fitView(); } });
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  cv=$('#cv'); ctx=cv.getContext('2d'); stage=$('#stage');
  paintIcons(document); watchIcons();
  load(); renderDashboard();
  $('#btnCreate').onclick=createProject;
  $('#btnBack').onclick=goBack;
  $('#btnUndo').onclick=undo; $('#btnRedo').onclick=redo;
  $('#btnCollapse').onclick=()=>$('#sidebar').classList.toggle('collapsed');
  $('#btnAddPage').onclick=addPage;
  $('#zoomIn').onclick=()=>zoomBy(1.25); $('#zoomOut').onclick=()=>zoomBy(0.8); $('#zoomFit').onclick=fitView;
  $('#navName').addEventListener('input',e=>setProjectName(e.target.value));
  $('#btnRenameProj').onclick=()=>$('#navName').focus();
  // module-2 features (wired to no-op-safe stubs until implemented)
  $('#btnFormat').onclick=openFormat;
  $('#btnImport').onclick=importDXF;
  { const b=$('#btnStylize'); if(b) b.onclick=stylizeANSI; }                 // real DXF import (rpClose/rpSave handled by openTitlePanel)
  { const bt=$('#btnText'); if(bt) bt.onclick=addTextLabel; }
  { const bb=$('#btnBom'); if(bb) bb.onclick=addBOM; }
  { const be=$('#btnExport'); if(be) be.onclick=openExportMenu; }
  bindStage();
  window.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
    if(editor) return;
    const tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
    const pg=activePage(); const onSheet=pg&&pg.type==='sheet';
    if(!onSheet) return;
    if(e.key==='Escape'){ clearSelection(); hideCtxMenu(); }
    else if((e.key==='Delete'||e.key==='Backspace') && selIds.size){ e.preventDefault(); deleteSelection(); }
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='g'){ e.preventDefault(); e.shiftKey?ungroupSelection():groupSelection(); }
    else if(e.key.toLowerCase()==='g' && !e.ctrlKey && !e.metaKey){ e.preventDefault(); e.shiftKey?ungroupSelection():groupSelection(); }
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){ e.preventDefault(); selIds=new Set(selectableObjs().map(o=>o.id)); updateSelToolbar(); render(); }
    else if(selIds.size && e.key.startsWith('Arrow')){ e.preventDefault();
      const step=e.shiftKey?10:(e.altKey?0.1:1);
      let ddx=0,ddy=0; if(e.key==='ArrowLeft')ddx=-step; if(e.key==='ArrowRight')ddx=step; if(e.key==='ArrowUp')ddy=step; if(e.key==='ArrowDown')ddy=-step;
      snapshot(); selIds.forEach(id=>{ const o=objById(id); if(o){ o.dx+=ddx; o.dy+=ddy; } }); afterMutate();
    }
  });
}
function toast(msg){ const t=el('div','toast'); t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),250); },1800); }

/* expose */
window.App = { createProject, openProject, goDashboard, setActive, addPage, fitView, render,
               _state:()=>({store,view}) };
window.__hook = ()=>({ get store(){return store;}, render, App:window.App, fitView, createProject,
  loadDXFText, entitiesBBox, importDXF,
  objBBox, objsInRect, objAtPoint, selectionBBox, setSelection, clearSelection,
  groupSelection, ungroupSelection, alignSelection, deleteSelection, objById,
  get selIds(){return selIds;}, nudge:(dx,dy)=>{ selIds.forEach(id=>{const o=objById(id); if(o){o.dx+=dx;o.dy+=dy;}}); afterMutate(); },
  textAtPoint, startTextEdit, W2S:(x,y)=>W2S(x,y),
  computeSnap:(bb,dx,dy)=>computeSnap(bb,dx,dy), get snapGuides(){return snapGuides;},
  dimHandles:(pg)=>dimHandles(pg), beginDimDrag:(h)=>beginDimDrag(h),
  dimLineAt:(x,y)=>dimLineAt(x,y), beginDimLineDrag:(h,x,y)=>beginDimLineDrag(h,x,y),
  updateDimLineDrag:(x,y)=>updateDimLineDrag(x,y), dimAnalyse:(pg,id)=>dimAnalyse(pg,id),
  updateDimDrag:(x,y)=>updateDimDrag(x,y), endDimDrag:()=>endDimDrag(), bomBounds:(pg)=>bomBounds(pg), convertDXF_v2:(p,t)=>convertDXF_v2(p,t), exportDXF:()=>exportDXF(), captureSheet:(p)=>captureSheet(p), exportPDF:()=>exportPDF(), buildPDF:(im)=>buildPDF(im), renderPageCanvas:(p,d)=>renderPageCanvas(p,d),
  zoomRect(x1,y1,x2,y2){ const sw=stage.clientWidth,sh=stage.clientHeight,pad=60;
    const w=x2-x1,h=y2-y1; view.s=Math.min((sw-pad)/w,(sh-pad)/h);
    const cx=(x1+x2)/2, cy=(y1+y2)/2, c=W2S(cx,cy); view.tx+=sw/2-c.x; view.ty+=sh/2-c.y; render(); } });

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();

</script>
