<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drawing Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   DRAWING MASTER — fresh build (single file, vanilla)
   Theme tokens taken directly from the wireframes:
   black/white/grey chrome + green "Auto Save".
   ============================================================ */
:root{
  --bg:#eef1f7;            /* app background (blue-grey)            */
  --bar:#eef2f8;           /* top bars                             */
  --panel:#ffffff;         /* cards / panels                       */
  --panel2:#e6ecf5;        /* soft blue-grey buttons / chips off   */
  --panel3:#dbe3ef;        /* hover blue-grey                      */
  --ink:#0077ff;           /* PRIMARY (blue) for buttons & accents */
  --ink-d:#005fd1;         /* primary hover (darker blue)          */
  --line:#dfe5ef;          /* hairline borders                     */
  --line2:#ccd6e4;
  --txt:#141922;           /* primary text                         */
  --txt2:#374250;          /* secondary text (blue-grey)           */
  --muted:#7b8698;         /* muted labels (blue-grey)             */
  --muted2:#a1abbc;
  --stage:#e6ecf5;         /* canvas stage backdrop                */
  --good:#1a7f4b;          /* auto-save green text                 */
  --goodbg:#d6f3e2;        /* auto-save green bg                   */
  --sel:#0077ff;           /* primary blue selection               */
  --danger:#e23b3b;
  --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  --r:12px;                /* default radius                       */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:'Inter','Segoe UI',system-ui,-apple-system,'Sarabun',sans-serif;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
button{font-family:inherit}

/* ---------- generic dark / soft buttons (wireframe) ---------- */
.btn-dark{background:var(--ink);color:#fff;border:none;border-radius:10px;height:42px;padding:0 16px;
  font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn-dark:hover{background:var(--ink-d)}
.btn-soft{background:var(--panel2);color:var(--txt2);border:1px solid var(--line);border-radius:10px;height:42px;
  padding:0 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn-soft:hover{background:var(--panel3);color:var(--txt)}

/* ============================ DASHBOARD ============================ */
#dashboard{position:absolute;inset:0;overflow:auto;background:#fff}
.dash-top{display:flex;align-items:center;justify-content:space-between;height:118px;padding:0 64px;background:#eef1f7}
.dash-brand{display:flex;align-items:center;gap:15px}
.dash-brand .mark{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;
  place-items:center;font-size:19px;flex:none}
.dash-brand h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.2px}
.dash-actions{display:flex;align-items:center;gap:10px}
.dash-actions .btn-dark{height:44px;border-radius:10px;padding:0 18px;font-size:15px;font-weight:500}
.icon-circle{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;border:none;display:grid;
  place-items:center;cursor:pointer;font-size:17px;flex:none}
.icon-circle:hover{background:var(--ink-d)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:37px;padding:48px 64px}
.proj-card{background:#fff;border:1px solid #d9d9d9;border-radius:12px;padding:24px 26px 30px;cursor:pointer;
  transition:transform .14s,box-shadow .14s,border-color .14s}
.proj-card:hover{transform:translateY(-2px);border-color:#b9bec4;box-shadow:0 10px 26px rgba(0,0,0,.08)}
.proj-card{position:relative}
.proj-card .pc-del{position:absolute;bottom:12px;right:12px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted,#888);font-size:15px;opacity:0;cursor:pointer;transition:opacity .12s,background .12s,color .12s;background:transparent;z-index:2}
.proj-card:hover .pc-del{opacity:1}
.proj-card .pc-del:hover{background:rgba(220,60,50,.12);color:#c0392b}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between}
.pc-icon{font-size:27px;color:#111;line-height:1}
.pc-size{background:#eaeef5;color:#3d4248;font-size:14px;font-weight:500;padding:5px 12px;border-radius:8px}
.pc-title{font-size:24px;font-weight:700;margin:31px 0 14px;color:#111;letter-spacing:-.2px}
.pc-meta{display:flex;flex-direction:column;gap:10px;color:#8a8f96;font-size:15px}
.pc-meta .row{display:flex;align-items:center;gap:7px}
.dash-empty{padding:60px 64px;color:var(--muted);font-size:15px}

/* ============================ EDITOR ============================ */
#editor{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.navbar{display:flex;align-items:center;gap:0;height:125px;padding:0 64px;background:#eef1f7;flex:none}
.nav-round{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #dcdfe3;
  display:grid;place-items:center;cursor:pointer;color:#3d4248;font-size:18px;flex:none}
.nav-round:hover{border-color:var(--muted);color:var(--txt)}
.nav-ic{width:36px;height:36px;border-radius:9px;background:transparent;border:none;color:#1d1f23;
  display:inline-grid;place-items:center;cursor:pointer;font-size:20px}
#btnUndo{margin-left:16px}
.nav-ic:hover{background:var(--panel2)}
.nav-ic:disabled{opacity:.32;cursor:default}
.nav-name{background:#fff;border:1px solid #dcdfe3;color:#111;border-radius:12px;height:51px;margin-left:31px;
  padding:0 17px;font-weight:700;font-size:22px;min-width:127px;max-width:280px;outline:none}
.nav-pencil{color:#5b626a;cursor:pointer;font-size:19px;margin-left:7px;display:inline-flex}
.nav-pencil:hover{color:var(--txt)}
.badge-save{background:#c9f2d7;color:#166534;font-size:15px;font-weight:400;height:31px;padding:0 15px;
  margin-left:19px;border-radius:8px;display:inline-flex;align-items:center;white-space:nowrap}
.spacer{flex:1}
.navbar .btn-dark{height:40px;border-radius:10px;padding:0 16px;font-size:15px;font-weight:500;gap:7px}
.tool-sq{width:40px;height:40px;border-radius:10px;background:#dbe3ef;border:1px solid #cdd8e8;
  color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;font-size:19px;flex:none}
.tool-sq:hover{background:#cdd8e8;border-color:#bccbe0}
.tool-sq.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tool-pen{width:40px;height:40px;border-radius:10px;background:var(--ink);border:none;color:#fff;
  display:inline-grid;place-items:center;cursor:pointer;font-size:19px;flex:none}
.tool-pen:hover{background:var(--ink-d)}
.tool-group{display:inline-flex;gap:9px;margin:0 25px}

.body{flex:1;position:relative;display:flex;min-height:0;background:#fff}

/* ---------- left sidebar (floating card) ---------- */
.sidebar{position:absolute;left:64px;top:48px;width:242px;background:#fff;border:1px solid #e0e7f1;
  border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.07);display:flex;flex-direction:column;z-index:20;
  max-height:calc(100% - 96px);transition:width .15s}
.sidebar.collapsed{width:64px}
.sb-head{padding:18px 24px 12px;display:flex;align-items:center;justify-content:space-between}
.sb-head b{font-size:17px;font-weight:700}
.sb-head .ic{color:var(--muted);cursor:pointer;font-size:18px}
.sb-head .ic:hover{color:var(--txt)}
.sb-rule{height:1px;background:var(--line);margin:0 13px}
.sb-list{flex:1;overflow:auto;padding:9px 9px 2px}
.page-item{display:flex;align-items:center;gap:13px;height:46px;padding:0 14px;border-radius:10px;margin-bottom:2px;
  cursor:pointer;border:1px solid transparent;user-select:none;color:#1d1f23;font-size:16px;font-weight:400}
.page-item:hover{background:var(--panel2)}
.page-item.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.page-item .pico{width:18px;text-align:center;color:var(--muted);flex:none;font-size:16px}
.page-item.active .pico{color:#fff}
.page-item .pname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-item.dragging{opacity:.4}
.page-item.drop-above{box-shadow:inset 0 2px 0 var(--sel)}
.page-item.drop-below{box-shadow:inset 0 -2px 0 var(--sel)}
.page-item .pedit{width:100%;border:1px solid var(--sel);border-radius:6px;font-size:14px;padding:2px 6px;outline:none}
.page-item{position:relative}
.page-item .pdel{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:var(--muted);font-size:15px;opacity:0;cursor:pointer;transition:opacity .12s,background .12s,color .12s;background:transparent}
.page-item:hover .pdel{opacity:1}
.page-item .pdel:hover{background:rgba(192,57,43,.12);color:#c0392b}
.page-item.active .pdel{color:rgba(255,255,255,.85)}
.page-item.active .pdel:hover{background:rgba(255,255,255,.22);color:#fff}
.collapsed .page-item .pdel{display:none}
.sb-foot{padding:2px 9px 12px;display:flex;flex-direction:column;gap:8px}
.add-page{border:1.5px dashed #d6dade;background:transparent;color:#8b95a6;border-radius:10px;height:42px;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:400}
.sb-foot::before{content:"";height:1px;background:#e0e7f1;margin:2px 5px 4px}
.add-page:hover{border-color:var(--muted);color:var(--txt2)}
.fmt-btn{background:transparent;color:#1d1f23;border:none;border-radius:10px;height:44px;padding:0 14px;font-size:16px;
  cursor:pointer;display:flex;align-items:center;gap:13px;font-weight:400}
.fmt-btn:hover{background:var(--panel3)}
.fmt-btn .ic{color:var(--muted);font-size:16px}
.collapsed .pname,.collapsed .sb-head b,.collapsed .add-page span,.collapsed .fmt-btn span,.collapsed .sb-rule{display:none}
.collapsed .page-item,.collapsed .fmt-btn,.collapsed .add-page{justify-content:center}
.collapsed .sb-head{justify-content:center}

/* ---------- stage / canvas ---------- */
.stage{flex:1;position:relative;overflow:hidden}
.stage canvas{position:absolute;left:0;top:0}
.hud{position:absolute;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:11px;
  padding:7px 11px;font-size:12px;font-family:var(--mono);z-index:15;box-shadow:0 4px 16px rgba(0,0,0,.07);
  color:var(--txt2);display:flex;gap:9px;align-items:center}
.hud.zoom{left:18px;bottom:18px}
.hud.coord{right:18px;bottom:18px}
.hud button{background:none;border:none;color:var(--txt2);cursor:pointer;font-size:14px;padding:0 3px}
.hud button:hover{color:var(--txt)}
.align-bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:3px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:6px;
  box-shadow:0 6px 22px rgba(0,0,0,.10);z-index:15}
.align-bar button{width:38px;height:38px;border-radius:9px;background:transparent;border:none;color:var(--txt2);
  cursor:pointer;font-size:16px}
.align-bar button:hover{background:var(--panel2);color:var(--txt)}
.align-bar .sep{width:1px;height:22px;background:var(--line);margin:0 3px}

/* ---------- inline edit overlay ---------- */
.inline-edit{position:absolute;z-index:60;background:#fff;color:#000;border:2px solid var(--sel);border-radius:4px;
  padding:1px 4px;outline:none;font-family:Arial,sans-serif;line-height:1.15;box-shadow:0 6px 22px rgba(0,0,0,.18)}
textarea.inline-edit{resize:none;overflow:hidden}

/* ---------- right panel (floating card) ---------- */
.rpanel{position:absolute;right:18px;top:18px;width:330px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.12);display:flex;flex-direction:column;
  max-height:calc(100% - 36px);transform:translateX(calc(100% + 30px));transition:transform .2s;z-index:30}
.rpanel.open{transform:translateX(0)}
.rp-head{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.rp-head b{font-size:17px;font-weight:800}
.rp-x{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;
  cursor:pointer;color:var(--txt2);font-size:13px}
.rp-x:hover{border-color:var(--txt2);color:var(--txt)}
.rp-rule{height:1px;background:var(--line);margin:0 18px}
.rp-body{flex:1;overflow:auto;padding:15px 18px}
.rp-foot{padding:14px 18px}
.rp-foot .btn-dark{width:100%;justify-content:center;height:44px}
.rp-body .grp{margin-bottom:15px}
.rp-body label{font-size:15px;color:#111;font-weight:400;margin-bottom:8px;display:block}
.rp-body .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rp-body .scalerow{display:flex;align-items:center;gap:9px}
.rp-body .scalerow input{text-align:center}
.rp-inp{width:100%;height:42px;border:1px solid #dbe2ee;border-radius:9px;background:#fff;color:#111;
  padding:0 13px;font-size:15px;outline:none;font-family:inherit}
.rp-inp:focus{border-color:#8b95a6}
.rp-inp::placeholder{color:#aeb8c6}
.field{margin-bottom:13px}
.field label{font-size:13px;color:var(--txt2);font-weight:600;margin-bottom:6px;display:block}
.inp{width:100%;background:#fff;border:1px solid var(--line2);color:var(--txt);border-radius:9px;font-size:14px;
  padding:9px 11px;outline:none}
.inp:focus{border-color:var(--sel);box-shadow:0 0 0 3px rgba(47,111,237,.14)}
.inp:disabled{background:var(--panel2);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.scale-row{display:flex;align-items:center;gap:7px}
.scale-row .inp{text-align:center}
.scale-row span{color:var(--muted);font-weight:700}

/* chips (BOM column toggles) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font-size:13px;padding:7px 13px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--txt2);cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

/* BOM mini table in panel */
.mini-label{font-size:14px;font-weight:700;margin:4px 0 8px}
.bom-mini{border-collapse:collapse;font-size:12px;margin-bottom:12px}
.bom-wrap{overflow-x:auto;max-width:100%;margin-bottom:12px}
.bom-mini th,.bom-mini td{min-width:100px}
.bom-mini th{color:var(--txt2);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);
  white-space:nowrap}
.bom-mini td{padding:2px}
.bom-mini input{width:100%;background:#fff;border:1px solid transparent;border-radius:6px;font-size:12px;padding:5px 6px;
  outline:none;color:var(--txt)}
.bom-mini input:focus{border-color:var(--sel)}
.bom-mini td{border-bottom:1px solid var(--line)}
.bom-mini tr:hover{background:#f2f6fc}
.bom-mini tbody tr{cursor:default}
.bom-mini tbody tr .nocell{cursor:grab}
.bom-mini tr.rowdrag{opacity:.4}
.bom-mini tr.drop-hi td{box-shadow:inset 0 2px 0 var(--sel)}
.bom-mini .nocell{min-width:38px;width:38px;text-align:center;cursor:pointer;color:var(--muted);position:relative;font-size:12px}
.bom-mini tr:hover .nocell .num{display:none}
.bom-mini .nocell .tr{display:none;color:var(--danger);cursor:pointer}
.bom-mini tr:hover .nocell .tr{display:inline}
.add-row{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:13px;
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.add-row:hover{background:var(--ink-d)}

/* ---------- Format Config (full-screen view) — geometry measured from reference ---------- */
#formatView{position:absolute;left:0;right:0;top:125px;bottom:0;background:#fff;overflow:auto;z-index:40}
.fmt-wrap{padding:44px 64px 40px;max-width:1440px;margin:0 auto}
.fmt-h1{font-size:24px;font-weight:700;margin:0 0 42px;color:#111}
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 108px}
.fmt-sec{margin-bottom:36px}
.fmt-sec h3{font-size:17px;font-weight:700;margin:0 0 20px;color:#111}
.f2{display:grid;grid-template-columns:293fr 283fr;gap:26px}
.f-field label,.f-lab{font-size:14px;color:#3d4248;margin-bottom:9px;display:block;font-weight:400}
.inp2{height:41px;width:100%;border:1px solid #dbe2ee;border-radius:8px;background:#fff;color:#111;
  padding:0 14px;font-size:15px;outline:none;font-family:inherit}
.inp2:focus{border-color:#8b95a6}
.inp2:disabled,.inp2[readonly]{background:#eef1f7;color:#8b95a6;cursor:not-allowed}
select.inp2{appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7178' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:38px}
.with-u{display:flex;align-items:center;gap:11px}
.with-u .inp2{flex:1}
.with-u .u{font-size:14px;color:#6b7178}
.prevbox{background:#eef1f7;border-radius:10px;padding:13px 16px 20px;margin-top:12px}
.prevbox .cap{font-size:12px;color:#8a8f96;margin-bottom:14px}
.prevbox .body{display:flex;align-items:center;justify-content:center;min-height:34px;color:#111}
#typoPrev{font-size:22px;white-space:nowrap}
#strokePrevWrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:9px}
#strokePrevTxt{font-size:19px}
#strokePrevLine{width:70%;background:#111;border-radius:1px}
.sw-block{margin-top:23px}
.sw-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.sw-head .val{font-size:13px;color:#6b7178}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
  background:#dbe2ee;outline:none;margin:8px 0 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
  background:#111;cursor:pointer}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border:none;border-radius:50%;background:#111;cursor:pointer}
.tg-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin:26px 0 0}
.tg-row .tl b{font-size:15px;font-weight:400;color:#111;display:block;margin-bottom:3px}
.tg-row .tl span{font-size:14px;color:#8a8f96}
.switch{width:46px;height:26px;border-radius:13px;background:#d6dade;position:relative;cursor:pointer;flex:none;
  transition:background .15s}
.switch.on{background:#111}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:left .15s}
.switch.on::after{left:23px}
.tb-sec{margin-top:22px}
.tb-sec h3{font-size:17px;font-weight:700;margin:0 0 20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;margin-bottom:20px}
.g4{display:grid;grid-template-columns:359fr 359fr 359fr 147fr;gap:26px;margin-bottom:20px}
.scale-pair{display:flex;align-items:center;gap:10px}
.scale-pair .inp2{text-align:center;padding:0 6px}
.scale-pair span{color:#6b7178}
.appr-row{display:grid;grid-template-columns:88px minmax(0,562fr) 56px 184fr 184fr 184fr;align-items:center;gap:0 16px;margin-bottom:18px}
.appr-row .rl{font-size:14px;color:#3d4248}
.tbprevbox{background:#eef1f7;border-radius:10px;padding:13px 16px 18px;margin-top:4px}
.tbprevbox .cap{font-size:12px;color:#8a8f96;margin-bottom:12px}
#tbPrev{width:100%;display:block;background:#fff}
.fmt-actions{display:flex;justify-content:center;gap:22px;padding:38px 0 50px}
.btn-cancel{background:#e6ecf5;color:#3d4248;border:1px solid #dbe2ee;border-radius:9px;height:44px;padding:0 44px;
  font-size:15px;cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:#dbe3ef}
.fmt-actions .btn-dark{height:44px;padding:0 44px;border-radius:9px;font-size:15px;font-weight:500}

/* ---------- modal (export) ---------- */
.modal-back{position:absolute;inset:0;background:rgba(20,22,26,.42);display:grid;place-items:center;z-index:80}
.modal-card{background:var(--panel);border-radius:16px;width:520px;max-width:92vw;box-shadow:0 24px 70px rgba(0,0,0,.3);
  overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head b{font-size:18px;font-weight:800}
.modal-body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.exp-opt{border:1px solid var(--line2);border-radius:13px;padding:22px;text-align:center;cursor:pointer;
  background:var(--panel2);transition:.14s}
.exp-opt:hover{border-color:var(--ink);transform:translateY(-2px)}
.exp-opt i{font-size:30px;color:var(--ink)}
.exp-opt h5{margin:10px 0 4px;font-size:16px;font-weight:700}
.exp-opt p{font-size:12px;color:var(--muted);margin:0}

/* context menu */
.ctx{position:absolute;z-index:90;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;
  min-width:180px;box-shadow:0 12px 32px rgba(0,0,0,.16)}
.ctx div{padding:8px 12px;border-radius:7px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;
  gap:18px;color:var(--txt2)}
.ctx div:hover{background:var(--panel2);color:var(--txt)}
.ctx kbd{font-size:10px;color:var(--muted);background:var(--panel2);border-radius:4px;padding:1px 5px}

/* toast */
.toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  border-radius:11px;padding:12px 20px;font-size:13px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25)}

::-webkit-scrollbar{width:10px;height:10px}
/* inline SVG icons (no external font) */
.bi{display:inline-flex;align-items:center;justify-content:center;line-height:0;flex:none}
.bi svg{width:1em;height:1em;display:block}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--muted2)}

#selbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:none;gap:2px;align-items:center;
  background:#1b1b1f;color:#fff;border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:9000}
#selbar button{width:34px;height:34px;border:0;background:transparent;color:#e2e8f1;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#selbar button:hover{background:rgba(255,255,255,.14)}
#selbar button:disabled{opacity:.35;cursor:default}
#selbar button[data-g=delete]:hover{background:rgba(220,60,50,.6)}
#selbar .sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin:0 4px}

#ctxmenu{position:fixed;display:none;min-width:196px;background:#fff;border:1px solid #dbe2ee;border-radius:12px;
  box-shadow:0 14px 40px rgba(0,0,0,.18);padding:6px;z-index:9500;font-size:14px;color:#1b1b1f;user-select:none}
#ctxmenu .ci{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer}
#ctxmenu .ci:hover{background:#e9edf5}
#ctxmenu .ci.dis{opacity:.38;cursor:default}
#ctxmenu .ci.dis:hover{background:transparent}
#ctxmenu .ci .k{margin-left:auto;color:#9a9aa2;font-size:12px}
#ctxmenu .ci[data-c=delete]:hover{background:rgba(220,60,50,.12);color:#c0392b}
#ctxmenu .cisep{height:1px;background:#e4e9f2;margin:5px 4px}
#ctxmenu .ctitle{font-size:11px;color:#9a9aa2;padding:4px 10px 2px}
#ctxmenu .cirow{display:flex;gap:2px;padding:2px 6px 4px}
.imp-badge{display:none;align-items:center;gap:7px;height:40px;padding:0 14px;margin-right:8px;border-radius:10px;
  background:#fff3cd;border:1px solid #f0d48a;color:#8a6100;font-size:14px;font-weight:600;cursor:pointer}
.imp-badge:hover{background:#ffe9a8}
.imp-badge i{font-size:15px}
.ctx-menu{position:fixed;display:none;min-width:230px;background:#fff;border:1px solid #dbe2ee;border-radius:12px;
  box-shadow:0 14px 34px rgba(0,0,0,.18);padding:6px;z-index:99999;font-size:14px;color:#222}
.ctx-menu .ctx-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer}
.ctx-menu .ctx-item:hover{background:#e9edf5}
.ctx-menu .ctx-item i{font-size:16px;color:#555}
#ctxmenu .cirow button{width:30px;height:30px;border:0;background:transparent;border-radius:7px;color:#333;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#ctxmenu .cirow button:hover{background:#e3e9f2}
</style>
</head>
<body>

<!-- ===================== DASHBOARD ===================== -->
<div id="dashboard">
  <div class="dash-top">
    <div class="dash-brand"><div class="mark"><i class="bi bi-pencil-square"></i></div><h1>Drawing Master</h1></div>
    <div class="dash-actions">
      <button class="btn-dark" id="btnCreate"><i class="bi bi-plus-lg"></i> Create New</button>
      <button class="icon-circle" title="Settings"><i class="bi bi-gear"></i></button>
    </div>
  </div>
  <div id="projGrid" class="proj-grid"></div>
</div>

<!-- ===================== EDITOR ===================== -->
<div id="editor" class="hide">
  <div class="navbar">
    <button class="nav-round" id="btnBack" title="Dashboard"><i class="bi bi-arrow-left"></i></button>
    <button class="nav-ic" id="btnUndo" title="Undo (Ctrl+Z)"><i class="bi bi-arrow-counterclockwise"></i></button>
    <button class="nav-ic" id="btnRedo" title="Redo (Ctrl+Y)"><i class="bi bi-arrow-clockwise"></i></button>
    <input id="navName" class="nav-name" spellcheck="false">
    <i class="bi bi-pencil nav-pencil" id="btnRenameProj" title="Edit project name"></i>
    <span class="badge-save">Auto Save</span>
    <div class="spacer"></div>
      <button class="btn-dark" id="btnImport"><i class="bi bi-box-arrow-in-down"></i> Import</button>
    <div class="tool-group">
      <button class="tool-sq" id="btnText" title="Text / Label (T)"><i class="bi bi-fonts"></i></button>
      <button class="tool-sq" id="btnBom" title="Add BOM table"><i class="bi bi-table"></i></button>
      <button class="tool-pen" id="btnStylize" title="AI Stylize"><i class="bi bi-pen"></i></button>
    </div>
    <button class="btn-dark" id="btnExport"><i class="bi bi-box-arrow-up"></i> Export</button>
  </div>

  <div class="body">
    <!-- left sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sb-head"><b>Pages</b><i class="bi bi-layout-sidebar ic" id="btnCollapse" title="Collapse"></i></div>
      <div class="sb-rule"></div>
      <div class="sb-list" id="pageList"></div>
      <div class="sb-foot">
        <button class="add-page" id="btnAddPage"><i class="bi bi-plus-lg"></i><span>Add Page</span></button>
        <button class="fmt-btn" id="btnFormat"><i class="bi bi-gear ic"></i><span>Format Config</span></button>
      </div>
    </div>

    <!-- stage -->
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud zoom">
        <button id="zoomOut"><i class="bi bi-dash-lg"></i></button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn"><i class="bi bi-plus-lg"></i></button>
        <button id="zoomFit" title="Fit"><i class="bi bi-aspect-ratio"></i></button>
      </div>
      <div class="hud coord" id="coordHud">—, — mm</div>
      <div class="align-bar" id="alignBar" style="display:none">
        <button data-al="left" title="Align Left"><i class="bi bi-align-start"></i></button>
        <button data-al="center" title="Align Center H"><i class="bi bi-align-center"></i></button>
        <button data-al="right" title="Align Right"><i class="bi bi-align-end"></i></button>
        <span class="sep"></span>
        <button data-al="top" title="Align Top"><i class="bi bi-align-top"></i></button>
        <button data-al="middle" title="Align Middle V"><i class="bi bi-align-middle"></i></button>
        <button data-al="bottom" title="Align Bottom"><i class="bi bi-align-bottom"></i></button>
        <span class="sep"></span>
        <button data-al="frame" title="Center in Frame"><i class="bi bi-bullseye"></i></button>
      </div>
    </div>

    <!-- right panel -->
    <div class="rpanel" id="rpanel">
      <div class="rp-head"><b id="rpTitle">Title Block</b><span class="rp-x" id="rpClose"><i class="bi bi-x-lg"></i></span></div>
      <div class="rp-rule"></div>
      <div class="rp-body" id="rpBody"></div>
      <div class="rp-foot"><button class="btn-dark" id="rpSave"><i class="bi bi-save"></i> Save</button></div>
    </div>
  </div>
</div>

<!-- ===================== FORMAT CONFIG ===================== -->
<div id="formatView" class="hide"></div>

<!-- ===================== MODAL HOST ===================== -->
<div id="modalHost"></div>
<div id="ctxHost"></div>
<input type="file" id="fileInput" accept=".dxf" class="hide">

function fitScale(){

function fitView(){

function zoomBy(f,cx,cy){
  const sw=stage.clientWidth, sh=stage.clientHeight;

function entsToDXF(ents){

  const num=n=>{ n=+n; if(!isFinite(n)) n=0; return (Math.abs(n)<1e-9?0:n).toFixed(4); };
  ents.forEach(e=>{
    if(e.t==='poly'){

    } else if(e.t==='fill'){
      let pts=e.pts.slice();
      if(pts.length>1 && Math.hypot(pts[0][0]-pts[pts.length-1][0],pts[0][1]-pts[pts.length-1][1])<1e-6) pts.pop();  // drop closing dup

        g(10,num(ord[0][0])); g(20,num(ord[0][1])); g(11,num(ord[1][0])); g(21,num(ord[1][1]));
        g(12,num(ord[2][0])); g(22,num(ord[2][1])); g(13,num(ord[3][0])); g(23,num(ord[3][1]));
      } else if(pts.length>4){
        g(0,'HATCH'); g(8,'0'); g(100,'AcDbEntity'); g(100,'AcDbHatch');
        g(210,0); g(220,0); g(230,1); g(2,'SOLID'); g(70,1); g(71,0);
        g(91,1); g(92,7); g(72,0); g(73,1); g(93,pts.length);
        pts.forEach(p=>{ g(10,num(p[0])); g(20,num(p[1])); });

    }
  });
  g(0,'ENDSEC'); g(0,'EOF');

}

function buildPDF(images){                                  // images:[{bytes,wpx,hpx}]
  const {W,H}=paperDims(); const wpt=W/25.4*72, hpt=H/25.4*72;
  const parts=[]; let len=0; const bytes=[];
  const put=(u8)=>{ bytes.push(u8); len+=u8.length; };
  const putStr=(s)=>{ const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&0xff; put(u); };

  const kids=[]; for(let i=0;i<N;i++) kids.push((3+i*3)+' 0 R');
  mark(2); putStr('2 0 obj\n<< /Type /Pages /Count '+N+' /Kids ['+kids.join(' ')+'] >>\nendobj\n');
  for(let i=0;i<N;i++){ const im=images[i]; const pg=3+i*3, ct=4+i*3, ig=5+i*3;
    mark(pg); putStr(pg+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+wpt.toFixed(2)+' '+hpt.toFixed(2)+'] '+
      '/Resources << /XObject << /Im'+i+' '+ig+' 0 R >> >> /Contents '+ct+' 0 R >>\nendobj\n');
    const cont='q '+wpt.toFixed(2)+' 0 0 '+hpt.toFixed(2)+' 0 0 cm /Im'+i+' Do Q\n';
    mark(ct); putStr(ct+' 0 obj\n<< /Length '+cont.length+' >>\nstream\n'+cont+'endstream\nendobj\n');
    mark(ig); putStr(ig+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.wpx+' /Height '+im.hpx+
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n');
    put(im.bytes); putStr('\nendstream\nendobj\n');
  }
  const xoff=len; putStr('xref\n0 '+(nobj+1)+'\n'); putStr('0000000000 65535 f \n');
  for(let i=1;i<=nobj;i++){ putStr(String(off[i]).padStart(10,'0')+' 00000 n \n'); }

/* ===================== BOM (Bill of Material) ===================== */
const BOM_DEFS=[
  {key:'partno',    label:'PART NO.',   short:'Part No.',   w:16, auto:true},
  {key:'title',     label:'TITLE',      short:'Title',      w:44},
  {key:'qty',       label:'QUANTITY',   short:'Quantity',   w:24},
  {key:'material',  label:'MATERIAL',   short:'Material',   w:26},
  {key:'finish',    label:'FINISH',     short:'Finish',     w:26},
  {key:'production',label:'PRODUCTION', short:'Production', w:30},
  {key:'parttype',  label:'PART TYPE',  short:'Part Type',  w:26},
  {key:'note',      label:'NOTE',       short:'Note',       w:28},
];
const BOM_TITLE_H=6.4, BOM_HEAD_H=6.0, BOM_ROW_MIN=6.0, BOM_PAD=1.4, BOM_FONT=2.5, BOM_MINCOL=10;
function bomRow(){ return {title:'',qty:'',material:'',finish:'',production:'',parttype:'',note:''}; }
function bomDefaults(){
  const {W,H}=paperDims(); const m=store.format.margin;
  const cols={}, colW={}; BOM_DEFS.forEach(d=>{ cols[d.key]=(d.key!=='parttype'&&d.key!=='note'); colW[d.key]=d.w; });
  const totalW=BOM_DEFS.filter(d=>cols[d.key]).reduce((s,d)=>s+colW[d.key],0);
  return { x:(W-totalW)/2, y:H-m-2, cols, colW, rows:[bomRow(),bomRow()] };
}
function bomVisible(b){ return BOM_DEFS.filter(d=>b.cols[d.key]); }
function bomColWidths(b){ const vis=bomVisible(b); return { vis, ws:vis.map(d=>b.colW[d.key]||d.w) }; }
function wrapCell(txt, maxWpx, fpx){
  txt=String(txt==null?'':txt); if(!txt) return [''];
  ctx.save(); ctx.font=`${fpx}px ${store.format.font},Arial`;
  const fit=s=>ctx.measureText(s).width<=maxWpx;
  const words=txt.split(/\s+/); const lines=[]; let cur='';
  words.forEach(wd=>{
    if(!cur) cur=wd; else if(fit(cur+' '+wd)) cur+=' '+wd; else { lines.push(cur); cur=wd; }
    while(!fit(cur) && cur.length>1){ let i=cur.length; while(i>1 && !fit(cur.slice(0,i))) i--; lines.push(cur.slice(0,i)); cur=cur.slice(i); }
  });
  if(cur) lines.push(cur); ctx.restore(); return lines.length?lines:[''];
}
function bomRowHeights(b){ const {vis,ws}=bomColWidths(b); const fpx=mm2px(BOM_FONT); const lh=BOM_FONT*1.34;
  return b.rows.map(r=>{ let mx=1; vis.forEach((d,i)=>{ if(d.auto)return; const lines=wrapCell(r[d.key], mm2px(ws[i]-BOM_PAD*2), fpx); mx=Math.max(mx,lines.length); });
    return Math.max(BOM_ROW_MIN, mx*lh+BOM_PAD*1.1); }); }
function bomBounds(page){ const b=page&&page.bom; if(!b) return null;
  const {ws}=bomColWidths(b); const w=ws.reduce((a,c)=>a+c,0); const rh=bomRowHeights(b);
  const h=BOM_TITLE_H+BOM_HEAD_H+rh.reduce((a,c)=>a+c,0); return {x:b.x,y:b.y,w,h,ws,rh}; }
function bomText(txt,x,y,em,align,base,bold){ if(txt==null||txt==='')return; const p=W2S(x,y);
  ctx.save(); ctx.fillStyle=INK; ctx.font=`${bold?'700 ':''}${mm2px(em)}px ${store.format.font},Arial`;
  ctx.textAlign=align; ctx.textBaseline=base; ctx.fillText(String(txt),p.x,p.y); ctx.restore(); }
function drawBOM(page){
  const b=page.bom; if(!b) return; const bb=bomBounds(page); const {vis,ws}=bomColWidths(b); const rh=bb.rh;
  const x0=b.x, tot=bb.w; let y=b.y;
  ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.8,mm2px(0.2)); ctx.setLineDash([]);
  const rect=(x,yy,w,h)=>{ const a=W2S(x,yy),c=W2S(x+w,yy-h); ctx.strokeRect(a.x,a.y,c.x-a.x,c.y-a.y); };
  rect(x0,y,tot,BOM_TITLE_H); bomText('BILL OF MATERIAL', x0+tot/2, y-BOM_TITLE_H/2, BOM_FONT*1.15,'center','middle',true); y-=BOM_TITLE_H;
  let cx=x0; vis.forEach((d,i)=>{ rect(cx,y,ws[i],BOM_HEAD_H); bomText(d.label,cx+ws[i]/2,y-BOM_HEAD_H/2,BOM_FONT,'center','middle',true); cx+=ws[i]; }); y-=BOM_HEAD_H;
  const lh=BOM_FONT*1.34;
  b.rows.forEach((r,ri)=>{ const h=rh[ri]; cx=x0;
    vis.forEach((d,i)=>{ rect(cx,y,ws[i],h);
      if(d.auto){ bomText(String(ri+1),cx+ws[i]/2,y-h/2,BOM_FONT,'center','middle',false); }
      else { const lines=wrapCell(r[d.key], mm2px(ws[i]-BOM_PAD*2), mm2px(BOM_FONT));
        lines.forEach((ln,li)=>bomText(ln, cx+BOM_PAD, y-BOM_PAD-li*lh, BOM_FONT,'left','top',false)); }
      cx+=ws[i]; });
    y-=h; });
  ctx.restore();
}
function addBOM(){ const pg=activePage();
  if(!pg||pg.type!=='sheet'){ toast('open a sheet page first, then add a BOM'); return; }
  if(pg.bom){ toast('this page already has a BOM — double-click it to edit'); openBomPanel(); return; }
  snapshot(); pg.bom=bomDefaults(); afterMutate(); openBomPanel();
}
/* ---------- right panel editor ---------- */
let _bomSnapped=false;
function openBomPanel(){ const pg=activePage(); if(!pg||!pg.bom) return;

}
function bomTouch(){ if(!_bomSnapped){ snapshot(); _bomSnapped=true; } }  // one undo step per editing session
function renderBomPanel(){ const pg=activePage(); const b=pg&&pg.bom; if(!b) return; const body=$('#rpBody');
  let html='<div class="chips">';
  BOM_DEFS.forEach(d=>{ html+=`<span class="chip ${b.cols[d.key]?'on':''}" data-col="${d.key}">${d.short}</span>`; });
  html+='</div><div class="mini-label">Table</div>';
  const vis=bomVisible(b);
  html+='<div class="bom-wrap"><table class="bom-mini"><thead><tr><th class="nocell">No.</th>';
  vis.forEach(d=>{ if(d.auto)return; html+=`<th>${d.short}</th>`; });
  html+='</tr></thead><tbody>';
  b.rows.forEach((r,ri)=>{ html+=`<tr draggable="true" data-ri="${ri}"><td class="nocell" title="drag to reorder"><span class="num">${ri+1}</span><span class="tr" data-del="${ri}"><i class="bi bi-trash"></i></span></td>`;
    vis.forEach(d=>{ if(d.auto)return; html+=`<td><input data-ri="${ri}" data-key="${d.key}" value="${escapeHtml(r[d.key]||'')}"></td>`; });
    html+='</tr>'; });
  html+='</tbody></table></div><button class="add-row" id="bomAddRow"><i class="bi bi-plus-lg"></i> Add Row</button>';
  body.innerHTML=html;
  body.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ bomTouch(); b.cols[ch.dataset.col]=!b.cols[ch.dataset.col]; render(); renderBomPanel(); });
  body.querySelectorAll('.bom-mini input').forEach(inp=>inp.oninput=()=>{ bomTouch(); b.rows[+inp.dataset.ri][inp.dataset.key]=inp.value; render(); });
  body.querySelectorAll('[data-del]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); bomTouch(); b.rows.splice(+el.dataset.del,1); if(!b.rows.length)b.rows.push(bomRow()); render(); renderBomPanel(); });
  $('#bomAddRow').onclick=()=>{ bomTouch(); b.rows.push(bomRow()); render(); renderBomPanel(); };
  // ----- drag to reorder rows; No. renumbers automatically -----
  let dragRi=null;
  body.querySelectorAll('.bom-mini tbody tr').forEach(tr=>{
    tr.addEventListener('dragstart',e=>{ dragRi=+tr.dataset.ri; tr.classList.add('rowdrag'); if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(dragRi));}catch(_){} } });
    tr.addEventListener('dragend',()=>{ tr.classList.remove('rowdrag'); body.querySelectorAll('.bom-mini tr').forEach(x=>x.classList.remove('drop-hi')); });
    tr.addEventListener('dragover',e=>{ e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='move'; tr.classList.add('drop-hi'); });
    tr.addEventListener('dragleave',()=>tr.classList.remove('drop-hi'));
    tr.addEventListener('drop',e=>{ e.preventDefault(); let from=dragRi; if(from==null && e.dataTransfer){ from=+e.dataTransfer.getData('text/plain'); } const to=+tr.dataset.ri;
      if(from==null||isNaN(from)||from===to) return; bomTouch();
      const [moved]=b.rows.splice(from,1); b.rows.splice(to,0,moved); dragRi=null; render(); renderBomPanel(); });
  });
}
/* ---------- resize (overall width + per-column) on the page ---------- */
let bomDrag=null;
function bomResizeHit(page, wx, wy){       // returns {type:'all'|'col', key?} or null
  const b=page&&page.bom; if(!b) return null; const bb=bomBounds(page);
  if(wy>bb.y+1 || wy<bb.y-bb.h-1) return null;
  const tol=6/Math.max(view.s,1e-6);
  const {vis,ws}=bomColWidths(b);
  let cx=b.x;
  for(let i=0;i<vis.length;i++){ cx+=ws[i];
    if(Math.abs(wx-cx)<=tol){ return (i===vis.length-1) ? {type:'all'} : {type:'col', key:vis[i].key, i}; }
  }
  return null;
}

function render(){
  if(!ctx||!store) return;
  ctx.clearRect(0,0,cv.width,cv.height);
  const {W,H}=paperDims();
  const page=activePage();
  // paper (white) with soft shadow
  const o=W2S(0,H), e=W2S(W,0);
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.16)'; ctx.shadowBlur=22; ctx.shadowOffsetY=7;
  ctx.fillStyle='#fff'; ctx.fillRect(o.x,o.y,e.x-o.x,e.y-o.y);
  ctx.restore();
  // frame (sheet only) — PRD §5.1
  if(page.type==='sheet'){ drawFrame(); }
  // page content
  if(page.type==='cover')        drawCover(page);
  else if(page.type==='description') drawDescription(page);
  else if(page.type==='sheet'){  drawEntities(page); drawBOM(page); drawTitleBlock(page); }
  drawSelection();
  drawDimHandles();
  drawSnapGuides();
}

/* ---------- COVER — geometry measured from reference (A4 297x210mm) ----------
   right edge of all three lines .......... x = 250.8mm  (0.8444 W)
   grey box ............................... h 35mm, r 4.2mm, centre y 126.4mm
   PROJECT   em 17.3mm (bold, centred in box)
   DOC TYPE  em  9.4mm (bold, baseline y 94.75mm, right aligned)
   COMPANY   em  7.6mm (regular, baseline y 68.1mm, right aligned)          */
function drawTextMM(x,baseY,txt,em,bold,al){
  const p=W2S(x,baseY); ctx.fillStyle=INK; setFont(em,bold);
  ctx.textBaseline='alphabetic'; ctx.textAlign=al==='c'?'center':al==='r'?'right':'left';
  ctx.fillText(txt,p.x,p.y); ctx.textAlign='left'; ctx.textBaseline='top';
}
function drawCover(page){
  const {W,H}=paperDims(); const k=H/210; page._zones=[];
  const xR=W*0.8444;
  /* PROJECT in grey rounded box */
  const raw=store.name||'', proj=raw.toUpperCase();
  const emP=17.3*k, capP=emP*0.716, padX=14.6*k, boxH=35*k, boxR=4.2*k, byC=126.39*k;
  const tw=measureMM(proj,emP,true);
  const bxR=xR, bxL=xR-tw-2*padX;
  const p1=W2S(bxL,byC+boxH/2), p2=W2S(bxR,byC-boxH/2);
  ctx.fillStyle='#d3d3d3'; roundRect(p1.x,p1.y,p2.x-p1.x,p2.y-p1.y,mm2px(boxR)); ctx.fill();
  drawTextMM((bxL+bxR)/2, byC-capP/2, proj, emP, true, 'c');
  page._zones.push({key:'project',val:raw,x:bxL,y:byC-boxH/2,w:bxR-bxL,h:boxH,em:emP,bold:true,align:'c'});
  /* document type */
  const dt=store.format.docType||'', emD=9.4*k, byD=94.75*k;
  drawTextMM(xR,byD,dt,emD,true,'r');
  const dw=measureMM(dt,emD,true);
  page._zones.push({key:'docType',val:dt,x:xR-dw,y:byD,w:dw,h:emD*0.716,em:emD,bold:true,align:'r'});
  /* company */
  const co=store.format.company||'', emC=7.6*k, byC2=68.1*k;
  drawTextMM(xR,byC2,co,emC,false,'r');
  const cw=measureMM(co,emC,false);
  page._zones.push({key:'company',val:co,x:xR-cw,y:byC2,w:cw,h:emC*0.716,em:emC,bold:false,align:'r'});
}

/* ---------- DESCRIPTION — geometry measured from reference (A4 297x210mm) ----
   PROJECT      em 18.36mm bold, right edge 260.32mm, baseline 133.99mm
   description  em  6.86mm,      left     131.22mm, baseline 120.25mm
   legend       sample x 130.51..179.54, labels x 188.71, em 6.02mm
                line y 97.76 / 87.15 / 76.54, hatch box y 60.11..68.95
                label baselines 95.11 / 84.50 / 73.90 / 62.58
   verified against the reference: every band within 1px                     */
const LEGEND_DEF=['OBJECT LINE','CENTER LINE','SECTION LINE','SECTION PLASTIC'];
function drawDescription(page){
  const {W,H}=paperDims(); const k=H/210, u=W/297; page._zones=[];
  const d=page.desc||(page.desc={override:false,project:'',body:'Project Description'});
  if(!d.body) d.body='Project Description';
  if(!d.legend||d.legend.length!==4) d.legend=LEGEND_DEF.slice();
  const xR=260.32*u, xL=131.22*u, xS0=130.51*u, xS1=179.54*u, xLab=188.71*u;

  /* PROJECT — right aligned, big bold */
  const raw=(d.override?(d.project||''):(store.name||'')), proj=raw.toUpperCase();
  const emP=18.36*k, byP=133.99*k;
  drawTextMM(xR,byP,proj,emP,true,'r');
  const pw=measureMM(proj,emP,true);
  page._zones.push({key:'project',val:raw,x:xR-pw,y:byP,w:pw,h:emP*0.716,em:emP,bold:true,align:'r'});

  /* project description text — left aligned */
  /* Smaller than it was, and the legend below has been lowered, so there is room
     to write more than a single line here. */
  const emB=5.0*k, byB=120.25*k, body=d.body||'';
  drawTextMM(xL,byB,body,emB,false,'l');
  const bw=Math.max(measureMM(body,emB,false),45*u);
  page._zones.push({key:'body',val:body,x:xL,y:byB,w:bw,h:emB*0.716,em:emB,bold:false,align:'l'});

  /* legend — real line samples, exact dash segments from the reference */
  const lineY=[97.76*k,87.15*k,76.54*k], baseL=[95.11*k,84.50*k,73.90*k,62.58*k];
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.6,mm2px(0.7));
  const dashRow=(y,segs)=>{ segs.forEach(([a,b])=>{
      const p1=W2S(xS0+a*u,y), p2=W2S(xS0+b*u,y); seg(p1,p2); }); };
  ctx.setLineDash([]);
  dashRow(lineY[0],[[0,49.03]]);                                           // OBJECT: solid
  dashRow(lineY[1],[[0,17.64],[20.46,28.93],[31.75,49.03]]);               // CENTER: long-short-long
  dashRow(lineY[2],[[0,11.99],[14.81,23.28],[26.10,34.57],[37.39,49.03]]); // SECTION: dashes
  const c1=W2S(xS0,68.95*k), c2=W2S(xS1,60.11*k);                          // SECTION PLASTIC: hatched box
  ctx.lineWidth=Math.max(1.6,mm2px(0.7));
  ctx.strokeRect(c1.x,c1.y,c2.x-c1.x,c2.y-c1.y);
  ctx.save(); ctx.beginPath(); ctx.rect(c1.x,c1.y,c2.x-c1.x,c2.y-c1.y); ctx.clip();
  const hh=c2.y-c1.y, step=mm2px(7.0*u);
  for(let x=c1.x-hh; x<c2.x+hh; x+=step){ ctx.beginPath(); ctx.moveTo(x,c2.y); ctx.lineTo(x+hh,c1.y); ctx.stroke(); }
  ctx.restore();

  /* Recorded so a test can check that every line sample runs the same length and
     that the description still has room above the legend - both are things a
     picture shows at a glance and a number can hold to. */
  page._legendSpans=[49.03,49.03,49.03,49.03];
  page._legendTopY=lineY[0]; page._descBodyY=byB;
  const emL=6.02*k;
  d.legend.forEach((t,i)=>{ drawTextMM(xLab,baseL[i],t,emL,false,'l');
    const w=measureMM(t,emL,false);
    page._zones.push({key:'lg'+i,val:t,x:xLab,y:baseL[i],w,h:emL*0.716,em:emL,bold:false,align:'l'}); });
}
function seg(a,b){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }


/* ============================================================
   DXF IMPORT (PRD §8) — powered by the "dxf" library.
   toPolylines() returns every LINE/ARC/CIRCLE/ELLIPSE/POLYLINE/
   SPLINE and expanded INSERT/DIMENSION geometry already resolved
   to WORLD coordinates (OCS + block transforms applied by the
   library). denormalise() supplies TEXT/MTEXT/HATCH/DIMENSION.
   We only convert units -> mm and place on the sheet. 1:1, no edit.
   ============================================================ */
const UNIT_MM={0:1,1:25.4,2:304.8,3:1609344,4:1,5:10,6:1000,7:1e6,8:0.0254,9:0.0254,10:914.4,14:0.01,15:0.1,16:10};
const DXFRAW={
  pairs(text){
    const lines=text.replace(/^\uFEFF/,'').split(/\r\n|\r|\n/);
    const out=[]; for(let i=0;i+1<lines.length;i+=2){ const c=parseInt(lines[i].trim(),10);
      if(Number.isFinite(c)) out.push([c, lines[i+1]]); }
    return out;
  },
  readAll(text){
    const P=this.pairs(text); const ents=[]; let i=0;
    let space='model', blockName=null;
    const readEntitiesUntil=()=>{
      while(i<P.length){
        const [c,v]=P[i];
        if(c===0 && (v.trim()==='ENDSEC' || v.trim()==='ENDBLK')) return;
        if(c===0){ const type=v.trim(); i++; const codes=[];
          while(i<P.length && P[i][0]!==0){ codes.push(P[i]); i++; }
          ents.push({type, codes, space, block:blockName});
        } else i++;
      }
    };
    while(i<P.length){
      const [c,v]=P[i];
      if(c===0 && v.trim()==='SECTION'){
        const name=(P[i+1]&&P[i+1][0]===2)?P[i+1][1].trim():''; i+=2;
        if(name==='ENTITIES'){ space='model'; blockName=null; readEntitiesUntil(); }
        else if(name==='BLOCKS'){
          while(i<P.length && !(P[i][0]===0 && P[i][1].trim()==='ENDSEC')){
            if(P[i][0]===0 && P[i][1].trim()==='BLOCK'){ i++;
              blockName=null; space='block';
              while(i<P.length && P[i][0]!==0){ if(P[i][0]===2 && blockName==null) blockName=(P[i][1]||'').trim(); i++; }
              readEntitiesUntil();
              while(i<P.length && !(P[i][0]===0 && P[i][1].trim()==='ENDBLK')) i++;
              if(i<P.length) i++;
            } else i++;
          }
          space='model'; blockName=null;
        } else { while(i<P.length && !(P[i][0]===0 && P[i][1].trim()==='ENDSEC')) i++; }
      } else i++;
    }
    return ents;
  },
  census(text){ const c={}; this.readAll(text).forEach(e=>{ c[e.type]=(c[e.type]||0)+1; }); return c; },
  vals(codes,code){ const r=[]; codes.forEach(([c,v])=>{ if(c===code) r.push(parseFloat(v)); }); return r; },

}
function v2Arc(cx,cy,r,a0deg,a1deg){

  for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; out.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); }
  return out;
}
function v2Ellipse(e, normalZ){

  // away from us (extrusion z < 0) the plane is seen from behind, so the minor axis

/* Proper NURBS evaluation (De Boor). Control-point splines must be evaluated with

   catmull-rom does) visibly deforms every outline. */
function v2DeBoor(k, degree, knots, ctrl, weights){

  const d=[];
  for(let j=0;j<=degree;j++){ const idx=j+k-degree;
    const P=ctrl[idx]||ctrl[n-1]; const W=w[idx]==null?1:w[idx];
    d.push([P[0]*W, P[1]*W, W]); }

    const dd=d.map(p=>p.slice());
    for(let r=1;r<=degree;r++){
      for(let j=degree;j>=r;j--){
        const i=j+k-degree;
        const den=(knots[i+degree-r+1]-knots[i]);
        const a=den===0?0:(t-knots[i])/den;
        dd[j][0]=(1-a)*dd[j-1][0]+a*dd[j][0];
        dd[j][1]=(1-a)*dd[j-1][1]+a*dd[j][1];
        dd[j][2]=(1-a)*dd[j-1][2]+a*dd[j][2];

    }

    return [p[0]/W, p[1]/W];

}
function v2Spline(e){

    const weights=(e.weights||[]).slice();
    const out=[]; const n=ctl.length;
    const t0=knots[degree], t1=knots[n];
    const steps=Math.max(24, Math.min(400, ctl.length*12));
    let k=degree;
    for(let i=0;i<=steps;i++){
      const t=t0+(t1-t0)*i/steps;
      while(k<n-1 && t>=knots[k+1]) k++;
      const f=v2DeBoor(k, degree, knots, ctl, weights);
      out.push(f(Math.min(t, t1)));

    return out;

  if(fit.length>=2) return catmullRom(fit, 16);          // fit-point spline passes through its points
  if(ctl.length>=2) return catmullRom(ctl, 16);          // last resort

}
function v2HatchLoops(e){
  /* Edge encoding used by the parser (verified against real files):
       type 1 = LINE     : start, end
       type 2 = ARC      : start = CENTRE, radius, start/endAngle in RADIANS, isCcw
       type 3 = ELLIPSE  : start = CENTRE, end = major-axis endpoint (relative),
                           radius = minor/major ratio, angles in RADIANS
       type 4 = SPLINE   : controlPoints / fitPoints
     Treating an ellipse edge as a line drags the boundary diagonally across the
     whole sheet, which is exactly what made section fills look scattered. */
  const loops=[];
  const R2D=180/Math.PI;
  (e.boundaryLoops||[]).forEach(L=>{
    const pts=[];
    if(L.polyline && Array.isArray(L.polyline.vertices)){
      const vs=L.polyline.vertices.map(v=>[v.x||0, v.y||0, v.bulge||0]);
      const closed=(L.polyline.isClosed!==false);
      for(let i=0;i<vs.length;i++){ const a=vs[i]; pts.push([a[0],a[1]]);
        if(i<vs.length-1 || closed){ const b=vs[(i+1)%vs.length];
          v2Bulge([a[0],a[1]],[b[0],b[1]],a[2]).forEach(p=>pts.push(p)); } }
    } else {
      (L.edges||[]).forEach(ed=>{
        const t=ed.type;
        if(t===2){                                   // circular arc
          const c=ed.start||{x:0,y:0};
          const arc=v2Arc(c.x||0, c.y||0, ed.radius||0, (ed.startAngle||0)*R2D,
                          (ed.endAngle==null?360:ed.endAngle*R2D));
          if(ed.isCcw===0) arc.reverse();
          arc.forEach(p=>pts.push(p));
        } else if(t===3){                            // elliptic arc
          const c=ed.start||{x:0,y:0}, mj=ed.end||{x:1,y:0};
          v2Ellipse({ center:c, majorAxisEndPoint:mj, axisRatio:(ed.radius==null?1:ed.radius),
            startAngle:(ed.startAngle||0), endAngle:(ed.endAngle==null?Math.PI*2:ed.endAngle) },
            (ed.isCcw===0?-1:1)).forEach(p=>pts.push(p));
        } else if(t===4){                            // spline
          const src=((ed.fitPoints&&ed.fitPoints.length?ed.fitPoints:ed.controlPoints)||[])
            .filter(p=>p&&p.x!=null).map(p=>[p.x,p.y]);
          if(src.length>=2) catmullRom(src,12).forEach(p=>pts.push(p));
        } else if(ed.start && ed.end){               // line
          pts.push([ed.start.x||0, ed.start.y||0]); pts.push([ed.end.x||0, ed.end.y||0]);
        }

    }

}
function v2TextRot(e){
  if(e.type==='MTEXT'){
    // The parser exposes the MTEXT X-axis direction vector as `direction` (DXF group
    // 11/21). For a vertical dimension it reads (0,1), i.e. the value must be turned
    // 90 degrees — which is exactly what drafting practice requires.
    const d=e.direction||e.directionVector||e.xAxis;
    if(d && ((d.x||0)||(d.y||0))) return Math.atan2(d.y||0, d.x||0)*180/Math.PI;
    return e.rotation||0;
  }

}
function v2MtextPlain(s){ return (typeof mtextPlain==='function')?mtextPlain(s||''):String(s||''); }
/* ---- main conversion ------------------------------------------------------ */
/* "Defpoints" is AutoCAD's reserved non-plotting layer: dimensions park their
   definition points there, which show up as stray "+" marks at the end of every
   extension line. CAD never plots this layer, and neither do we. */
function v2NoPlotLayer(name){ return /^defpoints$/i.test((name||'').trim()); }
/* Dimension value text follows the aligned convention: it reads along the dimension
   line, so a vertical (height) dimension turns 90 degrees. The orientation comes from
   the DIMENSION entity itself — group 70 gives the kind and group 50 the dimension-line
   angle — instead of being guessed from the block's geometry.
     kind 0 = rotated linear (angle tells us the direction)
     kind 1 = aligned       (direction between the two definition points)
     kind 3/4 = diameter/radius, 2/5 = angular, 6 = ordinate -> text stays horizontal */
function v2DimTextRot(e){
  const kind=(e.dimensionType==null?0:e.dimensionType)&15;
  let ang=null;
  if(kind===0){ ang=(e.angle==null?0:e.angle); }
  else if(kind===1){
    const p1=e.linearOrAngularPoint1, p2=e.linearOrAngularPoint2;
    if(p1&&p2) ang=Math.atan2((p2.y||0)-(p1.y||0), (p2.x||0)-(p1.x||0))*180/Math.PI;
  }
  if(ang==null) return 0;                       // radius, diameter, angular, ordinate
  let a=((ang%180)+180)%180;                    // fold to 0..180
  if(a>90) a-=180;                              // keep text readable (-90..90)
  return Math.abs(a)<1e-6?0:a;
}
function convertDXF_v2(parsed, text){
  const mm=v2UnitMM(parsed, text);
  const out={polys:[], texts:[], hatches:[], solids:[], marks:[], clines:[]};
  const skipped={}; let hatchIssues=0;
  const blocks=parsed.blocks||{};
  // --- choose the layout that holds the drawing -----------------------------
  const all=parsed.entities||[];
  const DRAW={LINE:1,LWPOLYLINE:1,POLYLINE:1,ARC:1,CIRCLE:1,ELLIPSE:1,SPLINE:1,TEXT:1,MTEXT:1,
    SOLID:1,TRACE:1,'3DFACE':1,POINT:1,HATCH:1,INSERT:1,DIMENSION:1,LEADER:1,MLEADER:1,ATTRIB:1,ATTDEF:1};
  let nModel=0,nPaper=0;
  all.forEach(e=>{ if(!DRAW[e.type])return; if(e.inPaperSpace) nPaper++; else nModel++; });
  const usePaper=(nPaper>nModel);
  const roots=all.filter(e=>usePaper? !!e.inPaperSpace : !e.inPaperSpace);
  const spaceInfo={used:usePaper?'paper':'model', modelCount:nModel, paperCount:nPaper,
    hidden:usePaper?nModel:nPaper};

  let curDim=null, dimSeq=1, curDimTextRot=0;         // set while walking a DIMENSION block
  const emitPoly=(pts, M, e, dash)=>{
    if(!pts||pts.length<2) return;
    const O=v2Ocs(e); const T=O? m2Mul(M,O) : M;
    out.polys.push({ _src:e.type, _layer:e.layer, _dim:curDim, pts:pts.map(p=>{ const q=m2Apply(T,p); return [q[0]*mm, q[1]*mm]; }),
      dash:(dash!==undefined?dash:dashFor({name:e.layer, lineTypeName:e.lineType})),
      _section:_secLayer({name:e.layer}) });
  };
  const walk=(ents, M, depth)=>{
    if(depth>12) return;
    ents.forEach(e=>{
      if(!e || e.type===undefined) return;
      if(v2NoPlotLayer(e.layer)) return;                 // non-plotting layer
      const O=v2Ocs(e); const T=O? m2Mul(M,O) : M;
      const P=(p)=>{ const q=m2Apply(T,p); return [q[0]*mm, q[1]*mm]; };
      switch(e.type){
        case 'LINE': {
          const v=e.vertices||[];
          if(v.length>=2) emitPoly(v.map(p=>[p.x||0,p.y||0]), M, e);
          else if(e.start&&e.end) emitPoly([[e.start.x,e.start.y],[e.end.x,e.end.y]], M, e);
          break; }
        case 'LWPOLYLINE': case 'POLYLINE': {
          const vs=(e.vertices||[]).map(p=>[p.x||0, p.y||0, p.bulge||0]);
          if(vs.length<2) break;
          const pts=[];
          for(let i=0;i<vs.length;i++){ const a=vs[i]; pts.push([a[0],a[1]]);
            const last=(i===vs.length-1);
            if(!last || e.shape || e.closed){ const b=vs[(i+1)%vs.length];
              v2Bulge([a[0],a[1]],[b[0],b[1]],a[2]).forEach(p=>pts.push(p)); } }
          if(e.shape||e.closed) pts.push([vs[0][0],vs[0][1]]);
          emitPoly(pts, M, e);
          break; }
        case 'ARC': {
          const c=e.center||{x:0,y:0};
          const a0=(e.startAngle||0)*180/Math.PI, a1=(e.endAngle==null?Math.PI*2:e.endAngle)*180/Math.PI;
          emitPoly(v2Arc(c.x||0,c.y||0, e.radius||0, a0, a1), M, e);
          break; }
        case 'CIRCLE': {
          const c=e.center||{x:0,y:0};
          emitPoly(v2Arc(c.x||0,c.y||0, e.radius||0, 0, 360), M, e);
          break; }
        case 'ELLIPSE': { const nz=(e.extrusionDirection&&e.extrusionDirection.z!=null)?e.extrusionDirection.z:1;
          emitPoly(v2Ellipse(e, nz), M, e); break; }
        case 'SPLINE': emitPoly(v2Spline(e), M, e); break;
        case 'TEXT': case 'MTEXT': case 'ATTRIB': case 'ATTDEF': {
          const raw=(e.text!=null?e.text:(e.string!=null?e.string:''));
          const str=(e.type==='MTEXT')? v2MtextPlain(raw) : String(raw||'');
          if(!str) break;
          const sp=e.startPoint||e.position||{x:e.x||0,y:e.y||0};
          const q=P([sp.x||0, sp.y||0]);
          const scaleRot=Math.atan2(M[1],M[0])*180/Math.PI;
          const hgt=(e.textHeight||e.height||2.5)*mm*Math.hypot(M[0],M[1]);
          out.texts.push({ _dim:curDim, x:q[0], y:q[1], h:hgt, text:str,
            rot:(curDim? curDimTextRot : v2TextRot(e)),
            align:(e.halign!=null?e.halign:(e.horizontalAlignment||0)), scaleRot });
          break; }
        case 'SOLID': case 'TRACE': case '3DFACE': {
          const cs=(e.points||e.corners||e.vertices||[]).filter(Boolean);
          if(cs.length>=3){ const order=(cs.length===4)?[0,1,3,2]:cs.map((_,i)=>i);
            const sd=order.map(k=>P([cs[k].x||0, cs[k].y||0]));

            out.solids.push(sd); }
          break; }
        case 'POINT': { const p=e.position||{x:e.x||0,y:e.y||0}; out.marks.push(P([p.x||0,p.y||0])); break; }
        case 'HATCH': {
          const loops=v2HatchLoops(e);
          if(!loops.length){ hatchIssues++; break; }
          out.hatches.push({
            loops:loops.map(L=>L.map(p=>P(p))),
            solid:!!e.isSolid || /SOLID/i.test(e.patternName||''),
            angle:(e.patternAngle||0), scale:(e.patternScale==null?1:e.patternScale),
            style:(e.hatchStyle||0), pattern:e.patternName||'',
            lines:(e.definitionLines||[]).map(L=>({ angle:L.angle||0,
              bx:(L.base&&L.base.x)||0, by:(L.base&&L.base.y)||0,
              ox:(L.offset&&L.offset.x)||0, oy:(L.offset&&L.offset.y)||0 })) });
          break; }
        case 'INSERT': {
          const b=blocks[e.name];
          if(!b || !b.entities){ skipped['INSERT('+(e.name||'?')+')']=(skipped['INSERT('+(e.name||'?')+')']||0)+1; break; }
          const bo=b.position||{x:0,y:0};
          const local=m2Mul(m2FromInsert(e), [1,0,0,1,-(bo.x||0),-(bo.y||0)]);
          walk(b.entities, m2Mul(M, local), depth+1);
          break; }
        case 'DIMENSION': {
          const bn=e.block||e.blockName;
          const b=bn&&blocks[bn];
          if(b && b.entities){
            // Everything the dimension block draws (extension lines, dimension line,
            // arrowheads and the value text) belongs to ONE dimension, so tag it and
            // let the editor treat it as a single selectable unit.
            const prev=curDim; curDim='dim'+(dimSeq++);
            const prevRot=curDimTextRot; curDimTextRot=v2DimTextRot(e);
            walk(b.entities, M, depth+1);
            curDim=prev; curDimTextRot=prevRot;
          } else skipped['DIMENSION']=(skipped['DIMENSION']||0)+1;
          break; }
        case 'LEADER': case 'MLEADER': case 'MULTILEADER': {
          const vs=(e.vertices||e.points||[]).filter(Boolean).map(p=>[p.x||0,p.y||0]);
          if(vs.length>=2) emitPoly(vs, M, e, null); else skipped[e.type]=(skipped[e.type]||0)+1;
          break; }
        case 'VERTEX': case 'SEQEND': case 'VIEWPORT': case 'ATTDEF_END': break;
        default: skipped[e.type]=(skipped[e.type]||0)+1;
      }
    });
  };
  walk(roots, m2Id(), 0);
  return {out, skipped, hatchIssues, spaceInfo, mm};
}

/* ============================================================================
   CLUSTER GUARD — file-agnostic protection against scattered imports.
   Some DXF files legitimately place stray geometry far from the drawing (leftover
   construction lines, a second layout, symbols parked off-sheet). Rather than
   guessing why, we detect spatially separated clusters after import, keep the
   dominant one and report the rest so the user can bring them back with one click.
   ========================================================================== */
function primBBox(kind, item){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  const add=(x,y)=>{ if(x<a)a=x; if(y<b)b=y; if(x>c)c=x; if(y>d)d=y; };
  if(kind==='poly') item.pts.forEach(p=>add(p[0],p[1]));
  else if(kind==='text') add(item.x,item.y);
  else if(kind==='solid') item.forEach(p=>add(p[0],p[1]));
  else if(kind==='mark') add(item[0],item[1]);
  else if(kind==='hatch') item.loops.forEach(L=>L.forEach(p=>add(p[0],p[1])));
  else if(kind==='cline') add(item.x,item.y);
  if(a>c) return null;
  return {minx:a,miny:b,maxx:c,maxy:d,cx:(a+c)/2,cy:(b+d)/2};
}
function collectPrims(d){
  const out=[];
  (d.polys||[]).forEach((p,i)=>out.push({k:'poly',i,bb:primBBox('poly',p)}));
  (d.texts||[]).forEach((p,i)=>out.push({k:'text',i,bb:primBBox('text',p)}));
  (d.solids||[]).forEach((p,i)=>out.push({k:'solid',i,bb:primBBox('solid',p)}));
  (d.marks||[]).forEach((p,i)=>out.push({k:'mark',i,bb:primBBox('mark',p)}));
  (d.hatches||[]).forEach((p,i)=>out.push({k:'hatch',i,bb:primBBox('hatch',p)}));
  (d.clines||[]).forEach((p,i)=>out.push({k:'cline',i,bb:primBBox('cline',p)}));
  return out.filter(x=>x.bb);
}
/* Grid-based union of primitives: anything closer than `gap` joins the same cluster. */
function detectClusters(d){
  const items=collectPrims(d);
  if(items.length<2) return [];
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  items.forEach(it=>{ mnx=Math.min(mnx,it.bb.minx); mny=Math.min(mny,it.bb.miny);
    mxx=Math.max(mxx,it.bb.maxx); mxy=Math.max(mxy,it.bb.maxy); });
  const span=Math.max(mxx-mnx, mxy-mny);
  if(span<=0) return [];
  // A multi-view drawing legitimately spaces its views apart, so the separation that
  // counts as "somewhere else entirely" has to be large - a quarter of the drawing.
  const gap=Math.max(span*0.25, 10);
  const parent=items.map((_,i)=>i);
  const find=(x)=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  const uni=(x,y)=>{ x=find(x); y=find(y); if(x!==y) parent[y]=x; };
  // bucket by grid cell so this stays near-linear even for thousands of primitives
  const cell=gap; const grid=new Map();
  const key=(gx,gy)=>gx+'|'+gy;
  items.forEach((it,idx)=>{
    const gx0=Math.floor((it.bb.minx-gap)/cell), gx1=Math.floor((it.bb.maxx+gap)/cell);
    const gy0=Math.floor((it.bb.miny-gap)/cell), gy1=Math.floor((it.bb.maxy+gap)/cell);
    for(let gx=gx0;gx<=gx1;gx++) for(let gy=gy0;gy<=gy1;gy++){
      const k=key(gx,gy); const arr=grid.get(k); if(arr) arr.push(idx); else grid.set(k,[idx]);
    }
  });
  const near=(A,B)=> !(A.maxx+gap<B.minx || A.minx-gap>B.maxx || A.maxy+gap<B.miny || A.miny-gap>B.maxy);
  grid.forEach(arr=>{ for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
    if(near(items[arr[i]].bb, items[arr[j]].bb)) uni(arr[i],arr[j]); } });
  const groups=new Map();
  items.forEach((it,idx)=>{ const r=find(idx); const g=groups.get(r);
    if(g){ g.items.push(it); g.bb.minx=Math.min(g.bb.minx,it.bb.minx); g.bb.miny=Math.min(g.bb.miny,it.bb.miny);
           g.bb.maxx=Math.max(g.bb.maxx,it.bb.maxx); g.bb.maxy=Math.max(g.bb.maxy,it.bb.maxy); }
    else groups.set(r,{items:[it], bb:{minx:it.bb.minx,miny:it.bb.miny,maxx:it.bb.maxx,maxy:it.bb.maxy}});
  });
  const list=[...groups.values()].map(g=>({ items:g.items, bb:g.bb, n:g.items.length,
    area:Math.max(1,(g.bb.maxx-g.bb.minx))*Math.max(1,(g.bb.maxy-g.bb.miny)) }));
  list.sort((a,b)=>(b.n-a.n)||(b.area-a.area));
  return list;
}
function pickCluster(d, cluster){
  const keep={polys:new Set(),texts:new Set(),solids:new Set(),marks:new Set(),hatches:new Set(),clines:new Set()};
  const map={poly:'polys',text:'texts',solid:'solids',mark:'marks',hatch:'hatches',cline:'clines'};
  cluster.items.forEach(it=>keep[map[it.k]].add(it.i));
  const sub={};
  Object.keys(map).forEach(k=>{});
  ['polys','texts','solids','marks','hatches','clines'].forEach(list=>{
    sub[list]=(d[list]||[]).filter((_,i)=>keep[list].has(i));
  });
  return sub;
}
/* Applied right after import: keeps the dominant cluster when the rest is clearly
   detached and minor, and always reports what happened. Never deletes anything —
   the full import is stashed so it can be restored from the report panel. */
function applyClusterGuard(pg){
  const d=pg.dxf; if(!d) return null;
  const list=detectClusters(d);
  if(list.length<2) return null;
  const total=list.reduce((n,c)=>n+c.n,0);
  const main=list[0];
  // Only step in when the stray content is clearly a minority; otherwise the file
  // genuinely contains several drawings and we must not hide any of them.
  if(main.n/total < 0.85) return null;
  pg._allDxf=d;                                     // stash the complete import
  pg._clusters=list.map(c=>({n:c.n, bb:c.bb}));
  pg.dxf=pickCluster(d, main);

function dxfBBox(pg){
  if(pg.objects&&pg.objects.length){ let a=1e9,b=1e9,c=-1e9,d2=-1e9,any=false;
    pg.objects.forEach(ob=>{ const bb=objBBox(ob); if(bb){ any=true; if(bb.minx<a)a=bb.minx; if(bb.miny<b)b=bb.miny; if(bb.maxx>c)c=bb.maxx; if(bb.maxy>d2)d2=bb.maxy; } });
    if(any) return {minx:a,miny:b,maxx:c,maxy:d2}; }
  const d=pg.dxf; if(!d) return null;
  let mnx=Infinity,mny=Infinity,mxx=-Infinity,mxy=-Infinity;
  const add=(x,y)=>{ if(!Number.isFinite(x)||!Number.isFinite(y))return;
    if(x<mnx)mnx=x; if(y<mny)mny=y; if(x>mxx)mxx=x; if(y>mxy)mxy=y; };
  d.polys.forEach(p=>p.pts.forEach(pt=>add(pt[0],pt[1])));
  d.texts.forEach(t=>add(t.x,t.y));
  d.hatches.forEach(h=>h.loops.forEach(l=>l.forEach(pt=>add(pt[0],pt[1]))));
  (d.solids||[]).forEach(sd=>sd.forEach(pt=>add(pt[0],pt[1])));
  (d.marks||[]).forEach(m=>add(m[0],m[1]));
  if(mnx===Infinity) return null;
  return {minx:mnx,miny:mny,maxx:mxx,maxy:mxy};
}
/* Flip / rotate the whole imported drawing. Some CAD exports arrive mirrored or
   turned relative to how the drawing is meant to read; rather than guessing per
   file, the user can correct any of it in one click and the change is undoable. */
function transformDXF(pg, kind){
  const d=pg&&pg.dxf; if(!d) return;
  const bb=dxfBBox(pg); if(!bb) return;
  const cx=(bb.minx+bb.maxx)/2, cy=(bb.miny+bb.maxy)/2;
  let M;
  if(kind==='flipH')      M=(p)=>[2*cx-p[0], p[1]];
  else if(kind==='flipV') M=(p)=>[p[0], 2*cy-p[1]];
  else if(kind==='rot90') M=(p)=>[cx+(p[1]-cy), cy-(p[0]-cx)];
  else if(kind==='rot270')M=(p)=>[cx-(p[1]-cy), cy+(p[0]-cx)];
  else return;
  const dRot=(kind==='rot90')?-90:(kind==='rot270')?90:0;
  snapshot();
  d.polys.forEach(p=>p.pts=p.pts.map(M));
  d.hatches.forEach(h=>h.loops=h.loops.map(l=>l.map(M)));
  (d.solids||[]).forEach((sd,i)=>d.solids[i]=sd.map(M));
  (d.marks||[]).forEach((mk,i)=>d.marks[i]=M(mk));
  (d.clines||[]).forEach(c=>{ const q=M([c.x,c.y]); c.x=q[0]; c.y=q[1];
    if(kind==='flipH'){ c.dx=-c.dx; } else if(kind==='flipV'){ c.dy=-c.dy; }
    else { const t=c.dx; c.dx=(kind==='rot90')? c.dy : -c.dy; c.dy=(kind==='rot90')? -t : t; } });
  d.texts.forEach(t=>{ const q=M([t.x,t.y]); t.x=q[0]; t.y=q[1];
    if(dRot) t.rot=(t.rot||0)+dRot;                       // keep text reading along the geometry
    else if(kind==='flipH') t.rot=180-(t.rot||0);
    else if(kind==='flipV') t.rot=-(t.rot||0);
    // keep glyphs upright and readable
    let r=((t.rot||0)%360+360)%360; if(r>90 && r<270) r-=180; t.rot=r;
  });
  if(pg._allDxf && pg._allDxf!==d){ /* stash stays as imported */ }
  buildObjects(pg); afterMutate();
}
function openOrientMenu(){
  let m=$('#orientMenu');
  if(!m){ m=el('div'); m.id='orientMenu'; m.className='ctx-menu';
    m.innerHTML='<div class="ctx-item" data-k="flipV"><i class="bi bi-symmetry-horizontal"></i> Flip vertically</div>'
               +'<div class="ctx-item" data-k="flipH"><i class="bi bi-symmetry-vertical"></i> Flip horizontally</div>'
               +'<div class="ctx-item" data-k="rot90"><i class="bi bi-arrow-clockwise"></i> Rotate 90° clockwise</div>'
               +'<div class="ctx-item" data-k="rot270"><i class="bi bi-arrow-counterclockwise"></i> Rotate 90° anticlockwise</div>';
